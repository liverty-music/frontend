<import from="./circular-progress.css"></import>

  aria-label.bind="accessibleName"
  class="circular-progress"
  data-size.bind="size"
>

    <circle class="arc" cx="24" cy="24" r="22" pathLength="100"></circle>
  </svg>
</span>
