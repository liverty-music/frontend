<import from="./snack-bar.css"></import>
<import from="./snack-item"></import>

<!-- One snack is shown at a time; the others wait in the view-model. The
     `message` and `action` slots pass through to the item, so an app that
     projects them receives the shown snack as `$host.snack`. -->
<aside class="[ snack-stack ]">
  <snack-item
    repeat.for="snack of snacks"
    snack.bind="snack"
    leaving.bind="leaving"
    icons.bind="icons"
    dismissible.bind="dismissible"
    close-label.bind="closeLabel"
    popover="manual"
    role="status"
    class="snack-item"
    data-severity.bind="snack.severity"
    snack-exited.trigger="onExited(snack)"
  >
    <template au-slot="message"><au-slot name="message" expose.bind="{ snack }">${snack.message}</au-slot></template>
    <template au-slot="action"><au-slot name="action" expose.bind="{ snack }">${snack.action.label}</au-slot></template>
  </snack-item>
</aside>
