<import from="./reception-tab.css"></import>

<section class="reception-tab">
  <template switch.bind="prerequisite">
    <prerequisite-callout case="notPublished" heading.bind="'reception.prerequisite.notPublished' & t">
      <p>${'reception.prerequisite.notPublishedBody' & t}</p>
      <console-button variant="text" click.trigger="requestPublish()">${'event.publish' & t}</console-button>
    </prerequisite-callout>
    <prerequisite-callout
      case="noStartTime"
      heading.bind="'reception.prerequisite.noStartTime' & t"
      action-label.bind="'sale.prerequisite.editConcert' & t"
      action-href.bind="editConcertHref"
    >${'reception.prerequisite.noStartTimeBody' & t}</prerequisite-callout>
  </template>

  <template if.bind="!prerequisite">
    <div class="about">
      <p if.bind="admission">${'reception.window' & t} ${admission.open | jstDateTime} 〜 ${admission.close | jstDateTime}</p>
      <p>${'reception.oneDevice' & t}</p>
      <a href.bind="guideUrl" target="_blank" rel="noopener" class="guide">${'reception.guide' & t}</a>
    </div>

    <console-button variant="filled" icon="add" pending.bind="issuing" pending-label.bind="'reception.issuing' & t" click.trigger="issue()">${'reception.issue' & t}</console-button>

    <circular-progress if.bind="state === 'loading'"></circular-progress>
    <div if.bind="state === 'error'" class="message" role="alert">
      <p>${'reception.loadFailed' & t}</p>
      <console-button variant="tonal" click.trigger="load()">${'common.retry' & t}</console-button>
    </div>

    <ul if.bind="state === 'ready' && rows.length" class="scanners" aria-label.bind="'event.tab.reception' & t">
      <li repeat.for="row of rows; key: id" class="scanner" data-scanner.bind="row.number" data-new.bind="row.isNew">
        <div class="scanner-header">
          <h3 class="scanner-name">${'reception.label' & t:{ number: row.number }}</h3>
          <status-badge tone.bind="row.tone" label.bind="row.statusKey & t"></status-badge>
          <span if.bind="row.boundSince" class="since">${'reception.since' & t} ${row.boundSince | jstDateTime}</span>
        </div>
        <copy-field if.bind="row.url" label.bind="'reception.label' & t:{ number: row.number }" value.bind="row.url"></copy-field>
        <div class="scanner-actions">
          <console-button if.bind="row.url && canShare" variant="text" click.trigger="share(row)">${'reception.share' & t}</console-button>
          <console-button if.bind="row.canRevoke" variant="text" click.trigger="revoke(row, false)">${'reception.revoke' & t}</console-button>
          <console-button if.bind="row.canRevoke" variant="text" click.trigger="revoke(row, true)">${'reception.revokeAndReissue' & t}</console-button>
        </div>
      </li>
    </ul>
    <p if.bind="state === 'ready' && !rows.length" class="message">${'reception.empty' & t}</p>
  </template>

  <confirm-dialog
    component.ref="confirmDialog"
    heading-key.bind="confirmTitleKey"
    heading-params.bind="{ number: confirmNumber }"
    confirm-key.bind="confirmKey"
    confirm-variant="danger"
  >${'reception.confirmBody' & t:{ number: confirmNumber }}</confirm-dialog>
</section>
