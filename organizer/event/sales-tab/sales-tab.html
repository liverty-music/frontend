<import from="./sales-tab.css"></import>

<section class="sales-tab">
  <template switch.bind="prerequisite">
    <prerequisite-callout case="notPublished" heading.bind="'sale.prerequisite.notPublished' & t">
      <p>${'sale.prerequisite.notPublishedBody' & t}</p>
      <console-button variant="text" click.trigger="requestPublish()">${'event.publish' & t}</console-button>
    </prerequisite-callout>
    <prerequisite-callout
      case="noStartTime"
      heading.bind="'sale.prerequisite.noStartTime' & t"
      action-label.bind="'sale.prerequisite.editConcert' & t"
      action-href.bind="editConcertHref"
    >${'sale.prerequisite.noStartTimeBody' & t}</prerequisite-callout>
    <prerequisite-callout case="businessDetails" heading.bind="'sale.prerequisite.businessDetails' & t">
      ${'sale.prerequisite.businessDetailsBody' & t}
    </prerequisite-callout>
  </template>

  <circular-progress if.bind="state === 'loading'"></circular-progress>
  <div if.bind="state === 'error'" class="message" role="alert">
    <p>${'sale.loadFailed' & t}</p>
    <console-button variant="tonal" click.trigger="load()">${'common.retry' & t}</console-button>
  </div>

  <template if.bind="state === 'ready'">
    <p if.bind="!sales.length" class="message">${'sale.empty' & t}</p>

    <ul if.bind="sales.length" class="sales" aria-label.bind="'event.tab.sales' & t">
      <li repeat.for="sale of sales; key: id" class="sale" data-sale.bind="sale.id" data-state.bind="sale.state">
        <header class="sale-header">
          <h3 class="sale-name">${sale.name}</h3>
          <span class="method">${`sale.method.${sale.method}` & t}</span>
          <status-badge tone.bind="sale.tone" label.bind="sale.stateKey & t"></status-badge>
        </header>

        <p if.bind="sale.countdown" class="countdown">
          <template if.bind="sale.countdown.days">${'sale.countdown.days' & t:{ days: sale.countdown.days, hours: sale.countdown.hours }}</template>
          <template else>${'sale.countdown.hours' & t:{ hours: sale.countdown.hours, minutes: sale.countdown.minutes }}</template>
        </p>

        <p class="window">${sale | jstRange}</p>
        <p class="terms">
          ${sale.price | yen} · ${'sale.quantity' & t:{ tickets: sale.quantity }} · ${'sale.perAccount' & t:{ limit: sale.perAccountLimit }}
        </p>

        <div if.bind="sale.lottery && sale.state !== 'scheduled'" class="stats">
          <template if.bind="sale.state === 'drawn'">
            <stat-tile label.bind="'sale.stats.won' & t" value.bind="sale.lottery.won | count"></stat-tile>
            <stat-tile label.bind="'sale.stats.wonTickets' & t" value.bind="sale.lottery.wonTickets | count"></stat-tile>
            <stat-tile label.bind="'sale.stats.lost' & t" value.bind="sale.lottery.lost | count"></stat-tile>
          </template>
          <template else>
            <stat-tile label.bind="'sale.stats.entries' & t" value.bind="sale.lottery.entries | count"></stat-tile>
            <stat-tile label.bind="'sale.stats.requested' & t" value.bind="sale.lottery.requested | count"></stat-tile>
            <stat-tile label.bind="'sale.stats.quantity' & t" value.bind="sale.quantity | count"></stat-tile>
          </template>
        </div>
        <p if.bind="sale.lottery.oversubscribedPercent && sale.state !== 'drawn'" class="oversubscribed">
          ${'sale.oversubscribed' & t:{ percent: sale.lottery.oversubscribedPercent }}
        </p>

        <div if.bind="sale.firstCome" class="stats">
          <stat-tile label.bind="'sale.stats.sold' & t" value.bind="sale.firstCome.sold | count"></stat-tile>
          <stat-tile label.bind="'sale.stats.held' & t" value.bind="sale.firstCome.held | count"></stat-tile>
          <stat-tile label.bind="'sale.stats.quantity' & t" value.bind="sale.quantity | count"></stat-tile>
        </div>

        <div class="verification">
          <console-field
            type="select"
            label.bind="'sale.verification.label' & t"
            value.to-view="String(sale.verification)"
            options.bind="verificationOptions"
            hint.bind="'sale.verification.note' & t"
            change.trigger="changeVerification(sale, $event.target.value)"
          ></console-field>
        </div>

        <div class="sale-actions">
          <console-button if.bind="sale.editable" variant="outlined" icon="edit" href.bind="editHref(sale)">${'common.edit' & t}</console-button>
          <template else>
            <console-button variant="outlined" icon="edit" disabled.bind="true">${'common.edit' & t}</console-button>
            <span class="locked">${'sale.lockedAfterOpen' & t}</span>
          </template>
        </div>
      </li>
    </ul>

    <div if.bind="!prerequisite" class="start-actions">
      <console-button variant="filled" icon="add" href.bind="newLotteryHref">${'sale.startLottery' & t}</console-button>
      <console-button if.bind="!hasFirstCome" variant="tonal" icon="add" href.bind="firstComeHref">${'sale.startFirstCome' & t}</console-button>
    </div>
  </template>
</section>
