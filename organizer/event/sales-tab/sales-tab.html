<import from="./sales-tab.css"></import>

<section class="sales-tab">
  <div if.bind="state === 'error'" class="message" role="alert">
    <p>${'sale.loadFailed' & t}</p>
    <console-button variant="tonal" click.trigger="load()">${'common.retry' & t}</console-button>
  </div>

  <template if.bind="state === 'ready'">
    <template switch.bind="prerequisite">
      <prerequisite-callout
        case="notPublished"
        guide-chapter="publish"
        level.bind="2"
        heading.bind="'sale.prerequisite.notPublished' & t"
        action-label.bind="'event.publish' & t"
        action.trigger="requestPublish()"
      >${'sale.prerequisite.notPublishedBody' & t}</prerequisite-callout>
      <prerequisite-callout
        case="noStartTime"
        guide-chapter="publish"
        level.bind="2"
        heading.bind="'sale.prerequisite.noStartTime' & t"
        action-label.bind="'sale.prerequisite.editConcert' & t"
        action-href.bind="editConcertHref"
      >${'sale.prerequisite.noStartTimeBody' & t}</prerequisite-callout>
      <prerequisite-callout case="noStock" guide-chapter="sell" level.bind="2" heading.bind="'sale.prerequisite.noStock' & t">
        ${'sale.prerequisite.noStockBody' & t}
      </prerequisite-callout>
      <prerequisite-callout case="businessDetails" level.bind="2" guide-chapter="business-and-payout" heading.bind="'sale.prerequisite.businessDetails' & t">
        ${'sale.prerequisite.businessDetailsBody' & t}
      </prerequisite-callout>
    </template>

    <!-- 席種と枚数: shown whatever the prerequisites; every sale of the date sells these. -->
    <section class="[ stocks ] [ flow ]" aria-labelledby="stocks-title" data-testid="ticket-stocks">
      <h2 id="stocks-title" class="section-title">${'stock.title' & t}</h2>
      <p class="note">${'stock.note' & t}</p>

      <div if.bind="!seatTypes.length" class="message">
        <p>${'stock.noSeatTypes' & t}</p>
        <console-button variant="tonal" href.bind="concertHref">${'stock.toConcert' & t}</console-button>
      </div>

      <ul if.bind="stocks.length" class="stock-list" aria-labelledby="stocks-title">
        <li repeat.for="stock of stocks; key: id" class="stock" data-stock.bind="stock.id">
          <div class="stock-heading">
            <h3 class="stock-name">${stock.name}</h3>
            <status-badge tone.bind="stock.tone" label.bind="stock.stateKey & t"></status-badge>
          </div>
          <p class="terms">${stock.price | yen} ${'stock.taxIncluded' & t} · ${'sale.quantity' & t:{ tickets: stock.quantity }}</p>
          <div class="stats">
            <stat-tile label.bind="'sale.stats.sold' & t" value.bind="stock.sold | count"></stat-tile>
            <stat-tile label.bind="'sale.stats.held' & t" value.bind="stock.held | count"></stat-tile>
            <stat-tile label.bind="'sale.stats.quantity' & t" value.bind="stock.quantity | count"></stat-tile>
          </div>
          <div if.bind="stock.deletable && canStock" class="sale-actions">
            <console-button variant="text" click.trigger="deleteStock(stock)">${'common.delete' & t}</console-button>
          </div>
        </li>
      </ul>
      <p if.bind="!stocks.length && seatTypes.length" class="message">${'stock.empty' & t}</p>

      <form if.bind="canStock && unstockedSeatTypes.length" class="stock-form" novalidate submit.trigger="false">
        <h3 class="form-title">${'stock.add' & t}</h3>
        <div class="row">
          <console-field
            type="select"
            label.bind="'stock.seatType' & t"
            value.bind="stockForm.seatTypeId"
            options.bind="seatTypeOptions"
            required.bind="true"
            error.bind="stockError(stockErrors.seatTypeId, stockSubmitted) || stockProblem"
            data-field="stock-seat-type"
          ></console-field>
          <console-field
            type="number"
            label.bind="'stock.quantity' & t"
            value.bind="stockForm.quantity"
            required.bind="true"
            hint.bind="'stock.quantityHint' & t"
            error.bind="stockError(stockErrors.quantity, stockSubmitted)"
            data-field="stock-quantity"
          ></console-field>
        </div>
        <div class="sale-actions">
          <console-button variant="outlined" icon="add" action.bind="() => addStock()" pending-label.bind="'common.saving' & t">${'stock.add' & t}</console-button>
        </div>
      </form>
    </section>

    <section class="[ sales-section ] [ flow ]" aria-labelledby="sales-title">
      <h2 id="sales-title" class="section-title">${'sale.title' & t}</h2>
      <p if.bind="stocks.length" class="note">${'sale.sharedStocks' & t:{ limit: perAccountLimit }}</p>
      <p if.bind="!sales.length" class="message">${'sale.empty' & t}</p>

      <div if.bind="!prerequisite" class="start-actions">
        <console-button variant="outlined" icon="add" href.bind="newLotteryHref">${'sale.startLottery' & t}</console-button>
        <console-button if.bind="!hasFirstCome" variant="outlined" icon="add" href.bind="firstComeHref">${'sale.startFirstCome' & t}</console-button>
      </div>

      <!-- One card per sale: it holds several different actions (M3 Cards). -->
      <ul if.bind="sales.length" class="sales" aria-label.bind="'event.tab.sales' & t">
        <li repeat.for="sale of sales; key: id" class="sale" data-sale.bind="sale.id" data-state.bind="sale.state">
          <div class="sale-heading">
            <h3 class="sale-name">${sale.name}</h3>
            <status-badge tone.bind="sale.tone" label.bind="sale.stateKey & t"></status-badge>
          </div>
          <p class="window">
            <span class="method">${`sale.method.${sale.method}` & t}</span> · ${sale | jstRange}
          </p>

          <p if.bind="sale.countdown" class="countdown">
            <template if.bind="sale.countdown.days">${'sale.countdown.days' & t:{ days: sale.countdown.days, hours: sale.countdown.hours }}</template>
            <template else>${'sale.countdown.hours' & t:{ hours: sale.countdown.hours, minutes: sale.countdown.minutes }}</template>
          </p>

          <div if.bind="sale.lottery && sale.state === 'drawn'" class="stats">
            <stat-tile label.bind="'sale.stats.won' & t" value.bind="sale.lottery.won | count"></stat-tile>
            <stat-tile label.bind="'sale.stats.wonTickets' & t" value.bind="sale.lottery.wonTickets | count"></stat-tile>
            <stat-tile label.bind="'sale.stats.lost' & t" value.bind="sale.lottery.lost | count"></stat-tile>
          </div>
          <ul if.bind="sale.lottery && (sale.state === 'open' || sale.state === 'awaitingDraw')" class="lottery-stocks">
            <li repeat.for="stock of sale.lottery.stocks; key: id" class="lottery-stock" data-lottery-stock.bind="stock.id">
              <h4 class="stock-name">${stock.name}</h4>
              <div class="stats">
                <stat-tile label.bind="'sale.stats.entries' & t" value.bind="stock.entries | count"></stat-tile>
                <stat-tile label.bind="'sale.stats.requested' & t" value.bind="stock.requested | count"></stat-tile>
                <stat-tile label.bind="'sale.stats.remaining' & t" value.bind="stock.remaining | count"></stat-tile>
              </div>
              <p if.bind="stock.oversubscribedPercent" class="oversubscribed">
                ${'sale.oversubscribed' & t:{ percent: stock.oversubscribedPercent }}
              </p>
            </li>
          </ul>

          <console-field
            class="verification"
            type="select"
            label.bind="'sale.verification.label' & t"
            value.to-view="String(sale.verification)"
            options.bind="verificationOptions"
            hint.bind="'sale.verification.note' & t"
            change.trigger="changeVerification(sale, $event.detail.value)"
          ></console-field>

          <div class="sale-actions">
            <console-button if.bind="sale.editable" variant="text" icon="edit" href.bind="editHref(sale)">${'common.edit' & t}</console-button>
            <template else>
              <span class="locked">${'sale.lockedAfterOpen' & t}</span>
              <console-button variant="text" icon="edit" disabled.bind="true">${'common.edit' & t}</console-button>
            </template>
          </div>
        </li>
      </ul>
    </section>

    <!-- Purchases per referral code: only once the event has a sale. Read-only. -->
    <section if.bind="sales.length" class="[ referrals ] [ flow ]" aria-labelledby="referrals-title" data-testid="referrals">
      <h2 id="referrals-title" class="referrals-title">${'sale.referral.title' & t}</h2>
      <p class="referrals-note">${'sale.referral.note' & t}</p>
      <data-list
        if.bind="referralRows.length"
        columns.bind="referralColumns"
        rows.bind="referralRows"
        label.bind="'sale.referral.title' & t"
      ></data-list>
      <p else class="message">${'sale.referral.empty' & t}</p>
    </section>

    <confirm-dialog
      component.ref="addStockDialog"
      heading-key="stock.addConfirmTitle"
      heading-params.bind="addStockParams"
      confirm-key="stock.add"
    >${'stock.addConfirmBody' & t}</confirm-dialog>
    <confirm-dialog
      component.ref="deleteStockDialog"
      heading-key="stock.deleteConfirmTitle"
      heading-params.bind="{ name: stockToDelete.name }"
      confirm-key="common.delete"
      confirm-variant="danger"
    >${'stock.deleteConfirmBody' & t}</confirm-dialog>
  </template>
</section>
