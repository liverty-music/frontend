<import from="./ticket-sale-editor-route.css"></import>

<section class="first-come-editor">
  <h1 class="page-title">${(sale ? 'firstComeEditor.changeTitle' : 'firstComeEditor.newTitle') & t}</h1>
  <p if.bind="event" class="context">
    ${title} · <template if.bind="start">${start | jstDateTime}</template> · ${venue}
  </p>

  <div if.bind="state === 'notFound'" class="message" role="alert">
    <p>${'event.notFound' & t}</p>
    <console-button variant="tonal" href.bind="concertsHref">${'concert.toConcerts' & t}</console-button>
  </div>
  <div if.bind="state === 'error'" class="message" role="alert">
    <p>${'firstComeEditor.loadFailed' & t}</p>
    <console-button variant="tonal" href.bind="salesHref">${'lotteryEditor.toSales' & t}</console-button>
  </div>

  <template if.bind="state === 'ready'">
    <div repeat.for="block of blocks" switch.bind="block">
      <prerequisite-callout case="cancelled" level.bind="2" heading.bind="'event.cancelledNote' & t"></prerequisite-callout>
      <prerequisite-callout case="notPublished" level.bind="2" guide-chapter="publish" heading.bind="'sale.prerequisite.notPublished' & t" action-label.bind="'lotteryEditor.toSales' & t" action-href.bind="salesHref">
        ${'sale.prerequisite.notPublishedBody' & t}
      </prerequisite-callout>
      <prerequisite-callout case="noStartTime" level.bind="2" guide-chapter="publish" heading.bind="'sale.prerequisite.noStartTime' & t" action-label.bind="'sale.prerequisite.editConcert' & t" action-href.bind="editConcertHref">
        ${'sale.prerequisite.noStartTimeBody' & t}
      </prerequisite-callout>
      <prerequisite-callout case="noStock" level.bind="2" guide-chapter="sell" heading.bind="'sale.prerequisite.noStock' & t" action-label.bind="'saleEditor.toStocks' & t" action-href.bind="salesHref">
        ${'saleEditor.noStockBody' & t}
      </prerequisite-callout>
      <prerequisite-callout case="businessDetails" level.bind="2" guide-chapter="business-and-payout" heading.bind="'sale.prerequisite.businessDetails' & t">
        ${'sale.prerequisite.businessDetailsBody' & t}
      </prerequisite-callout>
    </div>

    <form if.bind="!blocks.length" class="form" novalidate submit.trigger="false">
      <p class="note">${'common.requiredNote' & t}</p>
      <console-field
        if.bind="!sale"
        label.bind="'lotteryEditor.name' & t"
        value.bind="model.name"
        required.bind="true"
        error.bind="error(errors.name, submitted)"
      ></console-field>
      <div else class="fixed">
        <span class="label">${'lotteryEditor.name' & t}</span>
        <span>${model.name}</span>
      </div>
      <h2 class="section-title">${'firstComeEditor.sections.window' & t}</h2>
      <div class="row">
        <console-field
          type="date"
          label.bind="'firstComeEditor.startDate' & t"
          value.bind="model.saleStart.date"
          required.bind="true"
          error.bind="error(errors.saleStartDate, submitted)"
          data-field="start"
        ></console-field>
        <console-time-field
          label.bind="'firstComeEditor.startTime' & t"
          value.bind="model.saleStart.time"
          required.bind="true"
          error.bind="error(errors.saleStartTime, submitted)"
          data-field="start-time"
        ></console-time-field>
      </div>
      <div class="row">
        <console-field
          type="date"
          label.bind="'firstComeEditor.endDate' & t"
          value.bind="model.saleEnd.date"
          required.bind="true"
          hint.bind="'firstComeEditor.endHint' & t"
          error.bind="error(errors.saleEndDate, submitted)"
          data-field="end"
        ></console-field>
        <console-time-field
          label.bind="'firstComeEditor.endTime' & t"
          value.bind="model.saleEnd.time"
          required.bind="true"
          error.bind="error(errors.saleEndTime, submitted)"
          data-field="end-time"
        ></console-time-field>
      </div>
      <section class="tickets" aria-labelledby="first-come-tickets">
        <h2 id="first-come-tickets" class="section-title">${'firstComeEditor.sections.tickets' & t}</h2>
        <p class="note">${'saleEditor.sellsEveryStock' & t:{ limit: perAccountLimit }}</p>
        <ul class="stock-list">
          <li repeat.for="stock of stocks; key: id" class="stock" data-stock.bind="stock.id">
            <span class="stock-name">${stock.name}</span>
            <span>${stock.price | yen} ${'stock.taxIncluded' & t} · ${'sale.quantity' & t:{ tickets: stock.quantity }}</span>
          </li>
        </ul>
      </section>

      <p if.bind="saveProblem" class="problem" role="alert"><console-icon name="error"></console-icon><span>${saveProblem & t}</span></p>

      <action-bar>
        <console-button variant="text" href.bind="salesHref">${'common.cancelEdit' & t}</console-button>
        <console-button variant="filled" icon="check" action.bind="() => save()" pending-label.bind="'common.saving' & t">${(sale ? 'common.save' : 'firstComeEditor.create') & t}</console-button>
      </action-bar>
    </form>
  </template>

  <unsaved-changes component.ref="guard" dirty.bind="isDirty"></unsaved-changes>
</section>
