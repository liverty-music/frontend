<import from="./copy-field.css"></import>
<import from="../copy-button/copy-button"></import>
<use-shadow-dom></use-shadow-dom>

<div class="copy-field">
  <span class="[ label ] [ md-typescale-label-large ]">${label}</span>
  <div class="row">
    <span class="[ value ] [ md-typescale-body-medium typeface-mono ]">${value}</span>
    <copy-button label.bind="label" value.bind="value"></copy-button>
  </div>
</div>
