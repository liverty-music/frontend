<import from="./confirm-dialog.css"></import>
<import from="../console-button/console-button"></import>

<dialog
  ref="dialog"
  aria-labelledby.bind="headingId"
  cancel.trigger="onCancel($event)"
>
  <h2 class="heading" id.bind="headingId">${heading}</h2>
  <div class="body"><au-slot></au-slot></div>
  <div class="actions">
    <console-button ref="cancelButton" variant="text" click.trigger="cancel()">${cancelText & signal:'aurelia-translation-signal'}</console-button>
    <console-button variant.bind="confirmVariant" disabled.bind="confirmDisabled" click.trigger="confirm()" data-role="confirm">${confirmLabel}</console-button>
  </div>
</dialog>
