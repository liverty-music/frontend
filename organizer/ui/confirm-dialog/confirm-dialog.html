<import from="./confirm-dialog.css"></import>
<import from="../console-button/console-button"></import>
<use-shadow-dom></use-shadow-dom>

<dialog
  ref="dialog"
  aria-labelledby.bind="headingId"
  cancel.trigger="onCancel($event)"
>
  <h2 class="heading" id.bind="headingId">${headingKey & t:headingParams}</h2>
  <div class="body"><slot></slot></div>
  <div class="actions">
    <console-button component.ref="cancelButton" variant="text" click.trigger="cancel()">${cancelKey & t}</console-button>
    <console-button variant.bind="confirmVariant" disabled.bind="confirmDisabled" click.trigger="confirm()" data-role="confirm">${confirmKey & t}</console-button>
  </div>
</dialog>
