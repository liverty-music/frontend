<import from="./prerequisite-callout.css"></import>
<import from="../console-icon/console-icon"></import>
<use-shadow-dom></use-shadow-dom>

<section class="callout" aria-labelledby.bind="headingId">
  <console-icon name="info" class="icon"></console-icon>
  <div class="content">
    <h2 if.bind="level === 2" class="heading" id.bind="headingId">${heading}</h2>
    <h3 else class="heading" id.bind="headingId">${heading}</h3>
    <div class="body"><slot></slot></div>
    <a if.bind="actionHref" href.bind="actionHref" class="action state-layer">${actionLabel}</a>
    <button if.bind="actionLabel && !actionHref" type="button" class="action state-layer" click.trigger="act()">${actionLabel}</button>
  </div>
</section>
