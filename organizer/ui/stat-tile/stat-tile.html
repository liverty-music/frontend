<import from="./stat-tile.css"></import>
<use-shadow-dom></use-shadow-dom>

<div class="tile">
  <span class="[ label ] [ md-typescale-label-large ]">${label}</span>
  <data class="[ value ] [ md-typescale-headline-small ]">${value}</data>
  <span if.bind="supporting" class="[ supporting ] [ md-typescale-body-small ]">${supporting}</span>
</div>
