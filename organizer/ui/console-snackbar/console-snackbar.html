<import from="./console-snackbar.css"></import>
<import from="../../../shared/ui/snack-bar/snack-bar"></import>
<!-- A light-DOM shared component inside this shadow root takes its styles from here. -->
<import from="../../../shared/ui/snack-bar/snack-bar.css"></import>
<use-shadow-dom></use-shadow-dom>

<snack-bar replace.bind="true" dismissible.bind="true" icons.bind="false" close-label.bind="'common.close' & t">
  <template au-slot="message">${$host.snack.message & t:$host.snack.params}</template>
  <template au-slot="action">${$host.snack.action.label & t}</template>
</snack-bar>
