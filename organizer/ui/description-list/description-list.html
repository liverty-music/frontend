<import from="./description-list.css"></import>
<use-shadow-dom></use-shadow-dom>

<dl class="list">
  <div repeat.for="item of items" class="row">
    <dt class="md-typescale-label-large">${item.termKey & t}</dt>
    <dd class="md-typescale-body-large" data-empty.bind="!item.value">${item.value || emptyLabel}</dd>
  </div>
</dl>
