<import from="./home-route.css"></import>

<section class="home">
  <h1 class="page-title">${'home.title' & t}</h1>

  <template if.bind="!isLoading">
    <div if.bind="payoutState === 'error'" class="part-error" role="alert">
      <span>${'home.payoutUnavailable' & t}</span>
      <console-button variant="text" click.trigger="loadPayout()">${'common.retry' & t}</console-button>
    </div>
    <div if.bind="concertsState === 'error'" class="part-error" role="alert">
      <span>${'home.concertsUnavailable' & t}</span>
      <console-button variant="text" click.trigger="loadConcerts()">${'common.retry' & t}</console-button>
    </div>

    <section if.bind="groups.length" class="groups" aria-label.bind="'home.listLabel' & t" data-testid="home-items">
      <section repeat.for="group of groups; key: kind" class="group" data-group.bind="group.kind">
        <h2 class="subheader" id.bind="`home-${group.kind}`">${`home.kind.${group.kind}` & t}</h2>
        <ul class="list" aria-labelledby.bind="`home-${group.kind}`">
          <li repeat.for="item of group.items; key: key" data-kind.bind="item.kind">
            <list-item href.bind="item.actionHref">
              <template switch.bind="item.kind">
              <template case="payout">${'home.payout' & t}</template>
              <template case="scanner">
                ${item.concertTitle}
                <span slot="supporting">${item.when | jstDateTime} · ${'home.noScanner' & t}</span>
              </template>
              <template case="startTime">
                ${item.concertTitle}
                <span slot="supporting">${item.when | jstDay} · ${'home.noStartTime' & t}</span>
              </template>
              <template case="draft">${item.concertTitle}</template>
              </template>
              <span slot="trailing" class="trailing">
                <template if.bind="item.kind === 'draft'">${item.when | jstDay}</template>
                <template else>${`home.action.${item.kind}` & t}</template>
                <console-icon name="chevron-right"></console-icon>
              </span>
            </list-item>
          </li>
        </ul>
      </section>
    </section>

    <div if.bind="allClear" class="all-clear">
      <console-icon name="check-circle"></console-icon>
      <p>${'home.allClear' & t}</p>
      <console-button variant="tonal" href.bind="context.concertsHref">${'home.toConcerts' & t}</console-button>
    </div>
  </template>
</section>
