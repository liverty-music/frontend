<import from="./auth-callback-route.css"></import>

<main class="[ organizer-callback-layout ] [ stack ]">
  <div if.bind="!failed" class="[ organizer-callback-loading ] [ stack ]" role="status">
    <circular-progress label.bind="'authCallback.verifying' & t"></circular-progress>
    <p class="[ organizer-callback-status ] [ md-typescale-body-large ]">${'authCallback.verifying' & t}</p>
  </div>
  <section if.bind="failed" class="organizer-callback-error" role="alert">
    <p>${'authCallback.failed' & t}</p>
  </section>
  <console-button if.bind="failed" variant="tonal" href.bind="landingHref">${'authCallback.retry' & t}</console-button>
</main>
