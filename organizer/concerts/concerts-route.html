<import from="./concerts-route.css"></import>

<section class="concerts">
  <h1 class="page-title">${'concerts.title' & t}</h1>

  <div if.bind="state === 'error'" class="[ state-placeholder ]" role="alert">
    <p>${'concerts.loadFailed' & t}</p>
    <console-button variant="tonal" click.trigger="load()">${'common.retry' & t}</console-button>
  </div>

  <div if.bind="state === 'noArtist'" class="[ state-placeholder ]" data-testid="no-artist">
    <p class="[ state-placeholder-title ] [ md-typescale-title-medium ]">${'concerts.noArtist' & t}</p>
    <p>${'concerts.noArtistBody' & t}</p>
  </div>

  <div if.bind="state === 'notRepresented'" class="[ state-placeholder ]" role="alert">
    <p>${'concerts.artistNotFound' & t}</p>
    <console-button variant="tonal" href.bind="context.homeHref">${'home.title' & t}</console-button>
  </div>

  <template if.bind="state === 'ready'">
    <data-list if.bind="rows.length" columns.bind="columns" rows.bind="rows" label.bind="'concerts.title' & t" class="[ collection ] [ bleed ]"></data-list>
    <div else class="[ state-placeholder ]">
      <p>${'concerts.empty' & t}</p>
    </div>
    <extended-fab href.bind="newConcertHref" icon="add">${'concerts.create' & t}</extended-fab>
  </template>
</section>
