<import from="./concert-route.css"></import>

<section class="concert">
  <div if.bind="state === 'notFound'" class="message" role="alert">
    <h1 class="page-title">${'concert.notFound' & t}</h1>
    <console-button variant="tonal" href.bind="concertsHref">${'concert.toConcerts' & t}</console-button>
  </div>

  <div if.bind="state === 'error'" class="message" role="alert">
    <p>${'concert.loadFailed' & t}</p>
    <console-button variant="tonal" click.trigger="load()">${'common.retry' & t}</console-button>
  </div>

  <template if.bind="state === 'ready'">
    <header class="header">
      <h1 class="page-title">${title}</h1>
      <div class="actions">
        <console-button
          if.bind="draftDates.length"
          variant="filled"
          icon="check"
          pending.bind="publishing"
          pending-label.bind="'event.publishing' & t"
          disabled.bind="cancelling"
          click.trigger="publish()"
          data-action="publish"
        >${'event.publish' & t}</console-button>
        <console-button variant="outlined" icon="edit" href.bind="editHref">${'common.edit' & t}</console-button>
        <overflow-menu items.bind="menu" select.trigger="onMenu($event.detail)"></overflow-menu>
      </div>
    </header>

    <div class="panes">
      <section class="focus" aria-labelledby="concert-events-heading">
        <h2 id="concert-events-heading" class="section-title">${'concert.events' & t}</h2>
        <data-list columns.bind="columns" rows.bind="rows" label.bind="'concert.events' & t" class="dates"></data-list>
      </section>

      <aside class="supporting" aria-labelledby="concert-summary-heading">
        <h2 id="concert-summary-heading" class="section-title">${'concert.summary' & t}</h2>
        <img if.bind="coverUrl" src.bind="coverUrl" alt="" class="cover" data-testid="concert-cover">
        <p if.bind="coverNote" class="cover-note" role="status">${`concertEditor.cover.${coverNote}` & t}</p>
        <dl class="summary">
          <div class="summary-row">
            <dt>${'concertEditor.type' & t}</dt>
            <dd>${typeKey & t}</dd>
          </div>
          <div class="summary-row">
            <dt>${'concertEditor.visibility' & t}</dt>
            <dd>${visibilityKey & t}</dd>
          </div>
          <div if.bind="performers.length" class="summary-row">
            <dt>${'concertEditor.performers' & t}</dt>
            <dd>${performers.join(' · ')}</dd>
          </div>
        </dl>
      </aside>
    </div>

    <confirm-dialog
      component.ref="publishDialog"
      heading-key="concert.publishConfirmTitle" heading-params.bind="{ title: title }"
      confirm-key="event.publish"
      confirm-disabled.bind="!chosenIds.length"
    >
      <fieldset class="choices">
        <legend class="visually-hidden">${'concert.datesToPublish' & t}</legend>
        <label repeat.for="date of draftDates" class="choice state-layer">
          <input type="checkbox" checked.bind="chosen[date.id]">
          <span>
            <template if.bind="date.start">${date.start | jstDateTime}</template>
            <template else>${date.day | jstDay}</template>
            · ${date.venue}
          </span>
        </label>
      </fieldset>
      <p if.bind="unlisted">${'concert.publishConfirmUnlisted' & t}</p>
      <p else>${'concert.publishConfirmPublic' & t}</p>
    </confirm-dialog>
    <confirm-dialog
      component.ref="cancelDialog"
      heading-key="concert.cancelConfirmTitle" heading-params.bind="{ title: title }"
      confirm-key="concert.cancelConcert"
      confirm-variant="danger"
    >${'concert.cancelConfirmBody' & t}</confirm-dialog>
  </template>
</section>
