<import from="./concert-route.css"></import>
<import from="./concert-summary/concert-summary"></import>

<section class="concert">
  <div if.bind="state === 'notFound'" class="[ state-placeholder ]" role="alert">
    <h1 class="[ page-title state-placeholder-title ]">${'concert.notFound' & t}</h1>
    <console-button variant="tonal" href.bind="concertsHref">${'concert.toConcerts' & t}</console-button>
  </div>

  <div if.bind="state === 'error'" class="[ state-placeholder ]" role="alert">
    <p>${'concert.loadFailed' & t}</p>
    <console-button variant="tonal" click.trigger="load()">${'common.retry' & t}</console-button>
  </div>

  <template if.bind="state === 'ready'">
    <header class="[ header ] [ cluster ]">
      <h1 class="page-title">${title}</h1>
      <div class="[ actions ] [ cluster ]">
        <console-button
          if.bind="draftDates.length"
          variant="filled"
          icon="check"
          pending.bind="publishing"
          pending-label.bind="'event.publishing' & t"
          disabled.bind="cancelling"
          click.trigger="publish()"
          data-action="publish"
        >${'event.publish' & t}</console-button>
        <console-button variant="outlined" icon="edit" href.bind="editHref">${'common.edit' & t}</console-button>
        <overflow-menu items.bind="menu" select.trigger="onMenu($event.detail)"></overflow-menu>
      </div>
    </header>

    <div class="panes">
      <section class="[ focus ] [ flow ]" aria-labelledby="concert-events-heading">
        <h2 id="concert-events-heading" class="[ section-title ] [ md-typescale-title-large ]">${'concert.events' & t}</h2>
        <data-list columns.bind="columns" rows.bind="rows" label.bind="'concert.events' & t" class="[ dates ] [ bleed ]"></data-list>

        <section class="[ seat-types ] [ flow ]" aria-labelledby="concert-seat-types-heading" data-testid="seat-types">
          <h2 id="concert-seat-types-heading" class="[ section-title ] [ md-typescale-title-large ]">${'seatType.title' & t}</h2>
          <p class="note">${'seatType.note' & t}</p>
          <div if.bind="seatTypeState === 'error'" class="[ state-placeholder ]" role="alert">
            <p>${'seatType.loadFailed' & t}</p>
            <console-button variant="tonal" click.trigger="loadSeatTypes()">${'common.retry' & t}</console-button>
          </div>
          <template if.bind="seatTypeState === 'ready'">
            <ul if.bind="seatTypes.length" class="seat-type-list" aria-labelledby="concert-seat-types-heading">
              <li repeat.for="seatType of seatTypes; key: id" class="[ seat-type ] [ cluster ]" data-seat-type.bind="seatType.id">
                <span class="[ seat-type-name ] [ md-typescale-title-small ]">${seatType.name}</span>
                <span class="seat-type-price">${seatType.price | yen} ${'stock.taxIncluded' & t}</span>
                <console-button
                  if.bind="canEditSeatTypes && !seatType.stocked"
                  variant="text"
                  click.trigger="deleteSeatType(seatType)"
                >${'common.delete' & t}</console-button>
                <span if.bind="seatType.stocked" class="note">${'seatType.inUse' & t}</span>
              </li>
            </ul>
            <p else class="[ state-placeholder ]">${'seatType.empty' & t}</p>

            <form if.bind="canEditSeatTypes" class="seat-type-form" novalidate submit.trigger="false">
              <h3 class="[ form-title ] [ md-typescale-title-small ]">${'seatType.add' & t}</h3>
              <div class="row">
                <console-field
                  label.bind="'seatType.name' & t"
                  value.bind="seatTypeForm.name"
                  required.bind="true"
                  placeholder.bind="'seatType.namePlaceholder' & t"
                  error.bind="seatTypeError(seatTypeErrors.name, seatTypeSubmitted) || seatTypeProblem"
                  data-field="seat-type-name"
                ></console-field>
                <console-field
                  type="yen"
                  label.bind="'seatType.price' & t"
                  value.bind="seatTypeForm.price"
                  required.bind="true"
                  error.bind="seatTypeError(seatTypeErrors.price, seatTypeSubmitted)"
                  data-field="seat-type-price"
                ></console-field>
              </div>
              <div class="form-actions">
                <console-button variant="outlined" icon="add" action.bind="() => addSeatType()" pending-label.bind="'common.saving' & t">${'seatType.add' & t}</console-button>
              </div>
            </form>
          </template>
        </section>
      </section>

      <concert-summary
        cover-url.bind="coverUrl"
        cover-note.bind="coverNote"
        type-key.bind="typeKey"
        visibility-key.bind="visibilityKey"
        performers.bind="performers"
      ></concert-summary>
    </div>

    <confirm-dialog
      component.ref="publishDialog"
      class="[ flow ]"
      heading-key="concert.publishConfirmTitle" heading-params.bind="{ title: title }"
      confirm-key="event.publish"
      confirm-disabled.bind="!chosenIds.length"
    >
      <fieldset class="choices">
        <legend class="visually-hidden">${'concert.datesToPublish' & t}</legend>
        <label repeat.for="date of draftDates" class="[ choice ] [ state-layer ]">
          <input type="checkbox" checked.bind="chosen[date.id]">
          <span>
            <template if.bind="date.start">${date.start | jstDateTime}</template>
            <template else>${date.day | jstDay}</template>
            · ${date.venue}
          </span>
        </label>
      </fieldset>
      <p if.bind="unlisted">${'concert.publishConfirmUnlisted' & t}</p>
      <p else>${'concert.publishConfirmPublic' & t}</p>
    </confirm-dialog>
    <confirm-dialog
      component.ref="cancelDialog"
      heading-key="concert.cancelConfirmTitle" heading-params.bind="{ title: title }"
      confirm-key="concert.cancelConcert"
      confirm-variant="danger"
    >${'concert.cancelConfirmBody' & t}</confirm-dialog>
    <confirm-dialog
      component.ref="addSeatTypeDialog"
      heading-key="seatType.addConfirmTitle" heading-params.bind="addSeatTypeParams"
      confirm-key="seatType.add"
    >${'seatType.addConfirmBody' & t}</confirm-dialog>
    <confirm-dialog
      component.ref="deleteSeatTypeDialog"
      heading-key="seatType.deleteConfirmTitle" heading-params.bind="{ name: seatTypeToDelete.name }"
      confirm-key="common.delete"
      confirm-variant="danger"
    >${'seatType.deleteConfirmBody' & t}</confirm-dialog>
  </template>
</section>
