<import from="./concert-route.css"></import>

<section class="concert">
  <circular-progress if.bind="state === 'loading'"></circular-progress>

  <div if.bind="state === 'notFound'" class="message" role="alert">
    <h1 class="page-title">${'concert.notFound' & t}</h1>
    <console-button variant="tonal" href.bind="concertsHref">${'concert.toConcerts' & t}</console-button>
  </div>

  <div if.bind="state === 'error'" class="message" role="alert">
    <p>${'concert.loadFailed' & t}</p>
    <console-button variant="tonal" click.trigger="load()">${'common.retry' & t}</console-button>
  </div>

  <template if.bind="state === 'ready'">
    <header class="header">
      <img if.bind="coverUrl" src.bind="coverUrl" alt="" class="cover">
      <div class="heading">
        <h1 class="page-title">${title}</h1>
        <p class="meta">${typeKey & t} · ${visibilityKey & t}</p>
        <p if.bind="performers.length" class="performers">${performers.join(' · ')}</p>
      </div>
    </header>

    <div class="actions">
      <console-button
        if.bind="draftDates.length"
        variant="filled"
        icon="check"
        pending.bind="publishing"
        pending-label.bind="'event.publishing' & t"
        disabled.bind="cancelling"
        click.trigger="publish()"
        data-action="publish"
      >${'event.publish' & t}</console-button>
      <console-button
        if.bind="canCancelConcert"
        variant="outlined"
        pending.bind="cancelling"
        pending-label.bind="'event.cancelling' & t"
        disabled.bind="publishing"
        click.trigger="cancelConcert()"
        data-action="cancel"
      >${'concert.cancelConcert' & t}</console-button>
      <console-button variant="text" icon="edit" href.bind="editHref">${'common.edit' & t}</console-button>
    </div>

    <confirm-dialog
      component.ref="publishDialog"
      heading.bind="'concert.publishConfirmTitle' & t:{ title: title }"
      confirm-label.bind="'event.publish' & t"
      confirm-disabled.bind="!chosenIds.length"
    >
      <fieldset class="dates">
        <legend class="visually-hidden">${'concert.datesToPublish' & t}</legend>
        <label repeat.for="date of draftDates" class="date state-layer">
          <input type="checkbox" checked.bind="chosen[date.id]">
          <span>
            <template if.bind="date.start">${date.start | jstDateTime}</template>
            <template else>${date.day | jstDay}</template>
            · ${date.venue}
          </span>
        </label>
      </fieldset>
      <p if.bind="unlisted">${'concert.publishConfirmUnlisted' & t}</p>
      <p else>${'concert.publishConfirmPublic' & t}</p>
    </confirm-dialog>
    <confirm-dialog
      component.ref="cancelDialog"
      heading.bind="'concert.cancelConfirmTitle' & t:{ title: title }"
      confirm-label.bind="'concert.cancelConcert' & t"
      confirm-variant="danger"
    >${'concert.cancelConfirmBody' & t}</confirm-dialog>

    <section if.bind="offersShareLink" class="share" aria-labelledby="concert-share-heading">
      <h2 id="concert-share-heading" class="section-title">${'concert.shareTitle' & t}</h2>
      <p>${'concert.shareExplain' & t}</p>
      <copy-field if.bind="shareUrl" label.bind="'concert.shareLabel' & t" value.bind="shareUrl"></copy-field>
      <console-button variant="tonal" action.bind="() => createShareLink()" pending-label.bind="'concert.shareCreating' & t">${'concert.shareCreate' & t}</console-button>
      <confirm-dialog
        component.ref="shareDialog"
        heading.bind="'concert.shareConfirmTitle' & t"
        confirm-label.bind="'concert.shareCreate' & t"
      >${'concert.shareConfirmBody' & t}</confirm-dialog>
    </section>

    <section class="events" aria-labelledby="concert-events-heading">
      <h2 id="concert-events-heading" class="section-title">${'concert.events' & t}</h2>
      <data-list columns.bind="columns" rows.bind="rows" label.bind="'concert.events' & t"></data-list>
    </section>
  </template>
</section>
