<import from="./account-menu.css"></import>

<button
  type="button"
  class="[ icon-button ] [ state-layer ]"
  popovertarget="account-menu"
  aria-label.bind="'shell.account' & t"
>
  <console-icon name="account-circle"></console-icon>
</button>
<div ref="menu" id="account-menu" popover class="[ menu account-menu ] [ flow ]">
  <p class="[ menu-heading ] [ md-typescale-label-medium ]" id="account-menu-language">${'shell.language' & t}</p>
  <div role="group" aria-labelledby="account-menu-language" class="menu-group">
    <button
      repeat.for="code of languages"
      type="button"
      class="[ menu-item ] [ state-layer ] [ md-typescale-label-large ]"
      lang.bind="code"
      aria-pressed.bind="language.current === code ? 'true' : 'false'"
      click.trigger="setLanguage(code)"
    >
      <console-icon name="check" class="menu-check"></console-icon>
      <span>${`shell.languageName.${code}` & t}</span>
    </button>
  </div>
  <hr class="menu-divider">
  <button type="button" class="[ menu-item ] [ state-layer ] [ md-typescale-label-large ]" click.trigger="signOut()">
    <console-icon name="logout"></console-icon>
    <span>${'shell.signOut' & t}</span>
  </button>
</div>
