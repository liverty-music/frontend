<import from="./top-app-bar.css"></import>
<import from="../crumb-text/crumb-text"></import>
<import from="../brand-lockup/brand-lockup"></import>
<import from="../organizer-and-artist/organizer-and-artist"></import>
<import from="../account-menu/account-menu"></import>

<header class="top-app-bar">
  <template if.bind="breadcrumbs.parent">
    <a href.bind="breadcrumbs.parent.href" class="[ icon-button back ] [ state-layer ]" data-testid="back">
      <console-icon name="arrow-back"></console-icon>
      <span class="visually-hidden">${'shell.back' & t}: <crumb-text crumb.bind="breadcrumbs.parent"></crumb-text></span>
    </a>
    <span class="[ title ] [ md-typescale-title-large ]"><crumb-text crumb.bind="breadcrumbs.current"></crumb-text></span>
  </template>
  <brand-lockup href.bind="context.homeHref" deep.bind="!!breadcrumbs.parent"></brand-lockup>
  <organizer-and-artist deep.bind="!!breadcrumbs.parent"></organizer-and-artist>
  <a
    href.bind="helpHref"
    external
    target="_blank"
    rel="noopener"
    class="[ icon-button ] [ state-layer ]"
    title.bind="'shell.help' & t"
    data-testid="help"
  >
    <console-icon name="help"></console-icon>
    <span class="visually-hidden">${'shell.help' & t}</span>
  </a>
  <account-menu></account-menu>
</header>
