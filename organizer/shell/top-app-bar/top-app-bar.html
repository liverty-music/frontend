<import from="./top-app-bar.css"></import>
<import from="../crumb-text/crumb-text"></import>

<header class="top-app-bar">
  <template if.bind="breadcrumbs.parent">
    <a href.bind="breadcrumbs.parent.href" class="back state-layer" data-testid="back">
      <console-icon name="arrow-back"></console-icon>
      <span class="visually-hidden">${'shell.back' & t}: <crumb-text crumb.bind="breadcrumbs.parent"></crumb-text></span>
    </a>
    <span class="title"><crumb-text crumb.bind="breadcrumbs.current"></crumb-text></span>
  </template>
  <a href.bind="context.homeHref" class="brand" data-deep.bind="!!breadcrumbs.parent" aria-label.bind="'app.name' & t">
    <span class="brand-mark">${'app.logoMark' & t}</span>
    <span class="brand-product">${'app.logoSub' & t}</span>
  </a>
  <div class="context" data-deep.bind="!!breadcrumbs.parent">
    <span class="organizer-name" data-testid="organizer-name">${context.organizerName}</span>
    <template if.bind="artists.length > 1">
      <button
        type="button"
        class="artist-button state-layer touch-target"
        popovertarget="artist-menu"
        aria-label.bind="'shell.artistMenu' & t:{ name: artistName }"
        data-testid="artist-menu-button"
      >
        <span class="artist-name">${artistName}</span>
        <console-icon name="arrow-drop-down"></console-icon>
      </button>
      <nav ref="artistMenu" id="artist-menu" popover class="menu artist-menu" aria-label.bind="'shell.artists' & t">
        <a
          repeat.for="artist of artists; key: id"
          href.bind="artist.href"
          class="menu-item state-layer"
          aria-current.bind="artist.id === context.artistId ? 'true' : null"
          click.trigger="chooseArtist()"
        >
          <console-icon name="check" class="menu-check"></console-icon>
          <span>${artist.name}</span>
        </a>
      </nav>
    </template>
    <span else class="artist-name" data-testid="artist-name">${artistName}</span>
  </div>
  <button
    type="button"
    class="account state-layer"
    popovertarget="account-menu"
    aria-label.bind="'shell.account' & t"
  >
    <console-icon name="account-circle"></console-icon>
  </button>
  <div ref="menu" id="account-menu" popover class="menu account-menu">
    <p class="menu-heading" id="account-menu-language">${'shell.language' & t}</p>
    <div role="group" aria-labelledby="account-menu-language" class="menu-group">
      <button
        repeat.for="code of languages"
        type="button"
        class="menu-item state-layer"
        lang.bind="code"
        aria-pressed.bind="language.current === code ? 'true' : 'false'"
        click.trigger="setLanguage(code)"
      >
        <console-icon name="check" class="menu-check"></console-icon>
        <span>${`shell.languageName.${code}` & t}</span>
      </button>
    </div>
    <hr class="menu-divider">
    <button type="button" class="menu-item state-layer" click.trigger="signOut()">
      <console-icon name="logout"></console-icon>
      <span>${'shell.signOut' & t}</span>
    </button>
  </div>
</header>
