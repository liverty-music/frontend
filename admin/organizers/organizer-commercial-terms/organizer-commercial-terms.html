<section class="[ commercial-terms ] [ flow ]" aria-labelledby="commercial-terms-title">
  <h3 id="commercial-terms-title" class="commercial-terms-title">
    Commercial terms
  </h3>

  <output
    if.bind="phase === 'loading'"
    class="commercial-terms-status"
    role="status"
    aria-busy="true"
  >
    Loading commercial terms…
  </output>

  <div if.bind="phase === 'error'" class="[ cluster ]" role="alert">
    <p class="commercial-terms-error">${loadError}</p>
    <button type="button" class="commercial-terms-btn" click.trigger="load()">
      Retry
    </button>
  </div>

  <template if.bind="phase === 'ready'">
    <form
      class="[ commercial-terms-form ] [ flow ]"
      novalidate
      submit.trigger="saveBusinessDetails()"
    >
      <h4 class="commercial-terms-form-title">Business details (特商法)</h4>
      <p class="commercial-terms-hint">
        Shown to fans at checkout and in the purchase email. All five values
        are required and are saved together.
      </p>
      <p
        if.bind="!hasBusinessDetails"
        class="commercial-terms-hint"
        data-state="missing"
      >
        Not entered yet: this organizer's events cannot go on sale until the
        business details are saved.
      </p>

      <label class="commercial-terms-field">
        Legal name (販売業者の名称)
        <input
          type="text"
          class="commercial-terms-input"
          name="legalName"
          value.bind="business.legalName"
          maxlength="200"
          autocomplete="organization"
          required
          aria-invalid.bind="!!businessErrors.legalName"
          aria-describedby="business-legal-name-error"
          disabled.bind="savingBusiness"
        />
      </label>
      <p
        id="business-legal-name-error"
        if.bind="businessErrors.legalName"
        class="commercial-terms-error"
      >
        ${businessErrors.legalName}
      </p>

      <label class="commercial-terms-field">
        Representative (代表者または業務責任者)
        <input
          type="text"
          class="commercial-terms-input"
          name="representativeName"
          value.bind="business.representativeName"
          maxlength="100"
          autocomplete="name"
          required
          aria-invalid.bind="!!businessErrors.representativeName"
          aria-describedby="business-representative-name-error"
          disabled.bind="savingBusiness"
        />
      </label>
      <p
        id="business-representative-name-error"
        if.bind="businessErrors.representativeName"
        class="commercial-terms-error"
      >
        ${businessErrors.representativeName}
      </p>

      <label class="commercial-terms-field">
        Business address (所在地)
        <input
          type="text"
          class="commercial-terms-input"
          name="businessAddress"
          value.bind="business.businessAddress"
          maxlength="300"
          autocomplete="street-businessAddress"
          required
          aria-invalid.bind="!!businessErrors.businessAddress"
          aria-describedby="business-businessAddress-error"
          disabled.bind="savingBusiness"
        />
      </label>
      <p
        id="business-businessAddress-error"
        if.bind="businessErrors.businessAddress"
        class="commercial-terms-error"
      >
        ${businessErrors.businessAddress}
      </p>

      <label class="commercial-terms-field">
        Business phone number (電話番号)
        <input
          type="tel"
          class="commercial-terms-input"
          name="businessPhoneNumber"
          value.bind="business.businessPhoneNumber"
          maxlength="16"
          autocomplete="tel"
          placeholder="+81312345678"
          required
          aria-invalid.bind="!!businessErrors.businessPhoneNumber"
          aria-describedby="business-phone-number-hint business-phone-number-error"
          disabled.bind="savingBusiness"
        />
      </label>
      <p id="business-phone-number-hint" class="commercial-terms-hint">
        International form: + country code, then the number without the
        leading 0.
      </p>
      <p
        id="business-phone-number-error"
        if.bind="businessErrors.businessPhoneNumber"
        class="commercial-terms-error"
      >
        ${businessErrors.businessPhoneNumber}
      </p>

      <label class="commercial-terms-field">
        Contact email (メールアドレス)
        <input
          type="email"
          class="commercial-terms-input"
          name="contactEmail"
          value.bind="business.contactEmail"
          autocomplete="email"
          maxlength="165"
          required
          aria-invalid.bind="!!businessErrors.contactEmail"
          aria-describedby="business-contact-email-error"
          disabled.bind="savingBusiness"
        />
      </label>
      <p
        id="business-contact-email-error"
        if.bind="businessErrors.contactEmail"
        class="commercial-terms-error"
      >
        ${businessErrors.contactEmail}
      </p>

      <div class="[ cluster ]">
        <button
          type="submit"
          class="commercial-terms-btn"
          data-variant="primary"
          disabled.bind="savingBusiness"
        >
          ${savingBusiness ? 'Saving…' : 'Save business details'}
        </button>
        <output if.bind="businessSaved" class="commercial-terms-status">
          Saved.
        </output>
      </div>
      <p if.bind="businessSaveError" class="commercial-terms-error" role="alert">
        ${businessSaveError}
      </p>
    </form>

    <form
      class="[ commercial-terms-form ] [ flow ]"
      novalidate
      submit.trigger="saveFeeRate()"
    >
      <h4 class="commercial-terms-form-title">Platform fee rate</h4>
      <p class="commercial-terms-hint">
        Applies to this organizer's future orders. Orders already issued keep
        their rate.
      </p>

      <label class="commercial-terms-field">
        Rate (%, 0 to 30, up to two decimals)
        <span class="[ cluster ]">
          <input
            type="text"
            class="commercial-terms-input"
            data-variant="rate"
            name="platformFeeRate"
            inputmode="decimal"
            value.bind="feeRateText"
            required
            aria-invalid.bind="!!feeRateError"
            aria-describedby="fee-rate-error"
            disabled.bind="savingFeeRate"
          />
          <span aria-hidden="true">%</span>
        </span>
      </label>
      <p
        id="fee-rate-error"
        if.bind="feeRateError"
        class="commercial-terms-error"
      >
        ${feeRateError}
      </p>

      <div class="[ cluster ]">
        <button
          type="submit"
          class="commercial-terms-btn"
          data-variant="primary"
          disabled.bind="savingFeeRate"
        >
          ${savingFeeRate ? 'Saving…' : 'Save rate'}
        </button>
        <output if.bind="feeRateSaved" class="commercial-terms-status">
          Saved.
        </output>
      </div>
      <p if.bind="feeRateSaveError" class="commercial-terms-error" role="alert">
        ${feeRateSaveError}
      </p>
    </form>
  </template>
</section>
