name: CI

# Pull requests are the gate: every job below runs on every pull request,
# and branch protection requires the one aggregate check `CI Success`.
#
# There is no path filter. A filter is an allow-list of the files that can
# change a result, and such a list is never complete: `.nvmrc` (the Node
# version every job installs) was missing, and before that a Playwright
# config was, so a pull request touching only those files skipped the jobs
# and still reported `CI Success` green. In the last 100 merged pull requests
# the filter skipped the jobs of one, which changed only documentation, so it
# saved almost nothing; one run of every job takes about 13 runner-minutes,
# in parallel.
#
# `main` is not re-checked on every push: from 2026-08-21 to 2026-10-21 those
# runs found no merge that broke `main`, and nobody was told when one failed
# (cloud-provisioning#666). A daily run checks `main` with every job and opens
# or updates an Issue labelled `ci` when it fails.
on:
  pull_request:
  schedule:
    - cron: "0 19 * * *" # 04:00 JST
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run make lint
        run: make lint lint-templates

      # The reception app's own build, then the check that its output holds no
      # OIDC client or console code (prints the output size). OpenSpec change
      # `isolate-venue-reception`, design D4.
      - name: Build and check the reception app
        run: make verify-reception-bundle

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run make test
        run: make test

      - name: Report coverage on PR
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          json-summary-path: ./coverage/coverage-summary.json

      - name: Upload coverage reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        if: always()
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --omit=dev --audit-level=moderate

  smoke:
    name: Smoke and phone E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Runs in the pinned official Playwright image, as the Storybook job does:
    # it ships Chromium, WebKit and their system libraries, so there is no
    # `playwright install --with-deps` (its `apt-get update` failed for hours on
    # 2026-11-11 when the runners could not resolve the Ubuntu mirrors) and no
    # browser cache to maintain. Keep the tag in lockstep with `@playwright/test`
    # (Renovate moves them together).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci


      # The suite runs against the built app served by `vite preview`, as
      # production serves it, not the dev server: ~40% shorter job. The build
      # is made once here (`playwright.config.mjs` only serves it).
      # `NODE_ENV=development` keeps `import.meta.env.DEV` true, so dev-only
      # hooks stay and the service worker is not registered.
      - name: Build the app
        run: NODE_ENV=development npx vite build

      - name: Run smoke tests
        run: npx playwright test --project=smoke
        env:
          E2E_SERVER: preview

      - name: Run onboarding tests
        run: npx playwright test --project=onboarding
        env:
          E2E_SERVER: preview

      # The WebKit and typeface projects (iPhone 14 and Pixel 7 profiles). They
      # take longer per test than `functional`, and in the E2E job they all
      # fell into its last shard, which made it the slowest job of the
      # workflow. This job was the shortest and already builds the app, so
      # they add no setup here. webkit-repro / chromium-control are the owners of
      # page-help-sheet-webkit.spec.ts, which the `functional` project excludes
      # on the grounds that they cover it. They must therefore run here, or
      # that spec has no CI coverage at all.
      - name: Run WebKit and typeface tests
        run: npx playwright test --project=webkit-repro --project=chromium-control --project=webkit-shell --project=webkit-virtual-ticket --project=webkit-organizer-guide --project=typefaces-pixel7 --project=typefaces-iphone
        env:
          E2E_SERVER: preview

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: smoke-results
          path: test-results/
          retention-days: 7

  e2e:
    name: E2E (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Runs in the pinned official Playwright image, as the Storybook job does:
    # it ships Chromium, WebKit and their system libraries, so there is no
    # `playwright install --with-deps` (its `apt-get update` failed for hours on
    # 2026-11-11 when the runners could not resolve the Ubuntu mirrors) and no
    # browser cache to maintain. Keep the tag in lockstep with `@playwright/test`
    # (Renovate moves them together).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    # Two shards, each with the whole time limit: one job ran ~505 tests in
    # 8-15 minutes and was cancelled at 15 (#989). `CI Success` reads the
    # matrix as one result, which fails when either shard fails. No fail-fast,
    # so a failing shard still lets the other report its own failures.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci


      # The suite runs against the built app served by `vite preview`, as
      # production serves it, not the dev server: ~40% shorter job. The build
      # is made once here (`playwright.config.mjs` only serves it).
      # `NODE_ENV=development` keeps `import.meta.env.DEV` true, so dev-only
      # hooks stay and the service worker is not registered.
      - name: Build the app
        run: NODE_ENV=development npx vite build

      # Only `functional`: the WebKit and typeface projects run in the `smoke`
      # job. A shard is a contiguous slice of the test list, so with them here
      # they all landed in the last shard.
      - name: Run E2E tests
        env:
          E2E_SERVER: preview
        run: npx playwright test --shard=${{ matrix.shard }}/2 --project=functional

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: e2e-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  prod-build:
    name: Production Build Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs in the pinned official Playwright image, as the Storybook job does:
    # it ships Chromium, WebKit and their system libraries, so there is no
    # `playwright install --with-deps` (its `apt-get update` failed for hours on
    # 2026-11-11 when the runners could not resolve the Ubuntu mirrors) and no
    # browser cache to maintain. Keep the tag in lockstep with `@playwright/test`
    # (Renovate moves them together).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci


      # Builds the production bundle, serves it with `vite preview` and opens
      # the public screens of the fan, organizer and admin entries and every
      # console screen (mocked RPCs) in light and dark at 390 × 844 and
      # 1280 × 800; fails on any axe violation and on a component whose own
      # styles are not applied. The dev server cannot show a cascade-order
      # defect of the production CSS chunks (v1.89.0). OpenSpec change
      # `redesign-organizer-console`, design D22.
      - name: Run production-build checks
        run: npm run test:prod-build

      # PWA / service-worker specs run from their own config against a
      # production build (`vite preview`). vite-plugin-pwa disables the service
      # worker in dev, so running these against the dev server verifies
      # nothing — which is why the offline-cache spec sat excluded from CI with
      # a stale reason. They belong in this job: it already runs against a
      # production build, and in the e2e job's second shard they made it the
      # slowest job (about 25 s of tests plus a second build).
      - name: Run PWA tests
        run: npm run test:pwa

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: prod-build-results
          path: |
            test-results/prod-build/
            test-results/pwa/
          retention-days: 7

  storybook-test:
    name: Storybook Component Tests
    runs-on: ubuntu-latest
    # Run inside the pinned official Playwright image so component rendering is
    # byte-deterministic with the committed `toMatchScreenshot` baselines (which
    # are generated in this same image). The image ships Chromium, so no separate
    # Playwright browser install/cache is needed. Keep the tag in lockstep with
    # the `@playwright/test` version and with the baseline-generation image.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Compares each story's render against its committed baseline
      # (src/components/**/__screenshots__/). No baseline artifact download/upload:
      # baselines live in git and are reviewed in the PR diff (design D4). The
      # HTML report captures the actual/diff images for any visual failure.
      - name: Run Storybook component tests
        run: npx vitest run --project=storybook --project=storybook-reduced-motion --project=storybook-more-contrast --reporter=default --reporter=html --outputFile.html=./storybook-test-report/index.html

      - name: Upload visual diff report on failure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: storybook-visual-diff
          path: storybook-test-report/
          retention-days: 7
          if-no-files-found: ignore

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, test, security, smoke, e2e, prod-build, storybook-test]
    if: always()
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}

  report-main-failure:
    name: Report main failure
    needs: ci-success
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the main CI failure Issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="CI failing on main"
          body="The daily CI run on \`main\` (${GITHUB_SHA::8}) failed: ${RUN_URL}"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label ci --state open \
            --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label ci --label bug --title "$title" --body "$body"
          fi
