name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
      storybook: ${{ steps.filter.outputs.storybook }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              - 'test/**'
              - 'e2e/**'
              - 'scripts/**'
              - 'index.html'
              - 'public/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'vite.config.ts'
              - 'vitest.config.ts'
              - 'biome.json'
              - '.stylelintrc.json'
              - 'Makefile'
              - 'playwright.config.mjs'
              - 'playwright.smoke.config.mjs'
              - '.github/workflows/**'
            # Anything that can change a component's rendered output must
            # (re)run the browser component tests — including a component
            # .ts/.html/.css edit with no story change (spec: "Component tests
            # are skipped when no relevant files change").
            storybook:
              - 'src/components/**'
              - '**/*.stories.*'
              - '.storybook/**'
              - 'vitest.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'

  lint:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run make lint
        run: make lint lint-templates

  lint-skip:
    needs: changes
    if: needs.changes.outputs.src == 'false'
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - run: echo "No relevant changes, skipping lint"

  test:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run make test
        run: make test

      - name: Report coverage on PR
        uses: davelosert/vitest-coverage-report-action@v2
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          json-summary-path: ./coverage/coverage-summary.json

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-skip:
    needs: changes
    if: needs.changes.outputs.src == 'false'
    name: Test
    runs-on: ubuntu-latest
    steps:
      - run: echo "No relevant changes, skipping tests"

  security:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --omit=dev --audit-level=moderate

  security-skip:
    needs: changes
    if: needs.changes.outputs.src == 'false'
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - run: echo "No relevant changes, skipping security audit"

  smoke:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    name: Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # See the E2E job for rationale — cache browsers so a slow Playwright CDN
      # can't consume the job timeout mid-download. Chromium-only key.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npx playwright test --project=smoke

      - name: Run onboarding tests
        run: npx playwright test --project=onboarding

  smoke-skip:
    needs: changes
    if: needs.changes.outputs.src == 'false'
    name: Smoke
    runs-on: ubuntu-latest
    steps:
      - run: echo "No relevant changes, skipping smoke tests"

  e2e:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Cache the downloaded browser binaries. Without this, every run
      # re-downloads chromium + webkit; when the Playwright CDN is slow the
      # download can consume the whole job timeout and the job is canceled
      # mid-install. On a cache hit `playwright install` skips the download and
      # only (re)installs the small apt --with-deps set. Key on the lockfile so
      # a @playwright/test bump invalidates it.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-webkit-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run E2E tests
        run: npx playwright test --project=functional --project=pwa

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

  e2e-skip:
    needs: changes
    if: needs.changes.outputs.src == 'false'
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - run: echo "No relevant changes, skipping E2E tests"

  storybook-test:
    needs: changes
    if: needs.changes.outputs.storybook == 'true'
    name: Storybook Component Tests
    runs-on: ubuntu-latest
    # Run inside the pinned official Playwright image so component rendering is
    # byte-deterministic with the committed `toMatchScreenshot` baselines (which
    # are generated in this same image). The image ships Chromium, so no separate
    # Playwright browser install/cache is needed. Keep the tag in lockstep with
    # the `@playwright/test` version and with the baseline-generation image.
    container:
      image: mcr.microsoft.com/playwright:v1.58.1-noble
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Compares each story's render against its committed baseline
      # (src/components/**/__screenshots__/). No baseline artifact download/upload:
      # baselines live in git and are reviewed in the PR diff (design D4). The
      # HTML report captures the actual/diff images for any visual failure.
      - name: Run Storybook component tests
        run: npx vitest run --project=storybook --reporter=default --reporter=html --outputFile.html=./storybook-test-report/index.html

      - name: Upload visual diff report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: storybook-visual-diff
          path: storybook-test-report/
          retention-days: 7
          if-no-files-found: ignore

  storybook-test-skip:
    needs: changes
    if: needs.changes.outputs.storybook == 'false'
    name: Storybook Component Tests
    runs-on: ubuntu-latest
    steps:
      - run: echo "No component/story/config changes, skipping component tests"

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [changes, lint, lint-skip, test, test-skip, security, security-skip, smoke, smoke-skip, e2e, e2e-skip, storybook-test, storybook-test-skip]
    if: always()
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          allowed-skips: lint, lint-skip, test, test-skip, security, security-skip, smoke, smoke-skip, e2e, e2e-skip, storybook-test, storybook-test-skip
          jobs: ${{ toJSON(needs) }}
