name: CI

# Pull requests are the gate. `main` is not re-checked on every push: from
# 2026-08-21 to 2026-10-21 those runs found no merge that broke `main`, and
# nobody was told when one failed (cloud-provisioning#666). A daily run checks
# `main` with every job and opens or updates an Issue labelled `ci` when it
# fails. Path-filtered jobs are skipped rather than replaced by `*-skip`
# placeholders: only `CI Success` is required, and `alls-green` treats the
# jobs in `allowed-skips` as passing when skipped.
on:
  pull_request:
  schedule:
    - cron: "0 19 * * *" # 04:00 JST
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    # Path filters apply to pull requests only. A scheduled or manual run checks
    # the whole of `main`, so every output is true for it.
    outputs:
      src: ${{ github.event_name != 'pull_request' || steps.filter.outputs.src == 'true' }}
      storybook: ${{ github.event_name != 'pull_request' || steps.filter.outputs.storybook == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              # The organizer and admin entries: the production-build checks
              # render them, and Lint/Test cover their code.
              - 'organizer/**'
              - 'admin/**'
              - 'organizer.html'
              - 'admin.html'
              # The reception app (its own build) and the shared/ modules it
              # imports from source: the Lint job builds and checks it.
              - 'reception/**'
              - 'shared/**'
              - 'reception.html'
              - 'vite.reception.config.ts'
              - 'test/**'
              - 'e2e/**'
              - 'scripts/**'
              - 'index.html'
              - 'public/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'vite.config.ts'
              - 'vitest.config.ts'
              - 'biome.json'
              - 'stylelint.config.js'
              - 'stylelint-plugin-cube-css/**'
              - 'Makefile'
              - 'playwright.config.mjs'
              - 'playwright.smoke.config.mjs'
              # playwright.pwa.config.mjs is the config the PWA step runs from.
              # Without it here, a PR touching only that file skips the whole e2e
              # job and still reports CI Success green.
              - 'playwright.pwa.config.mjs'
              - 'playwright.prod-build.config.mjs'
              - '.github/workflows/**'
            # Anything that can change a component's rendered output must
            # (re)run the browser component tests — including a component
            # .ts/.html/.css edit with no story change (spec: "Component tests
            # are skipped when no relevant files change").
            storybook:
              - 'src/components/**'
              - '**/*.stories.*'
              - '.storybook/**'
              - 'vitest.config.ts'
              - 'vite.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'

  lint:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run make lint
        run: make lint lint-templates

      # The reception app's own build, then the check that its output holds no
      # OIDC client or console code (prints the output size). OpenSpec change
      # `isolate-venue-reception`, design D4.
      - name: Build and check the reception app
        run: make verify-reception-bundle

  test:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run make test
        run: make test

      - name: Report coverage on PR
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          json-summary-path: ./coverage/coverage-summary.json

      - name: Upload coverage reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        if: always()
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  security:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --omit=dev --audit-level=moderate

  smoke:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    name: Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # See the E2E job for rationale — cache browsers so a slow Playwright CDN
      # can't consume the job timeout mid-download. Chromium-only key.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npx playwright test --project=smoke

      - name: Run onboarding tests
        run: npx playwright test --project=onboarding

  e2e:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Cache the downloaded browser binaries. Without this, every run
      # re-downloads chromium + webkit; when the Playwright CDN is slow the
      # download can consume the whole job timeout and the job is canceled
      # mid-install. On a cache hit `playwright install` skips the download and
      # only (re)installs the small apt --with-deps set. Key on the lockfile so
      # a @playwright/test bump invalidates it.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-webkit-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # webkit-repro / chromium-control are the owners of
      # page-help-sheet-webkit.spec.ts, which the `functional` project excludes
      # on the grounds that they cover it. They must therefore run here, or
      # that spec has no CI coverage at all.
      - name: Run E2E tests
        run: npx playwright test --project=functional --project=webkit-repro --project=chromium-control --project=webkit-shell --project=webkit-organizer-guide

      # PWA / service-worker specs run from their own config against a
      # production build (`vite preview`). vite-plugin-pwa disables the service
      # worker in dev, so running these against the dev server verifies
      # nothing — which is why the offline-cache spec sat excluded from CI with
      # a stale reason. Separate step so the production build it needs does not
      # slow the rest of the e2e run.
      - name: Run PWA tests
        run: npm run test:pwa

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

  prod-build:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    name: Production Build Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # See the E2E job for rationale — cache browsers so a slow Playwright CDN
      # can't consume the job timeout mid-download. Chromium-only key.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Builds the production bundle, serves it with `vite preview` and opens
      # the public screens of the fan, organizer and admin entries and every
      # console screen (mocked RPCs) in light and dark at 390 × 844 and
      # 1280 × 800; fails on any axe violation and on a component whose own
      # styles are not applied. The dev server cannot show a cascade-order
      # defect of the production CSS chunks (v1.89.0). OpenSpec change
      # `redesign-organizer-console`, design D22.
      - name: Run production-build checks
        run: npm run test:prod-build

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: prod-build-results
          path: test-results/prod-build/
          retention-days: 7

  storybook-test:
    needs: changes
    if: needs.changes.outputs.storybook == 'true'
    name: Storybook Component Tests
    runs-on: ubuntu-latest
    # Run inside the pinned official Playwright image so component rendering is
    # byte-deterministic with the committed `toMatchScreenshot` baselines (which
    # are generated in this same image). The image ships Chromium, so no separate
    # Playwright browser install/cache is needed. Keep the tag in lockstep with
    # the `@playwright/test` version and with the baseline-generation image.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Compares each story's render against its committed baseline
      # (src/components/**/__screenshots__/). No baseline artifact download/upload:
      # baselines live in git and are reviewed in the PR diff (design D4). The
      # HTML report captures the actual/diff images for any visual failure.
      - name: Run Storybook component tests
        run: npx vitest run --project=storybook --project=storybook-reduced-motion --reporter=default --reporter=html --outputFile.html=./storybook-test-report/index.html

      - name: Upload visual diff report on failure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: storybook-visual-diff
          path: storybook-test-report/
          retention-days: 7
          if-no-files-found: ignore

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [changes, lint, test, security, smoke, e2e, prod-build, storybook-test]
    if: always()
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          allowed-skips: lint, test, security, smoke, e2e, prod-build, storybook-test
          jobs: ${{ toJSON(needs) }}

  report-main-failure:
    name: Report main failure
    needs: ci-success
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the main CI failure Issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="CI failing on main"
          body="The daily CI run on \`main\` (${GITHUB_SHA::8}) failed: ${RUN_URL}"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label ci --state open \
            --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label ci --label bug --title "$title" --body "$body"
          fi
