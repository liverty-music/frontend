<import from="./components/error-banner/error-banner"></import>
<import from="./components/pwa-install-banner/pwa-install-banner"></import>
<import from="./components/notification-prompt/notification-prompt"></import>
<import from="./components/snack-bar/snack-bar"></import>
<import from="./components/coach-mark/coach-mark"></import>

<au-viewport></au-viewport>

<bottom-nav-bar if.bind="showNav"></bottom-nav-bar>

<!-- Top-layer overlays: rendered via popover/dialog in browser top layer,
     DOM position is irrelevant. Placed outside viewport to avoid grid interference. -->
<!-- Auth-gated (D5): guests already see signup-prompt-banner, so gating on
     isAuthenticated keeps the two banners mutually exclusive. Suppressed while a
     post-signup surface (celebration overlay / PostSignupDialog) occupies the
     bottom of the screen to avoid overlap (D7). Single instance guaranteed by
     app-shell — safe to use static ids inside. -->
<pwa-install-banner if.bind="showNav && auth.isAuthenticated && !isPostSignupSurfaceOpen"></pwa-install-banner>
<notification-prompt if.bind="auth.isAuthenticated && onboarding.isCompleted && showNav"></notification-prompt>
<snack-bar></snack-bar>
<error-banner></error-banner>

<!-- Onboarding coach mark: single instance driven by CoachMarkService -->
<coach-mark
  target-selector.bind="coachMark.target"
  message.bind="coachMark.message"
  spotlight-radius.bind="coachMark.radius"
  active.bind="coachMark.active"
  on-tap.bind="() => coachMark.onTap?.()"
  on-dismiss.bind="() => coachMark.deactivate()"
></coach-mark>
