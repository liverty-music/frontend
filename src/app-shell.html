<import from="./components/error-banner/error-banner"></import>
<import from="./components/pwa-install-banner/pwa-install-banner"></import>
<import from="../shared/ui/snack-bar/snack-bar"></import>
<import from="./components/fab-menu/fab-menu"></import>

<!-- Single shell-hosted page header, positioned in the shell grid's `header`
     area (the CE sets its own `grid-area: header`). Its title is the displayed
     route's `data.titleKey`. Gated on `showNav` (same visibility as the nav bar)
     AND a non-empty title, so header-less routes (legal, about, not-found)
     render no header row. -->
<page-header if.bind="showNav && titleKey" title-key.bind="titleKey"></page-header>

<au-viewport></au-viewport>

<bottom-nav-bar if.bind="showNav"></bottom-nav-bar>

<!-- Top-layer overlays: rendered via popover/dialog in browser top layer,
     DOM position is irrelevant. Placed outside viewport to avoid grid interference. -->
<!-- Auth-gated (D5): guests already see signup-prompt-banner, so gating on
     isAuthenticated keeps the two banners mutually exclusive. Shown once
     onboarding is completed. Suppressed while a post-signup surface
     (celebration overlay / PostSignupDialog) occupies the bottom of the screen
     to avoid overlap (D7). Single instance guaranteed by app-shell — safe to
     use static ids inside. -->
<pwa-install-banner if.bind="showNav && auth.isAuthenticated && onboarding.isCompleted && !isPostSignupSurfaceOpen"></pwa-install-banner>
<!-- Stays interactive while a bottom sheet is open: a snack's action (an undo
     of what the fan just did in the sheet) shows above the sheet. -->
<snack-bar data-over-sheets></snack-bar>
<error-banner></error-banner>

<!-- Global FAB action launcher (top layer). Shown only with the bottom nav,
     only when the launcher has at least one item (a route's action, or the
     Settings item of the tab pages), and not while any bottom sheet is open
     (it would cover the sheet). -->
<fab-menu if.bind="showNav && fabMenu.actions.length && !sheets.anyOpen"></fab-menu>
