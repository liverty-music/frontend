<main class="[ callback-layout ] [ center flow ]">
  <output if.bind="!failed" class="[ callback-loading ] [ stack ]" role="status" aria-busy="true">
    <div class="callback-spinner"></div>
    <p class="[ callback-status ] [ md-typescale-body-large ]" t="authCallback.verifying"></p>
  </output>
  <section if.bind="failed" class="[ callback-error ] [ md-typescale-body-large-emphasized ]" role="alert" t="authCallback.failed"></section>
  <a if.bind="failed" load="/" class="[ text-link callback-home-link ]" data-variant="standalone" t="authCallback.home"></a>
</main>
