<main class="[ callback-layout ]">
  <output if.bind="!failed" class="callback-loading" role="status" aria-busy="true">
    <div class="callback-spinner"></div>
    <p class="callback-status" t="authCallback.verifying"></p>
  </output>
  <section if.bind="failed" class="callback-error" role="alert" t="authCallback.failed"></section>
  <a if.bind="failed" load="/" class="callback-home-link" t="authCallback.home"></a>
</main>
