<import from="./concert-route.css"></import>
<import from="../../components/concert-date-tabs/concert-date-tabs"></import>
<import from="../../components/concert-cover/concert-cover"></import>
<import from="../../components/concert-performers/concert-performers"></import>
<import from="../../components/concert-details/concert-details"></import>

<article class="[ concert-page ] [ flow wrapper ]" data-state.bind="state">
  <!-- Loading -->
  <state-placeholder if.bind="state === 'loading'" loading.bind="true" variant="card" rows="4" label.bind="'concert.loading' | t"></state-placeholder>

  <!-- No concert page: identical for every reason (unknown, discovered, draft, unlisted). -->
  <section if.bind="state === 'not-found'" class="[ state-placeholder ]" data-testid="event-not-found">
    <h1 class="[ state-placeholder-title ] [ md-typescale-headline-small ]" t="concert.notFound.title"></h1>
    <p t="concert.notFound.body"></p>
    <a href="/timetable" class="[ button ] [ state-layer ]" t="concert.notFound.toTimetable"></a>
  </section>

  <!-- Any other failure: retry -->
  <div if.bind="state === 'error'" class="[ state-placeholder ]" data-testid="event-error">
    <p t="concert.error.body"></p>
    <button type="button" class="[ button ] [ state-layer ]" click.trigger="retry()" t="concert.error.retry"></button>
  </div>

  <template if.bind="state === 'ready' && event">
    <!-- Cover image, or the brand placeholder -->
    <concert-cover url.bind="event.coverUrl"></concert-cover>

    <!-- Cancelled banner -->
    <div if.bind="isCancelled" class="event-banner" data-testid="event-cancelled" role="note">
      <p class="[ event-banner-title ] [ md-typescale-title-large-emphasized ]" t="concert.cancelled.title"></p>
      <p t="concert.cancelled.noSale"></p>
      <p t="concert.cancelled.refund"></p>
      <a href.bind="otherConcertsUrl" class="text-link" data-variant="standalone" t="concert.cancelled.otherConcerts"></a>
    </div>

    <!-- Ended notice -->
    <p if.bind="isEnded && !isCancelled" class="event-banner" data-testid="event-ended" role="note" t="concert.ended"></p>

    <!-- Date tabs (2–4 Events) -->
    <concert-date-tabs
      if.bind="dateNav === 'tabs'"
      tabs.bind="dateTabs"
      label.bind="'concert.dates.label' | t"
      cancelled-label.bind="'concert.dates.cancelled' | t"
      data-testid="concert-date-tabs"
    ></concert-date-tabs>

    <header class="event-header">
      <h1 class="[ event-title ] [ md-typescale-headline-small ]" data-testid="event-title">${event.title}</h1>
    </header>

    <!-- Performers with follow controls -->
    <concert-performers
      performers.bind="event.performers"
      followed-ids.bind="followedIds"
      follows-loaded.bind="followsLoaded"
      updating-id.bind="followUpdatingId"
      follow-toggle.trigger="toggleFollow($event.detail)"
    ></concert-performers>

    <!-- Date, times and venue -->
    <concert-details
      date-key.bind="event.dateKey"
      date-label.bind="dateLabel"
      open-time-label.bind="openTimeLabel"
      start-time-label.bind="startTimeLabel"
      venue-name.bind="event.venueName"
      prefecture.bind="prefecture"
      maps-url.bind="mapsUrl"
    ></concert-details>

    <!-- Description, as entered -->
    <p if.bind="event.description" class="event-description" data-testid="event-description">${event.description}</p>

    <!-- Share and add-to-calendar -->
    <div class="[ event-actions ] [ cluster ]">
      <button type="button" class="[ button ] [ state-layer ]" data-variant="outlined" click.trigger="share()" data-testid="event-share">
        <svg-icon name="link" size="md"></svg-icon>
        <span t="concert.share.action"></span>
      </button>
      <button type="button" class="[ button ] [ state-layer ]" data-variant="outlined" click.trigger="addToCalendar()" data-testid="event-calendar">
        <svg-icon name="calendar" size="md"></svg-icon>
        <span t="concert.addToCalendar"></span>
      </button>
    </div>

    <!-- Ticket section (none once the event has ended) -->
    <section if.bind="showTicketSection" class="event-tickets" data-testid="event-tickets" aria-labelledby="event-tickets-title">
      <h2 id="event-tickets-title" class="[ event-section-title ] [ md-typescale-title-medium ]" t="concert.tickets.title"></h2>
      <p if.bind="purchasedCount > 0" data-testid="event-purchased">
        <span t="concert.tickets.purchased" t-params.bind="{ count: purchasedCount }"></span>
        <a href="/tickets" class="text-link" t="concert.tickets.toTickets"></a>
      </p>
      <!-- The current sale and each seat type of the event; never a count -->
      <div if.bind="shownSale" class="[ event-sale ] [ flow ]" data-testid="event-sale" data-sale-method.bind="shownSale.method">
        <p class="[ event-sale-name ] [ md-typescale-title-medium ]" data-testid="event-sale-name">${shownSale.name}</p>
        <template if.bind="shownSale.method === 'firstCome'">
          <p if.bind="isSaleUpcoming" class="[ event-sale-status ] [ md-typescale-title-medium ]" data-testid="event-sale-opens" t="concert.tickets.sale.opens" t-params.bind="{ start: saleStartLabel }"></p>
          <p if.bind="isSaleEnded" class="[ event-sale-status ] [ md-typescale-title-medium ]" data-testid="event-sale-ended" t="concert.tickets.sale.ended"></p>
        </template>
        <template else>
          <p class="[ event-sale-status ] [ md-typescale-title-medium ]" data-testid="event-sale-window" t="concert.tickets.lottery.window" t-params.bind="{ start: saleStartLabel, end: saleEndLabel }"></p>
          <p if.bind="isSaleEnded" class="[ event-sale-status ] [ md-typescale-title-medium ]" data-testid="event-sale-ended" t="concert.tickets.lottery.ended"></p>
        </template>
        <p if.bind="perAccountLimit > 0" data-testid="event-sale-limit" t="concert.tickets.limit" t-params.bind="{ limit: perAccountLimit }"></p>
        <p if.bind="heldStock" class="[ event-sale-held ] [ md-typescale-body-large-emphasized ]" data-testid="event-sale-held" t="concert.tickets.held" t-params.bind="{ seatType: heldStock.seatTypeName }"></p>

        <ul class="[ event-stocks ] [ flow ]" role="list">
          <li
            repeat.for="row of stockRows; key.bind: row.stock.id"
            class="[ event-stock ] [ flow ]"
            data-testid="event-stock"
            data-stock-state.bind="row.stock.state"
          >
            <p class="[ event-stock-head ] [ cluster ]">
              <span class="[ event-stock-name ] [ md-typescale-title-large-emphasized ]" data-testid="event-stock-name">${row.stock.seatTypeName}</span>
              <span class="[ event-sale-price ] [ md-typescale-title-large-emphasized ]" data-testid="event-sale-price" t="concert.tickets.sale.price" t-params.bind="{ price: row.price }"></span>
            </p>
            <!-- First come, within the window: the stock's state -->
            <template if.bind="shownSale.method === 'firstCome' && isSaleOpen">
              <template switch.bind="row.stock.state">
                <template case="available">
                  <p if.bind="row.stock.lowStock" class="[ event-sale-low ] [ md-typescale-body-large-emphasized ]" data-testid="event-sale-low" t="concert.tickets.sale.lowStock"></p>
                  <template if.bind="row.offered">
                    <a if.bind="!isGuest" href.bind="row.actionUrl" class="[ button ] [ state-layer ]" data-testid="event-buy" t="concert.tickets.sale.buy"></a>
                    <button else type="button" class="[ button ] [ state-layer ]" click.trigger="signUp()" data-testid="event-buy" t="concert.tickets.sale.buy"></button>
                  </template>
                </template>
                <template case="allHeld">
                  <p class="[ event-sale-status ] [ md-typescale-title-medium ]" data-testid="event-sale-sold-out" t="concert.tickets.sale.soldOut"></p>
                  <p data-testid="event-sale-all-held" t="concert.tickets.sale.allHeldNote"></p>
                </template>
                <template case="soldOut">
                  <p class="[ event-sale-status ] [ md-typescale-title-medium ]" data-testid="event-sale-sold-out" t="concert.tickets.sale.soldOut"></p>
                </template>
              </template>
            </template>
            <!-- Lottery, within the window: enter this seat type -->
            <template if.bind="shownSale.method === 'lottery' && isSaleOpen && row.offered">
              <a if.bind="!isGuest" href.bind="row.actionUrl" class="[ button ] [ state-layer ]" data-testid="event-enter" t="concert.tickets.lottery.enter"></a>
              <button else type="button" class="[ button ] [ state-layer ]" click.trigger="signUp()" data-testid="event-enter" t="concert.tickets.lottery.enter"></button>
            </template>
            <!-- Official resale of a sold-out seat type, whichever sale is shown; never a count -->
            <div if.bind="row.stock.resaleOpen" class="[ event-resale ] [ flow ]" data-testid="event-resale">
              <p class="[ event-sale-name ] [ md-typescale-title-medium ]" t="concert.tickets.resale.title"></p>
              <p data-testid="event-resale-listing" t="concert.tickets.resale.listing"></p>
              <p data-testid="event-resale-draw" t="concert.tickets.resale.draw"></p>
              <template if.bind="!isGuest">
                <a if.bind="resaleApplied" href.bind="row.resaleUrl" class="[ button ] [ state-layer ]" data-variant="outlined" data-testid="event-resale-applied" t="concert.tickets.resale.applied"></a>
                <a else href.bind="row.resaleUrl" class="[ button ] [ state-layer ]" data-testid="event-resale-apply" t="concert.tickets.resale.apply"></a>
              </template>
              <button else type="button" class="[ button ] [ state-layer ]" click.trigger="signUp()" data-testid="event-resale-apply" t="concert.tickets.resale.apply"></button>
            </div>
          </li>
        </ul>
      </div>
      <template if.bind="!shownSale && isGuest && !isCancelled">
        <p t="concert.tickets.signUpHint"></p>
        <button type="button" class="[ button ] [ state-layer ]" click.trigger="signUp()" data-testid="event-signup" t="concert.tickets.signUp"></button>
      </template>
    </section>

    <!-- Other dates (more than 4 Events) -->
    <section if.bind="dateNav === 'list'" class="event-other-dates" data-testid="event-other-dates" aria-labelledby="event-other-dates-title">
      <h2 id="event-other-dates-title" class="[ event-section-title ] [ md-typescale-title-medium ]" t="concert.dates.others"></h2>
      <ul role="list">
        <li repeat.for="d of otherDates; key.bind: d.id">
          <a href="/concerts/${d.id}" class="text-link" data-variant="standalone">${d.label}</a>
          <span if.bind="d.cancelled" class="[ event-date-status ] [ md-typescale-label-large ]" t="concert.dates.cancelled"></span>
        </li>
      </ul>
    </section>
  </template>
</article>
