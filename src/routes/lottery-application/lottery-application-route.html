<template class="[ lottery-application-route ] [ flow ]">
	<header class="lottery-application-header">
		<h1 class="lottery-application-title" t="lotteryApplication.title"></h1>
	</header>

	<section class="lottery-application-panel" if.bind="step === 'loading'">
		<p class="lottery-application-lead" role="status" t="lotteryApplication.loading"></p>
	</section>

	<section class="[ lottery-application-panel ] [ flow ]" if.bind="step === 'empty'" data-testid="lottery-application-empty">
		<p class="lottery-application-lead" t="lotteryApplication.empty"></p>
	</section>

	<section class="[ lottery-application-panel ] [ flow ]" if.bind="step === 'error'" data-testid="lottery-application-error">
		<p class="lottery-application-error" t.bind="messageKey"></p>
		<button type="button" class="lottery-application-btn-primary" click.trigger="load()" t="lotteryApplication.reload"></button>
	</section>

	<section class="[ lottery-application-panel ] [ flow ]" if.bind="step === 'loaded'" data-testid="lottery-application-entry">
		<output class="lottery-application-status" data-kind.bind="resultKind">
			<span class="lottery-application-status-label" t.bind="stateLabelKey"></span>
		</output>

		<p class="lottery-application-lead" t.bind="'lotteryApplication.note.' + resultKind"></p>

		<dl class="lottery-application-summary">
			<div class="lottery-application-summary-row">
				<dt class="lottery-application-summary-key" t="lotteryApplication.count"></dt>
				<dd class="lottery-application-summary-val" t="lotteryApplication.countValue" t-params.bind="{ count: entry.requestedTicketCount }"></dd>
			</div>
			<div class="lottery-application-summary-row">
				<dt class="lottery-application-summary-key" t="lotteryApplication.status"></dt>
				<dd class="lottery-application-summary-val" t.bind="stateLabelKey"></dd>
			</div>
		</dl>

		<p class="lottery-application-error" if.bind="messageKey" role="alert" t.bind="messageKey"></p>

		<div class="[ lottery-application-actions ] [ flow ]" if.bind="canWithdraw">
			<button
				type="button"
				class="lottery-application-btn-secondary"
				click.trigger="askWithdraw()"
				if.bind="!confirmingWithdraw"
				t="lotteryApplication.withdraw.action"
			></button>

			<div class="[ lottery-application-confirm ] [ flow ]" if.bind="confirmingWithdraw">
				<p class="lottery-application-lead" t="lotteryApplication.withdraw.confirm"></p>
				<div class="[ lottery-application-confirm-actions ] [ cluster ]">
					<button
						type="button"
						class="lottery-application-btn-secondary"
						click.trigger="cancelWithdraw()"
						disabled.bind="withdrawing"
						t="lotteryApplication.withdraw.cancel"
					></button>
					<button
						type="button"
						class="lottery-application-btn-danger"
						click.trigger="confirmWithdraw()"
						disabled.bind="withdrawing"
						t.bind="withdrawing ? 'lotteryApplication.withdraw.submitting' : 'lotteryApplication.withdraw.submit'"
					></button>
				</div>
			</div>
		</div>
	</section>
</template>
