<import from="./hype-dot-radio.css"></import>
<import from="./hype-dot-halo.css"></import>

<input
  ref="radio"
  type="radio"
  class="[ visually-hidden ]"
  name.bind="group"
  model.bind="level"
>
<span class="[ visually-hidden ]">${accessibleName}</span>
<span
  class="hype-dot"
  data-active.bind="active"
  data-level.bind="level"
></span>
