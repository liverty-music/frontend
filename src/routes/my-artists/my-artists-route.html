<import from="./my-artists-route.css"></import>

<!-- Header always renders so the page identity is preserved across loading
     / empty / populated states. The hype-table column headers below carry
     their own labels, so duplication isn't a concern. -->
<page-header title-key="nav.myArtists">
  <!-- Edit toggle: visible only in the populated state (nothing to edit otherwise). -->
  <button
    if.bind="!isLoading && artists.length > 0"
    type="button"
    class="edit-toggle"
    aria-pressed.bind="editing"
    t.bind="editing ? 'myArtists.done' : 'myArtists.edit'"
    click.trigger="toggleEditing()"
  ></button>
  <page-help page="my-artists"></page-help>
</page-header>

<main>
  <!-- Loading state -->
  <div if.bind="isLoading" class="state-center">
    <loading-spinner></loading-spinner>
  </div>

  <!-- Empty state -->
  <state-placeholder
    if.bind="!isLoading && artists.length === 0"
    icon="music"
  >
    <h2 t="myArtists.empty.title" class="empty-title"></h2>
    <p t="myArtists.empty.subtitle" class="empty-subtitle"></p>
    <a
      href.bind="'discovery'"
      t="myArtists.empty.discoverButton"
      class="discover-cta"
    ></a>
  </state-placeholder>

  <!-- Artist hype table -->
  <fieldset if.bind="!isLoading && artists.length > 0" class="artists-fieldset">
    <legend class="[ visually-hidden ]" t="nav.myArtists"></legend>
    <table class="artists-table">
      <thead>
        <tr class="artists-thead-row">
          <th scope="col" class="[ visually-hidden ]" t="myArtists.table.artistCol"></th>
          <!-- Hype tier headers hidden in edit mode; remove column takes their place. -->
          <template if.bind="!editing">
            <!-- Hype tier labels are Layer B brand expressions (per brand-vocabulary spec):
                 rendered invariantly in English in every locale, not via i18n. -->
            <th scope="col" class="hype-col-header">👀<small>Watch</small></th>
            <th scope="col" class="hype-col-header">🔥<small>Home</small></th>
            <th scope="col" class="hype-col-header">🔥🔥<small>Nearby</small></th>
            <th scope="col" class="hype-col-header">🔥🔥🔥<small>Away</small></th>
          </template>
          <!-- Remove column header: only visible in edit mode. -->
          <th if.bind="editing" scope="col" aria-label="Remove"></th>
        </tr>
      </thead>
      <tbody data-artist-rows>
        <tr
          repeat.for="artist of artists; key.bind: artist.artist.id"
          class="artist-row"
          css="--_vt-name: artist-${artist.artist.id}; --_dot-color: ${artist.color}"
        >
          <!-- Artist name cell -->
          <th scope="row" class="artist-name-cell">
            <span class="artist-row-indicator" aria-hidden="true"></span>
            <span class="artist-row-name">${artist.artist.name}</span>
          </th>

          <!-- Hype dot cells: hidden in edit mode to avoid layout shift. -->
          <template if.bind="!editing">
            <td repeat.for="level of hypeLevels" class="hype-col">
              <label class="hype-label">
                <input
                  type="radio"
                  class="[ visually-hidden ]"
                  name.bind="'hype-' + artist.artist.id"
                  model.bind="level"
                  change.trigger="onHypeInput(artist, level)"
                >
                <span
                  class="hype-dot"
                  data-active.bind="level === artist.hype"
                  data-level.bind="level"
                ></span>
              </label>
            </td>
          </template>

          <!-- Remove cell: replaces hype columns in edit mode. -->
          <td if.bind="editing" class="artist-remove-col">
            <button
              type="button"
              class="artist-remove-btn"
              aria-label.bind="i18n.tr('myArtists.unfollowArtist', { name: artist.artist.name })"
              click.trigger="unfollowArtist(artist)"
            >
              <svg-icon name="trash" aria-hidden="true"></svg-icon>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </fieldset>
</main>

<!-- Signup prompt banner — non-dismissable; visible whenever the user is a guest.
     Per signup-prompt-banner capability spec, the dismiss button is removed
     entirely and visibility is host-controlled by `showSignupBanner`. -->
<signup-prompt-banner
  visible.bind="showSignupBanner && !isAuthenticated"
  message.bind="i18n.tr('myArtists.signupBanner.message')"
  signup-requested.trigger="onSignupRequested()">
</signup-prompt-banner>
