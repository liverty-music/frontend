<import from="./my-artists-route.css"></import>

<!-- The page title ("My Artists") is owned by the shell-hosted <page-header>,
     driven from the route's data.titleKey; it stays mounted across this route's
     loading / empty / populated states. -->

<!-- Help sheet + edit toggle both live in the FAB launcher now; page-help
     renders sheet-only and is opened via its ref. -->
<!-- The help waits for the home sheet: two sheets never open at once. -->
<page-help component.ref="pageHelp" page="my-artists" auto-open.bind="!needsHome"></page-help>

<main>
  <!-- Loading state: content-shaped skeleton rows (replaces the centered
       spinner) so the swap to the hype table is layout-shift-free. -->
  <state-placeholder if.bind="isLoading" loading.bind="true" rows.bind="6"></state-placeholder>

  <!-- Empty state -->
  <state-placeholder
    if.bind="!isLoading && artists.length === 0"
    icon="music"
  >
    <div class="[ empty-text ] [ stack flow ]">
      <h2 t="myArtists.empty.title" class="[ empty-title ] [ md-typescale-title-large ]"></h2>
      <p t="myArtists.empty.subtitle" class="[ empty-subtitle ] [ md-typescale-body-medium ]"></p>
      <a
        href="/discovery"
        t="myArtists.empty.discoverButton"
        class="[ button empty-action ] [ pressable ]"
        data-testid="discover-link"
      ></a>
    </div>
  </state-placeholder>

  <!-- Artist hype table -->
  <fieldset if.bind="!isLoading && artists.length > 0" class="artists-fieldset" data-editing.bind="editing">
    <legend class="[ visually-hidden ]" t="nav.myArtists"></legend>
    <table class="artists-table">
      <thead data-hype-header>
        <tr class="artists-thead-row">
          <!-- The cell stays in the grid (its column), only its name is hidden. -->
          <th scope="col"><span class="[ visually-hidden ]" t="myArtists.table.artistCol"></span></th>
          <!-- Hype tier headers hidden in edit mode; remove column takes their place. -->
          <template if.bind="!editing">
            <!-- Hype tier labels are Layer B brand expressions (per brand-vocabulary spec):
                 rendered invariantly in English in every locale, not via i18n. -->
            <th scope="col" class="[ hype-col-header ] [ md-typescale-label-small ]">👀<small>Watch</small></th>
            <th scope="col" class="[ hype-col-header ] [ md-typescale-label-small ]">🔥<small>Home</small></th>
            <th scope="col" class="[ hype-col-header ] [ md-typescale-label-small ]">🔥🔥<small>Nearby</small></th>
            <th scope="col" class="[ hype-col-header ] [ md-typescale-label-small ]">🔥🔥🔥<small>Away</small></th>
          </template>
          <!-- Remove column header: only visible in edit mode. -->
          <th if.bind="editing" scope="col"><span class="[ visually-hidden ]" t="myArtists.table.removeCol"></span></th>
        </tr>
      </thead>
      <tbody data-artist-rows>
        <tr
          repeat.for="artist of artists; key.bind: artist.artist.id"
          class="artist-row"
          css="--_vt-name: artist-${artist.artist.id}; --_dot-color: ${artist.color}"
        >
          <!-- Artist name cell -->
          <th scope="row" class="artist-name-cell">
            <span class="artist-row-indicator" aria-hidden="true"></span>
            <span class="[ artist-row-name ] [ md-typescale-label-large ]">${artist.artist.name}</span>
          </th>

          <!-- Hype dot cells: hidden in edit mode to avoid layout shift. -->
          <template if.bind="!editing">
            <td repeat.for="level of hypeLevels" class="hype-col">
              <label class="hype-label">
                <input
                  type="radio"
                  class="[ visually-hidden ]"
                  name.bind="'hype-' + artist.artist.id"
                  model.bind="level"
                  change.trigger="onHypeInput(artist, level)"
                >
                <span class="[ visually-hidden ]">${hypeTiers[level].label}</span>
                <span
                  class="hype-dot"
                  data-active.bind="level === artist.hype"
                  data-level.bind="level"
                ></span>
              </label>
            </td>
          </template>

          <!-- Remove cell: replaces hype columns in edit mode. -->
          <td if.bind="editing" class="artist-remove-col">
            <button
              type="button"
              class="artist-remove-btn"
              aria-label.bind="i18n.tr('myArtists.unfollowArtist', { name: artist.artist.name })"
              click.trigger="unfollowArtist(artist)"
            >
              <svg-icon name="trash" size="md" aria-hidden="true"></svg-icon>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </fieldset>
</main>

<!-- Edit-mode action bar: fixed just above the bottom nav, thumb-reachable. The
     FAB is hidden while editing, so this is the sole (and unambiguous) exit.
     Shown only in edit mode. -->
<div if.bind="editing" class="edit-action-bar" role="toolbar" aria-label="編集">
  <button type="button" class="[ button ] [ pressable ]" click.trigger="toggleEditing()">
    <svg-icon name="check" size="sm" aria-hidden="true"></svg-icon>
    <span t="myArtists.done"></span>
  </button>
</div>

<!-- Signup prompt banner — non-dismissable; visible whenever the user is a guest.
     Suppressed during edit so it doesn't compete with the Done bar for the
     bottom band. Per spec the dismiss button is removed; visibility is
     host-controlled by `showSignupBanner`. -->
<signup-prompt-banner
  visible.bind="showSignupBanner && !isAuthenticated && !editing"
  message.bind="i18n.tr('myArtists.signupBanner.message')"
  signup-requested.trigger="onSignupRequested()">
</signup-prompt-banner>

<!-- Home area sheet for a person without a home -->
<user-home-selector
  component.ref="homeSelector"
  current-code.bind="userStore.currentHome"
  on-home-selected.bind="(code) => onHomeSelected(code)"
  required.bind="homeRequired"
  sheet-hidden.trigger="onHomeSheetHidden()"
></user-home-selector>
