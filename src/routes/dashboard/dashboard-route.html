<import from="./dashboard-route.css"></import>
<import from="../../components/all-nearby/date-range-sheet"></import>

<!-- Title reflects the active mode and morphs across a View Transition. The
     header is title-only: the mode swap, filter, beam toggle, and help triggers
     all moved into the global FAB action launcher (see fab-action-launcher). -->
<page-header title-key.bind="modeTitleKey" morph-title.bind="true"></page-header>

<!-- Filter + help surfaces stay owned by the dashboard: only their triggers
     moved to the FAB launcher, so the components render sheet-only here (their
     bottom sheets and bindings are unchanged). The launcher opens them via the
     component refs. -->
<artist-filter-bar
  if.bind="!isOnboarding && !isAllNearby"
  component.ref="filterBar"
  counted-artists.bind="countedArtists"
  selected-ids.two-way="filteredArtistIds"
  selected-statuses.two-way="filteredStatuses"
  active-from.bind="fromDate"
  date-changed.trigger="onDateFilterChanged($event)"
  is-authenticated.bind="isAuthenticated"
></artist-filter-bar>
<page-help component.ref="pageHelp" page="dashboard"></page-help>

<!-- All Nearby filters: a fixed-height row of exactly two chips — area + date.
     Neither expands inline, so the ConcertHighway timetable height is stable.
     Each chip opens a bottom sheet. (All Nearby mode only.) -->
<div if.bind="isAllNearby" class="[ all-nearby-filters ] [ cluster ]" role="group" t="[aria-label]allNearby.filterBar.label">
  <button type="button" class="filter-chip" click.trigger="openAreaSelector()">
    <svg-icon name="map-pin" size="sm"></svg-icon>
    <span if.bind="selectedAreaName" class="chip-label">${selectedAreaName}</span>
    <span else class="chip-label chip-label-empty" t="allNearby.area.choose"></span>
    <svg-icon name="chevron-right" size="xs" class="chip-caret"></svg-icon>
  </button>
  <button type="button" class="filter-chip" click.trigger="openDateSheet()">
    <svg-icon name="calendar" size="sm"></svg-icon>
    <span class="chip-label">${dateChipLabel}</span>
    <svg-icon name="chevron-right" size="xs" class="chip-caret"></svg-icon>
  </button>
</div>

<!-- ── My Timetable view ── -->
<template if.bind="!isAllNearby">
  <!-- Loading state -->
  <p if.bind="isLoading" class="loading-text" data-testid="dashboard-loading" t="dashboard.loading"></p>

  <!-- Error state -->
  <inline-error
    if.bind="loadError"
    message.bind="i18n.tr('dashboard.error.load')"
    error.bind="loadError"
    retry-action.bind="() => loadData()"
  ></inline-error>

  <!-- Guest empty-state CTA: unauthenticated visitor with zero follows. Soft gate
       guidance toward discovery instead of a guard redirect. -->
  <state-placeholder if.bind="!isLoading && !loadError && showGuestEmptyState && !needsRegion" icon="clock">
    <p t="dashboard.guestEmpty.title" class="dashboard-empty-title"></p>
    <p t="dashboard.guestEmpty.subtitle" class="dashboard-empty-subtitle"></p>
    <a href.bind="'discovery'" t="dashboard.guestEmpty.cta" class="discover-cta"></a>
  </state-placeholder>

  <!-- Empty state -->
  <state-placeholder if.bind="!isLoading && !loadError && !showGuestEmptyState && filteredDateGroups.length === 0" icon="clock">
    <p t="dashboard.empty.title" class="dashboard-empty-title"></p>
    <p t="dashboard.empty.subtitle" class="dashboard-empty-subtitle"></p>
    <a href.bind="'discovery'" t="dashboard.empty.discoverLink" class="discover-cta"></a>
  </state-placeholder>

  <!-- Concert highway — always in DOM for E2E compatibility -->
  <concert-highway
    date-groups.bind="filteredDateGroups"
    show-beams.bind="showBeams"
    data-blurred.bind="needsRegion"
    event-selected.trigger="onEventSelected($event)"
  ></concert-highway>
</template>

<!-- ── All Nearby view ── -->
<template if.bind="isAllNearby">
  <!-- Loading state -->
  <p if.bind="allNearbyLoading" class="loading-text" data-testid="all-nearby-loading" t="dashboard.loading"></p>

  <!-- Error state -->
  <inline-error
    if.bind="allNearbyError"
    message.bind="i18n.tr('dashboard.error.load')"
    error.bind="allNearbyError"
    retry-action.bind="() => loadAllNearby()"
  ></inline-error>

  <!-- Empty state: no concerts for the selected area + date range. -->
  <state-placeholder
    if.bind="!allNearbyLoading && !allNearbyError && allNearbyDateGroups.length === 0"
    icon="clock"
  >
    <p t="allNearby.empty.title" class="dashboard-empty-title"></p>
    <p t="allNearby.empty.subtitle" class="dashboard-empty-subtitle"></p>
    <a href.bind="'discovery'" t="allNearby.empty.discoverLink" class="discover-cta"></a>
  </state-placeholder>

  <!-- All Nearby highway — venue shown on every card; AWAY lane omitted (2 lanes). -->
  <concert-highway
    date-groups.bind="allNearbyDateGroups"
    show-beams.bind="false"
    show-venue-always.bind="true"
    hide-away.bind="true"
    event-selected.trigger="onEventSelected($event)"
  ></concert-highway>
</template>

<!-- Bottom sheet for event details (top-layer dialog). The All Nearby follow CTA
     dispatches signup-requested for guests → surface the sign-up prompt banner. -->
<event-detail-sheet
  component.ref="detailSheet"
  on-signup-requested.bind="() => onFollowSignupRequested()"
></event-detail-sheet>

<!-- Signup prompt banner for unauthenticated users (non-dismissable) -->
<signup-prompt-banner
  visible.bind="showSignupBanner && !isAuthenticated"
  message.bind="i18n.tr('myArtists.signupBanner.message')"
  signup-requested.trigger="onSignupRequested()">
</signup-prompt-banner>

<!-- Home area selector bottom sheet (onboarding / region setup) -->
<user-home-selector
  component.ref="homeSelector"
  current-code.bind="userStore.currentHome"
  on-home-selected.bind="(code) => onHomeSelected(code)"
  required.bind="isOnboarding"
></user-home-selector>

<!-- All Nearby area-override selector. Route-local only — does NOT persist to
     userStore.updateHome(). Rendered only in All Nearby mode so it never
     collides with the onboarding selector above (two user-home-selector
     instances would otherwise both be in the DOM). -->
<user-home-selector
  if.bind="isAllNearby"
  component.ref="areaSelector"
  current-code.bind="selectedAreaCode ?? userStore.currentHome"
  on-home-selected.bind="(code) => onAreaSelected(code)"
></user-home-selector>

<!-- All Nearby date-range sheet. Rendered only in All Nearby mode so its
     bound()-time initial emit fires on entry (seeding allNearbyRange +
     dateChipLabel and driving the first load), and it never lingers in the DOM
     for My Timetable. -->
<date-range-sheet
  if.bind="isAllNearby"
  component.ref="dateSheet"
  range-changed.trigger="onRangeChanged($event)"
></date-range-sheet>

<!-- Celebration overlay — two tiers (guest light / post-signup confetti),
     gated on timetable readiness via maybeCelebrate() -->
<celebration-overlay
  active.bind="showCelebration"
  confetti.bind="celebrationConfetti"
  message.bind="celebrationMessage"
  sub-message.bind="celebrationSubMessage"
  on-open.bind="() => onCelebrationOpened()"
  on-dismissed.bind="() => onCelebrationDismissed()"
></celebration-overlay>

<!-- PostSignupDialog — shown once after first-time signup -->
<post-signup-dialog active.bind="showPostSignupDialog"></post-signup-dialog>
