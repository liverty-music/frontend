<import from="../../components/ticket-resale-notice/ticket-resale-notice"></import>

<template class="[ order-route ] [ flow ]">
	<header class="order-header">
		<h1 class="[ order-title ] [ md-typescale-headline-small ]" t="order.title"></h1>
	</header>

	<!-- Loading -->
	<section
		class="[ order-panel card ] [ wrapper ]"
		if.bind="step === 'loading'"
	>
		<p class="[ order-lead ] [ md-typescale-body-medium ]" t="order.loading"></p>
	</section>

	<!-- Not found: non-revealing — order not the caller's or does not exist -->
	<section
		class="[ order-panel card ] [ flow wrapper ]"
		if.bind="step === 'notfound'"
	>
		<h2 class="[ order-step-title ] [ md-typescale-title-large-emphasized ]" t="order.notFound.title"></h2>
		<p class="[ order-lead ] [ md-typescale-body-medium ]" t="order.notFound.subtitle"></p>
	</section>

	<!-- Error -->
	<section
		class="[ order-panel card ] [ flow wrapper ]"
		if.bind="step === 'error'"
	>
		<h2 class="[ order-step-title ] [ md-typescale-title-large-emphasized ]" t="order.error.title"></h2>
		<p class="[ order-error ] [ md-typescale-body-medium ]">${error}</p>
		<button
			type="button"
			class="[ button order-action ] [ state-layer ]"
			click.trigger="load()"
			t="order.error.retry"
		></button>
	</section>

	<!-- Loaded -->
	<section
		class="[ order-content ] [ flow wrapper ]"
		if.bind="step === 'loaded'"
	>
		<!-- §5.2 Refund banner (shown prominently before payment details) -->
		<output
			class="[ order-status-banner ] [ stack wrapper ]"
			data-kind.bind="order.statusKind"
			if.bind="order.statusKind === 'refunded'"
		>
			<span class="[ order-status-banner-label ] [ md-typescale-title-large-emphasized ]">${statusLabel}</span>
			<p class="[ order-status-banner-desc ] [ md-typescale-body-medium ]" t="order.status.refundedDesc"></p>
		</output>

		<!-- §5.1 Payment result card -->
		<article class="[ order-panel card ] [ flow wrapper ]">
			<h2 class="[ order-section-title ] [ md-typescale-title-medium ]" t="order.payment.title"></h2>

			<!-- Payment status -->
			<output class="[ status-label ] [ md-typescale-label-large ]" data-tone.bind="statusTone">${statusLabel}</output>

			<!-- Payment summary -->
			<dl class="summary-list">
				<!-- Tax-inclusive total (総額表示; §6 per-fee breakdown is deferred) -->
				<div>
					<dt class="md-typescale-label-large" t="order.payment.amount"></dt>
					<dd class="[ order-summary-amount ] [ md-typescale-title-large-emphasized ]">${order.amountFormatted}<span class="[ order-tax-label ] [ md-typescale-label-small ]" t="order.payment.taxIncluded"></span></dd>
				</div>

				<!-- Paid date -->
				<div if.bind="order.payTime">
					<dt class="md-typescale-label-large" t="order.payment.payTime"></dt>
					<dd class="md-typescale-body-large">${formatDate(order.payTime)}</dd>
				</div>

				<!-- Card brand + last4 (shown when available) -->
				<div if.bind="order.cardLast4">
					<dt class="md-typescale-label-large" t="order.payment.card"></dt>
					<dd class="md-typescale-body-large">${order.cardBrand} •••• ${order.cardLast4}</dd>
				</div>
			</dl>
		</article>

		<!-- §5.1 Issued tickets for this order -->
		<article
			class="[ order-panel card ] [ flow wrapper ]"
			if.bind="tickets.length > 0"
		>
			<h2 class="[ order-section-title ] [ md-typescale-title-medium ]" t="order.tickets.title"></h2>

			<ul class="[ order-ticket-list ] [ stack ]">
				<li
					class="[ order-ticket-card ] [ flow ]"
					repeat.for="ticket of tickets"
					data-voided.bind="ticket.isVoided"
				>
					<!-- Ticket status -->
					<output class="[ status-label ] [ md-typescale-label-large ]" data-tone.bind="ticketTone(ticket)">${ticketStatusLabel(ticket)}</output>

					<!-- Ticket details -->
					<dl class="summary-list">
						<div>
							<dt class="md-typescale-label-large" t="order.tickets.field.eventId"></dt>
							<!-- TODO(tickets): resolve event title once a fan-facing event-read RPC exists -->
							<dd class="md-typescale-body-large">${ticket.eventId}</dd>
						</div>
						<div>
							<dt class="md-typescale-label-large" t="order.tickets.field.fullName"></dt>
							<dd class="md-typescale-body-large">${ticket.fullName}</dd>
						</div>
						<div>
							<dt class="md-typescale-label-large" t="order.tickets.field.issueTime"></dt>
							<dd class="md-typescale-body-large">${formatDate(ticket.issueTime)}</dd>
						</div>
					</dl>

					<!-- 特定興行入場券 resale-prohibition notice -->
					<ticket-resale-notice></ticket-resale-notice>
				</li>
			</ul>
		</article>
	</section>
</template>
