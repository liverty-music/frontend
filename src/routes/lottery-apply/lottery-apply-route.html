<template class="[ lottery-apply-route ] [ flow ]">
	<header class="lottery-apply-header">
		<h1 class="lottery-apply-title" t="lotteryApply.title"></h1>
	</header>

	<p if.bind="step === 'loading'" class="lottery-apply-lead" role="status" t="lotteryApply.loading"></p>

	<!-- Stripe not configured for this environment: fail closed. -->
	<section class="lottery-apply-panel" if.bind="step === 'unavailable'" data-testid="lottery-apply-unavailable">
		<p class="lottery-apply-lead" t="lotteryApply.unavailable"></p>
	</section>

	<section class="[ lottery-apply-panel ] [ flow ]" if.bind="step === 'not-found'" data-testid="lottery-apply-not-found">
		<p class="lottery-apply-lead" t="lotteryApply.notFound"></p>
		<a href="/events/${event.id}" if.bind="event" t="lotteryApply.backToEvent"></a>
	</section>

	<section class="[ lottery-apply-panel ] [ flow ]" if.bind="step === 'closed'" data-testid="lottery-apply-closed">
		<p class="lottery-apply-lead" t="lotteryApply.closed"></p>
		<a href="/events/${event.id}" if.bind="event" t="lotteryApply.backToEvent"></a>
	</section>

	<!-- The TicketType entered: the sale's name, the event, the price and the limit -->
	<section
		if.bind="sale && event && (step === 'verify-required' || step === 'count' || step === 'identity' || step === 'payment' || step === 'submitting')"
		class="[ lottery-apply-panel ] [ flow ]"
		data-testid="lottery-apply-summary"
	>
		<p class="lottery-apply-step-title" data-testid="lottery-apply-sale-name">${sale.name}</p>
		<p class="lottery-apply-lead" data-testid="lottery-apply-event">${event.title}<br />${dateLabel} · ${event.venueName}</p>
		<p class="lottery-apply-lead" data-testid="lottery-apply-price" t="lotteryApply.price" t-params.bind="{ price: yen(price) }"></p>
		<p class="lottery-apply-lead" data-testid="lottery-apply-limit" t="lotteryApply.limit" t-params.bind="{ limit: perAccountLimit }"></p>
		<p class="lottery-apply-lead" t="lotteryApply.window" t-params.bind="{ window: windowLabel }"></p>
	</section>

	<!-- Verification gate: the sale requires a verification the fan lacks. -->
	<section class="[ lottery-apply-panel ] [ flow ]" if.bind="step === 'verify-required'" data-testid="lottery-apply-verify">
		<h2 class="lottery-apply-step-title" t="lotteryApply.verify.title"></h2>
		<p class="lottery-apply-lead" t="lotteryApply.verify.body"></p>
		<button type="button" class="lottery-apply-btn-primary" click.trigger="goToVerify()" t="lotteryApply.verify.action"></button>
	</section>

	<!-- Step 1: ticket count -->
	<section class="[ lottery-apply-panel ] [ flow ]" if.bind="step === 'count'" data-testid="lottery-apply-count">
		<h2 class="lottery-apply-step-title" t="lotteryApply.count.title"></h2>
		<label class="lottery-apply-field">
			<span class="lottery-apply-label" t="lotteryApply.count.label" t-params.bind="{ limit: perAccountLimit }"></span>
			<select value.bind="ticketCount" class="lottery-apply-input" data-testid="lottery-apply-count-select">
				<option repeat.for="n of countOptions" model.bind="n">${n}</option>
			</select>
		</label>
		<p class="lottery-apply-total" data-testid="lottery-apply-total" t="lotteryApply.total" t-params.bind="{ total: yen(total) }"></p>
		<p class="lottery-apply-error" if.bind="message" role="alert" data-testid="lottery-apply-message" t.bind="message.key" t-params.bind="message.params"></p>
		<button type="button" class="lottery-apply-btn-primary" click.trigger="toIdentity()" disabled.bind="busy" data-testid="lottery-apply-to-identity" t="lotteryApply.count.continue"></button>
	</section>

	<!-- Step 2: 本人確認 -->
	<section class="[ lottery-apply-panel ] [ flow ]" if.bind="step === 'identity'" data-testid="lottery-apply-identity">
		<h2 class="lottery-apply-step-title" t="lotteryApply.identity.title"></h2>
		<p class="lottery-apply-lead" t="lotteryApply.identity.note"></p>
		<label class="lottery-apply-field">
			<span class="lottery-apply-label" t="lotteryApply.identity.name"></span>
			<input type="text" autocomplete="name" value.bind="fullName" class="lottery-apply-input" data-testid="lottery-apply-name" />
		</label>
		<label class="lottery-apply-field">
			<span class="lottery-apply-label" t="lotteryApply.identity.phone"></span>
			<input
				type="tel"
				autocomplete="tel"
				inputmode="tel"
				value.bind="phoneNumber"
				aria-invalid.bind="isPhoneInvalid"
				aria-describedby.bind="isPhoneInvalid ? 'lottery-apply-phone-error' : null"
				class="lottery-apply-input"
				data-testid="lottery-apply-phone"
			/>
		</label>
		<p id="lottery-apply-phone-error" class="lottery-apply-error" if.bind="isPhoneInvalid" t="lotteryApply.phoneInvalid"></p>
		<p class="lottery-apply-error" if.bind="message" role="alert" data-testid="lottery-apply-message" t.bind="message.key" t-params.bind="message.params"></p>
		<div class="[ lottery-apply-actions ] [ cluster ]">
			<button type="button" class="lottery-apply-btn-secondary" click.trigger="backToCount()" t="lotteryApply.back"></button>
			<button type="button" class="lottery-apply-btn-primary" click.trigger="toPayment()" disabled.bind="!isIdentityValid || busy" data-testid="lottery-apply-to-payment" t="lotteryApply.identity.continue"></button>
		</div>
	</section>

	<!-- Step 3: card authorization + 特商法 final confirmation -->
	<section class="[ lottery-apply-panel ] [ flow ]" if.bind="step === 'payment' || step === 'submitting'" data-testid="lottery-apply-payment">
		<h2 class="lottery-apply-step-title" t="lotteryApply.payment.title"></h2>
		<div class="[ lottery-apply-terms ] [ flow ]" role="note">
			<p class="lottery-apply-terms-lead" t="lotteryApply.payment.hold" t-params.bind="{ total: yen(total), count: ticketCount, price: yen(price) }"></p>
			<ul class="lottery-apply-terms-list">
				<li t="lotteryApply.payment.notCharged"></li>
				<li t="lotteryApply.payment.chargedOnWin"></li>
				<li t="lotteryApply.payment.releasedOnLoss"></li>
				<li t="lotteryApply.payment.withdraw"></li>
			</ul>
			<p class="lottery-apply-terms-brands" t="lotteryApply.payment.brands"></p>
		</div>

		<!-- Stripe Payment Element mounts here (Amex excluded server-side). -->
		<div class="lottery-apply-payment-element" ref="paymentElementHost"></div>

		<p class="lottery-apply-error" if.bind="cardError" role="alert" data-testid="lottery-apply-card-error">${cardError}</p>
		<p class="lottery-apply-error" if.bind="message" role="alert" data-testid="lottery-apply-message" t.bind="message.key" t-params.bind="message.params"></p>
		<button
			type="button"
			class="lottery-apply-btn-primary"
			click.trigger="confirmEntry()"
			disabled.bind="step === 'submitting'"
			data-testid="lottery-apply-confirm"
			t.bind="step === 'submitting' ? 'lotteryApply.payment.submitting' : 'lotteryApply.payment.confirm'"
		></button>
	</section>

	<!-- The entry was made (Confirm succeeded) -->
	<section class="[ lottery-apply-panel ] [ flow ]" if.bind="step === 'done'" data-testid="lottery-apply-done">
		<h2 class="lottery-apply-step-title" t="lotteryApply.done.title"></h2>
		<p class="lottery-apply-lead" t="lotteryApply.done.body" t-params.bind="{ sale: sale.name, count: entry.requestedTicketCount }"></p>
		<a href.bind="entryStatusUrl" class="lottery-apply-btn-primary" data-testid="lottery-apply-to-status" t="lotteryApply.done.toStatus"></a>
	</section>
</template>
