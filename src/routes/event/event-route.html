<import from="./event-route.css"></import>
<import from="../../components/event-date-tabs/event-date-tabs"></import>

<article class="[ event-page ] [ flow ]" data-state.bind="state">
  <!-- Loading -->
  <p if.bind="state === 'loading'" class="event-status" role="status" t="eventPage.loading"></p>

  <!-- No event page: identical for every reason (unknown, discovered, draft, unlisted). -->
  <section if.bind="state === 'not-found'" class="event-empty" data-testid="event-not-found">
    <h1 class="event-empty-title" t="eventPage.notFound.title"></h1>
    <p t="eventPage.notFound.body"></p>
    <a href="/dashboard" class="[ button ] [ pressable ]" t="eventPage.notFound.toDashboard"></a>
  </section>

  <!-- Any other failure: retry -->
  <div if.bind="state === 'error'" class="event-empty" data-testid="event-error">
    <p t="eventPage.error.body"></p>
    <button type="button" class="[ button ] [ pressable ]" click.trigger="retry()" t="eventPage.error.retry"></button>
  </div>

  <template if.bind="state === 'ready' && event">
    <!-- Cover image, or the brand placeholder -->
    <figure class="event-cover">
      <img
        if.bind="event.coverUrl"
        src.bind="event.coverUrl"
        alt=""
        decoding="async"
        fetchpriority="high"
        class="event-cover-img"
        data-testid="event-cover"
      />
      <div else class="event-cover-placeholder" data-testid="event-cover-placeholder" role="presentation">
        <svg-icon name="music" size="md"></svg-icon>
      </div>
    </figure>

    <!-- Cancelled banner -->
    <div if.bind="isCancelled" class="event-banner" data-testid="event-cancelled" role="note">
      <p class="event-banner-title" t="eventPage.cancelled.title"></p>
      <p t="eventPage.cancelled.noSale"></p>
      <p t="eventPage.cancelled.refund"></p>
      <a href.bind="otherConcertsUrl" class="event-link" t="eventPage.cancelled.otherConcerts"></a>
    </div>

    <!-- Ended notice -->
    <p if.bind="isEnded && !isCancelled" class="event-banner" data-testid="event-ended" role="note" t="eventPage.ended"></p>

    <!-- Date tabs (2–4 Events) -->
    <event-date-tabs
      if.bind="dateNav === 'tabs'"
      tabs.bind="dateTabs"
      label.bind="'eventPage.dates.label' | t"
      cancelled-label.bind="'eventPage.dates.cancelled' | t"
      data-testid="event-date-tabs"
    ></event-date-tabs>

    <header class="event-header">
      <h1 class="event-title" data-testid="event-title">${event.title}</h1>
    </header>

    <!-- Performers with follow controls -->
    <ul class="event-performers" role="list">
      <li repeat.for="performer of event.performers; key.bind: performer.id" class="event-performer">
        <span class="event-performer-name">${performer.name}</span>
        <button
          type="button"
          class="[ event-follow ] [ pressable ]"
          data-followed.bind="followedIds.has(performer.id)"
          aria-pressed.bind="followedIds.has(performer.id)"
          disabled.bind="!followsLoaded || followUpdatingId === performer.id"
          click.trigger="toggleFollow(performer)"
          data-testid="event-follow"
          t.bind="followedIds.has(performer.id) ? 'eventPage.follow.following' : 'eventPage.follow.action'"
        ></button>
      </li>
    </ul>

    <!-- Date and times -->
    <section class="event-details">
      <div class="event-detail-row">
        <svg-icon name="calendar" size="md" class="event-detail-icon"></svg-icon>
        <div>
          <time datetime.bind="event.dateKey" class="event-detail-primary" data-testid="event-date">${dateLabel}</time>
          <p class="event-times" data-testid="event-times">
            <span if.bind="openTimeLabel"><span t="eventPage.open"></span> ${openTimeLabel}</span>
            <span if.bind="startTimeLabel"><span t="eventPage.start"></span> ${startTimeLabel}</span>
          </p>
        </div>
      </div>

      <!-- Venue -->
      <div class="event-detail-row">
        <svg-icon name="map-pin" size="md" class="event-detail-icon"></svg-icon>
        <div>
          <p class="event-detail-primary" data-testid="event-venue">${event.venueName}</p>
          <p if.bind="prefecture" class="event-detail-secondary" data-testid="event-prefecture">${prefecture}</p>
          <a
            href.bind="mapsUrl"
            target="_blank"
            rel="noopener noreferrer"
            class="event-link"
            data-testid="event-maps"
            t="eventDetail.openInGoogleMaps"
          ></a>
        </div>
      </div>
    </section>

    <!-- Description, as entered -->
    <p if.bind="event.description" class="event-description" data-testid="event-description">${event.description}</p>

    <!-- Share and add-to-calendar -->
    <div class="[ event-actions ] [ cluster ]">
      <button type="button" class="[ button ] [ pressable ]" data-variant="outlined" click.trigger="share()" data-testid="event-share">
        <svg-icon name="link" size="md"></svg-icon>
        <span t="eventPage.share.action"></span>
      </button>
      <button type="button" class="[ button ] [ pressable ]" data-variant="outlined" click.trigger="addToCalendar()" data-testid="event-calendar">
        <svg-icon name="calendar" size="md"></svg-icon>
        <span t="eventPage.addToCalendar"></span>
      </button>
    </div>

    <!-- Ticket section (none once the event has ended) -->
    <section if.bind="showTicketSection" class="event-tickets" data-testid="event-tickets" aria-labelledby="event-tickets-title">
      <h2 id="event-tickets-title" class="event-section-title" t="eventPage.tickets.title"></h2>
      <p if.bind="purchasedCount > 0" data-testid="event-purchased">
        <span t="eventPage.tickets.purchased" t-params.bind="{ count: purchasedCount }"></span>
        <a href="/tickets" class="event-link" t="eventPage.tickets.toTickets"></a>
      </p>
      <!-- The current sale and each seat type of the event; never a count -->
      <div if.bind="shownSale" class="[ event-sale ] [ flow ]" data-testid="event-sale" data-sale-method.bind="shownSale.method">
        <p class="event-sale-name" data-testid="event-sale-name">${shownSale.name}</p>
        <template if.bind="shownSale.method === 'firstCome'">
          <p if.bind="isSaleUpcoming" class="event-sale-status" data-testid="event-sale-opens" t="eventPage.tickets.sale.opens" t-params.bind="{ start: saleStartLabel }"></p>
          <p if.bind="isSaleEnded" class="event-sale-status" data-testid="event-sale-ended" t="eventPage.tickets.sale.ended"></p>
        </template>
        <template else>
          <p class="event-sale-status" data-testid="event-sale-window" t="eventPage.tickets.lottery.window" t-params.bind="{ start: saleStartLabel, end: saleEndLabel }"></p>
          <p if.bind="isSaleEnded" class="event-sale-status" data-testid="event-sale-ended" t="eventPage.tickets.lottery.ended"></p>
        </template>
        <p if.bind="perAccountLimit > 0" data-testid="event-sale-limit" t="eventPage.tickets.limit" t-params.bind="{ limit: perAccountLimit }"></p>
        <p if.bind="heldStock" class="event-sale-held" data-testid="event-sale-held" t="eventPage.tickets.held" t-params.bind="{ seatType: heldStock.seatTypeName }"></p>

        <ul class="[ event-stocks ] [ flow ]" role="list">
          <li
            repeat.for="row of stockRows; key.bind: row.stock.id"
            class="[ event-stock ] [ flow ]"
            data-testid="event-stock"
            data-stock-state.bind="row.stock.state"
          >
            <p class="[ event-stock-head ] [ cluster ]">
              <span class="event-stock-name" data-testid="event-stock-name">${row.stock.seatTypeName}</span>
              <span class="event-sale-price" data-testid="event-sale-price" t="eventPage.tickets.sale.price" t-params.bind="{ price: row.price }"></span>
            </p>
            <!-- First come, within the window: the stock's state -->
            <template if.bind="shownSale.method === 'firstCome' && isSaleOpen">
              <template switch.bind="row.stock.state">
                <template case="available">
                  <p if.bind="row.stock.lowStock" class="event-sale-low" data-testid="event-sale-low" t="eventPage.tickets.sale.lowStock"></p>
                  <template if.bind="row.offered">
                    <a if.bind="!isGuest" href.bind="row.actionUrl" class="[ button ] [ pressable ]" data-testid="event-buy" t="eventPage.tickets.sale.buy"></a>
                    <button else type="button" class="[ button ] [ pressable ]" click.trigger="signUp()" data-testid="event-buy" t="eventPage.tickets.sale.buy"></button>
                  </template>
                </template>
                <template case="allHeld">
                  <p class="event-sale-status" data-testid="event-sale-sold-out" t="eventPage.tickets.sale.soldOut"></p>
                  <p data-testid="event-sale-all-held" t="eventPage.tickets.sale.allHeldNote"></p>
                </template>
                <template case="soldOut">
                  <p class="event-sale-status" data-testid="event-sale-sold-out" t="eventPage.tickets.sale.soldOut"></p>
                </template>
              </template>
            </template>
            <!-- Lottery, within the window: enter this seat type -->
            <template if.bind="shownSale.method === 'lottery' && isSaleOpen && row.offered">
              <a if.bind="!isGuest" href.bind="row.actionUrl" class="[ button ] [ pressable ]" data-testid="event-enter" t="eventPage.tickets.lottery.enter"></a>
              <button else type="button" class="[ button ] [ pressable ]" click.trigger="signUp()" data-testid="event-enter" t="eventPage.tickets.lottery.enter"></button>
            </template>
            <!-- Official resale of a sold-out seat type, whichever sale is shown; never a count -->
            <div if.bind="row.stock.resaleOpen" class="[ event-resale ] [ flow ]" data-testid="event-resale">
              <p class="event-sale-name" t="eventPage.tickets.resale.title"></p>
              <p data-testid="event-resale-listing" t="eventPage.tickets.resale.listing"></p>
            </div>
          </li>
        </ul>
      </div>
      <template if.bind="!shownSale && isGuest && !isCancelled">
        <p t="eventPage.tickets.signUpHint"></p>
        <button type="button" class="[ button ] [ pressable ]" click.trigger="signUp()" data-testid="event-signup" t="eventPage.tickets.signUp"></button>
      </template>
    </section>

    <!-- Other dates (more than 4 Events) -->
    <section if.bind="dateNav === 'list'" class="event-other-dates" data-testid="event-other-dates" aria-labelledby="event-other-dates-title">
      <h2 id="event-other-dates-title" class="event-section-title" t="eventPage.dates.others"></h2>
      <ul role="list">
        <li repeat.for="d of otherDates; key.bind: d.id">
          <a href="/events/${d.id}" class="event-link">${d.label}</a>
          <span if.bind="d.cancelled" class="event-date-status" t="eventPage.dates.cancelled"></span>
        </li>
      </ul>
    </section>
  </template>
</article>
