<template class="[ new-resale-entry-route ] [ flow ]">

	<p if.bind="step === 'loading'" class="[ resale-entry-lead ] [ md-typescale-body-medium ]" role="status" t="newResaleEntry.loading"></p>

	<!-- Stripe not configured for this environment: fail closed. -->
	<section class="[ resale-entry-panel card ] [ wrapper ]" if.bind="step === 'unavailable'" data-testid="resale-entry-unavailable">
		<p class="[ resale-entry-lead ] [ md-typescale-body-medium ]" t="newResaleEntry.unavailable"></p>
	</section>

	<section class="[ resale-entry-panel card ] [ flow wrapper ]" if.bind="step === 'not-found'" data-testid="resale-entry-not-found">
		<p class="[ resale-entry-lead ] [ md-typescale-body-medium ]" t="newResaleEntry.notFound"></p>
		<a href="/concerts/${event.id}" if.bind="event" class="text-link" data-variant="standalone" t="newResaleEntry.backToConcert"></a>
	</section>

	<section class="[ resale-entry-panel card ] [ flow wrapper ]" if.bind="step === 'error'" data-testid="resale-entry-error">
		<p class="[ resale-entry-lead ] [ md-typescale-body-medium ]" role="alert" t="newResaleEntry.error.load"></p>
		<button type="button" class="[ button resale-entry-action ] [ state-layer ]" click.trigger="load()" data-testid="resale-entry-retry" t="newResaleEntry.error.reload"></button>
	</section>

	<!-- What is applied for: the event, the seat type, its price and how resale works -->
	<section
		if.bind="event && stock && step !== 'loading' && step !== 'not-found' && step !== 'error' && step !== 'unavailable' && step !== 'done'"
		class="[ resale-entry-panel card ] [ flow wrapper ]"
		data-testid="resale-entry-summary"
	>
		<p class="[ resale-entry-step-title ] [ md-typescale-title-large-emphasized ]" t="newResaleEntry.officialResale"></p>
		<p class="[ resale-entry-lead ] [ md-typescale-body-medium ]" data-testid="resale-entry-event">${event.title}<br />${dateLabel} · ${event.venueName}</p>
		<p class="[ resale-entry-seat-type ] [ md-typescale-title-large-emphasized ]" data-testid="resale-entry-seat-type">${seatTypeName}</p>
		<p class="[ resale-entry-lead ] [ md-typescale-body-medium ]" data-testid="resale-entry-price" t="newResaleEntry.price" t-params.bind="{ price: yen(price) }"></p>
		<ul class="[ resale-entry-terms-list ] [ stack ]" data-testid="resale-entry-how">
			<li t="newResaleEntry.how.draws"></li>
			<li t="newResaleEntry.how.allOrNothing"></li>
			<li t="newResaleEntry.how.chargedOnWin"></li>
		</ul>
	</section>

	<section class="[ resale-entry-panel card ] [ flow wrapper ]" if.bind="step === 'closed'" data-testid="resale-entry-closed">
		<p class="[ resale-entry-lead ] [ md-typescale-body-medium ]" t="newResaleEntry.closed"></p>
		<a href="/concerts/${event.id}" if.bind="event" class="text-link" data-variant="standalone" t="newResaleEntry.backToConcert"></a>
	</section>

	<!-- The fan's entry already waits for a draw: no second application -->
	<section class="[ resale-entry-panel card ] [ flow wrapper ]" if.bind="step === 'applied'" data-testid="resale-entry-applied">
		<h2 class="[ resale-entry-step-title ] [ md-typescale-title-large-emphasized ]" t="newResaleEntry.applied.title"></h2>
		<p class="[ resale-entry-lead ] [ md-typescale-body-medium ]" data-testid="resale-entry-applied-count" t="newResaleEntry.applied.body" t-params.bind="{ count: entry.ticketCount }"></p>
		<p if.bind="nextDrawLabel" class="[ resale-entry-lead ] [ md-typescale-body-medium ]" data-testid="resale-entry-next-draw" t="newResaleEntry.nextDraw" t-params.bind="{ time: nextDrawLabel }"></p>
		<a href="/resale-entries" class="[ button resale-entry-action ] [ state-layer ]" data-testid="resale-entry-to-entries" t="newResaleEntry.toEntries"></a>
	</section>

	<!-- One seat type per account and event -->
	<section class="[ resale-entry-panel card ] [ flow wrapper ]" if.bind="step === 'other-seat-type'" data-testid="resale-entry-other-seat-type">
		<p class="[ resale-entry-lead ] [ md-typescale-body-medium ]" t="newResaleEntry.otherSeatType" t-params.bind="{ seatType: otherSeatTypeName }"></p>
		<a href="/concerts/${event.id}" if.bind="event" class="text-link" data-variant="standalone" t="newResaleEntry.backToConcert"></a>
	</section>

	<section class="[ resale-entry-panel card ] [ flow wrapper ]" if.bind="step === 'limit'" data-testid="resale-entry-limit">
		<p class="[ resale-entry-lead ] [ md-typescale-body-medium ]" t="newResaleEntry.count.limit" t-params.bind="{ limit: perAccountLimit }"></p>
		<a href="/concerts/${event.id}" if.bind="event" class="text-link" data-variant="standalone" t="newResaleEntry.backToConcert"></a>
	</section>

	<!-- Step 1: ticket count -->
	<section class="[ resale-entry-panel card ] [ flow wrapper ]" if.bind="step === 'count'" data-testid="resale-entry-count">
		<h2 class="[ resale-entry-step-title ] [ md-typescale-title-large-emphasized ]" t="newResaleEntry.count.title"></h2>
		<label class="[ resale-entry-field ] [ stack ]">
			<span class="[ resale-entry-label ] [ md-typescale-label-large ]" t="newResaleEntry.count.label" t-params.bind="{ max: countOptions.length }"></span>
			<select value.bind="ticketCount" class="[ text-field ] [ md-typescale-body-large ]" data-testid="resale-entry-count-select">
				<option repeat.for="n of countOptions" model.bind="n">${n}</option>
			</select>
		</label>
		<p class="[ resale-entry-total ] [ md-typescale-title-large-emphasized ]" data-testid="resale-entry-total" t="newResaleEntry.total" t-params.bind="{ total: yen(total) }"></p>
		<p class="[ resale-entry-error ] [ md-typescale-body-medium ]" if.bind="message" role="alert" data-testid="resale-entry-message" t.bind="message.key" t-params.bind="message.params"></p>
		<button type="button" class="[ button resale-entry-action ] [ state-layer ]" click.trigger="toPersonalDetails()" disabled.bind="busy" data-testid="resale-entry-to-personal-details" t="newResaleEntry.count.continue"></button>
	</section>

	<!-- Step 2: 本人確認 -->
	<section class="[ resale-entry-panel card ] [ flow wrapper ]" if.bind="step === 'personal-details'" data-testid="resale-entry-personal-details">
		<h2 class="[ resale-entry-step-title ] [ md-typescale-title-large-emphasized ]" t="newResaleEntry.personalDetails.title"></h2>
		<p class="[ resale-entry-lead ] [ md-typescale-body-medium ]" t="newResaleEntry.personalDetails.note"></p>
		<label class="[ resale-entry-field ] [ stack ]">
			<span class="[ resale-entry-label ] [ md-typescale-label-large ]" t="newResaleEntry.personalDetails.name"></span>
			<input type="text" autocomplete="name" value.bind="fullName" class="[ text-field ] [ md-typescale-body-large ]" data-testid="resale-entry-name" />
		</label>
		<label class="[ resale-entry-field ] [ stack ]">
			<span class="[ resale-entry-label ] [ md-typescale-label-large ]" t="newResaleEntry.personalDetails.phone"></span>
			<input
				type="tel"
				autocomplete="tel"
				inputmode="tel"
				value.bind="phoneNumber"
				aria-invalid.bind="isPhoneInvalid"
				aria-describedby.bind="isPhoneInvalid ? 'resale-entry-phone-error' : null"
				class="[ text-field ] [ md-typescale-body-large ]"
				data-testid="resale-entry-phone"
			/>
		</label>
		<p id="resale-entry-phone-error" class="[ resale-entry-error ] [ md-typescale-body-medium ]" if.bind="isPhoneInvalid" t="newResaleEntry.phoneInvalid"></p>
		<p class="[ resale-entry-error ] [ md-typescale-body-medium ]" if.bind="message" role="alert" data-testid="resale-entry-message" t.bind="message.key" t-params.bind="message.params"></p>
		<div class="[ resale-entry-actions ] [ cluster ]">
			<button type="button" class="[ button ] [ state-layer ]" data-variant="outlined" click.trigger="backToCount()" t="newResaleEntry.back"></button>
			<button type="button" class="[ button resale-entry-action ] [ state-layer ]" click.trigger="toPayment()" disabled.bind="!isPersonalDetailsValid || busy" data-testid="resale-entry-to-payment" t="newResaleEntry.personalDetails.continue"></button>
		</div>
	</section>

	<!-- Step 3: 特商法 final confirmation + card; applying authorizes the card -->
	<section class="[ resale-entry-panel card ] [ flow wrapper ]" if.bind="step === 'payment' || step === 'submitting'" data-testid="resale-entry-payment">
		<h2 class="[ resale-entry-step-title ] [ md-typescale-title-large-emphasized ]" t="newResaleEntry.confirm.title"></h2>
		<dl class="[ summary-list ] [ md-typescale-body-medium ]" data-variant="stacked" data-testid="resale-entry-confirm">
			<div>
				<dt class="md-typescale-body-medium-emphasized" t="newResaleEntry.confirm.tickets"></dt>
				<dd data-testid="resale-entry-confirm-what" t="newResaleEntry.confirm.ticketsWhat"></dd>
			</div>

			<div>
				<dt class="md-typescale-body-medium-emphasized" t="newResaleEntry.confirm.event"></dt>
				<dd data-testid="resale-entry-confirm-event">
					${event.title}<br />${dateLabel}<br />${event.venueName}
					<template if.bind="openTimeLabel || startTimeLabel">
						<br /><span if.bind="openTimeLabel"><span t="concert.open"></span> ${openTimeLabel}</span>
						<span if.bind="startTimeLabel"><span t="concert.start"></span> ${startTimeLabel}</span>
					</template>
				</dd>
			</div>

			<div>
				<dt class="md-typescale-body-medium-emphasized" t="newResaleEntry.confirm.amount"></dt>
				<dd data-testid="resale-entry-confirm-amount" t="newResaleEntry.confirm.amountValue" t-params.bind="{ seatType: seatTypeName, count: ticketCount, price: yen(price), total: yen(total) }"></dd>
			</div>

			<div>
				<dt class="md-typescale-body-medium-emphasized" t="newResaleEntry.confirm.payment"></dt>
				<dd data-testid="resale-entry-confirm-payment" t="newResaleEntry.confirm.paymentValue" t-params.bind="{ total: yen(total) }"></dd>
			</div>

			<div>
				<dt class="md-typescale-body-medium-emphasized" t="newResaleEntry.confirm.draws"></dt>
				<dd data-testid="resale-entry-confirm-draws" t="newResaleEntry.confirm.drawsValue" t-params.bind="{ deadline: deadlineLabel }"></dd>
			</div>

			<div>
				<dt class="md-typescale-body-medium-emphasized" t="newResaleEntry.confirm.allocation"></dt>
				<dd data-testid="resale-entry-confirm-allocation" t="newResaleEntry.confirm.allocationValue"></dd>
			</div>

			<div>
				<dt class="md-typescale-body-medium-emphasized" t="newResaleEntry.confirm.delivery"></dt>
				<dd data-testid="resale-entry-confirm-delivery" t="newResaleEntry.confirm.deliveryValue"></dd>
			</div>

			<div>
				<dt class="md-typescale-body-medium-emphasized" t="newResaleEntry.confirm.withdrawal"></dt>
				<dd data-testid="resale-entry-confirm-withdrawal" t="newResaleEntry.confirm.withdrawalValue"></dd>
			</div>

			<div>
				<dt class="md-typescale-body-medium-emphasized" t="newResaleEntry.confirm.cancellation"></dt>
				<dd data-testid="resale-entry-confirm-cancellation" t="newResaleEntry.confirm.cancellationValue"></dd>
			</div>

			<div>
				<dt class="md-typescale-body-medium-emphasized" t="newResaleEntry.confirm.resale"></dt>
				<dd data-testid="resale-entry-confirm-resale" t="newResaleEntry.confirm.resaleValue"></dd>
			</div>

			<div>
				<dt class="md-typescale-body-medium-emphasized" t="newResaleEntry.confirm.businessDetails"></dt>
				<dd data-testid="resale-entry-confirm-business-details">
					<template if.bind="businessDetails">
						${businessDetails.legalName}<br />
						<span t="newResaleEntry.confirm.representative"></span> ${businessDetails.representativeName}<br />
						${businessDetails.businessAddress}<br />
						${businessDetails.businessPhoneNumber}<br />
						${businessDetails.contactEmail}
					</template>
				</dd>
			</div>
		</dl>

		<div if.bind="!cardConfirmed" class="[ resale-entry-actions ] [ cluster ]">
			<button type="button" class="[ button ] [ state-layer ]" data-variant="outlined" click.trigger="backToCount()" disabled.bind="step === 'submitting'" data-testid="resale-entry-change-count" t="newResaleEntry.confirm.changeCount"></button>
			<button type="button" class="[ button ] [ state-layer ]" data-variant="outlined" click.trigger="backToPersonalDetails()" disabled.bind="step === 'submitting'" data-testid="resale-entry-change-personal-details" t="newResaleEntry.confirm.changePersonalDetails"></button>
		</div>

		<!-- Stripe Payment Element mounts here. -->
		<div class="resale-entry-payment-element" ref="paymentElementHost"></div>

		<p class="[ resale-entry-error ] [ md-typescale-body-medium ]" if.bind="cardError" role="alert" data-testid="resale-entry-card-error" t.bind="cardError"></p>
		<p class="[ resale-entry-error ] [ md-typescale-body-medium ]" if.bind="message" role="alert" data-testid="resale-entry-message" t.bind="message.key" t-params.bind="message.params"></p>
		<button
			type="button"
			class="[ button resale-entry-action ] [ state-layer ]"
			click.trigger="apply()"
			disabled.bind="step === 'submitting'"
			data-testid="resale-entry-apply"
			t.bind="step === 'submitting' ? 'newResaleEntry.confirm.submitting' : 'newResaleEntry.confirm.apply'"
			t-params.bind="{ total: yen(total) }"
		></button>
	</section>

	<!-- The application was refused: no entry, nothing charged -->
	<section class="[ resale-entry-panel card ] [ flow wrapper ]" if.bind="step === 'refused'" data-testid="resale-entry-refused">
		<h2 class="[ resale-entry-step-title ] [ md-typescale-title-large-emphasized ]" t="newResaleEntry.refused.title"></h2>
		<p class="[ resale-entry-lead ] [ md-typescale-body-medium ]" role="alert" data-testid="resale-entry-message" t.bind="message.key" t-params.bind="message.params"></p>
		<p class="[ resale-entry-lead ] [ md-typescale-body-medium ]" t="newResaleEntry.refused.notCharged"></p>
		<button type="button" class="[ button resale-entry-action ] [ state-layer ]" click.trigger="tryAgain()" data-testid="resale-entry-try-again" t="newResaleEntry.refused.tryAgain"></button>
		<a href="/concerts/${event.id}" if.bind="event" class="text-link" data-variant="standalone" t="newResaleEntry.backToConcert"></a>
	</section>

	<!-- The entry was made (Confirm succeeded) -->
	<section class="[ resale-entry-panel card ] [ flow wrapper ]" if.bind="step === 'done'" data-testid="resale-entry-done">
		<h2 class="[ resale-entry-step-title ] [ md-typescale-title-large-emphasized ]" t="newResaleEntry.done.title"></h2>
		<p class="[ resale-entry-lead ] [ md-typescale-body-medium ]" t="newResaleEntry.done.body" t-params.bind="{ seatType: seatTypeName, count: entry.ticketCount }"></p>
		<p if.bind="nextDrawLabel" class="[ resale-entry-lead ] [ md-typescale-body-medium ]" data-testid="resale-entry-next-draw" t="newResaleEntry.nextDraw" t-params.bind="{ time: nextDrawLabel }"></p>
		<a href="/resale-entries" class="[ button resale-entry-action ] [ state-layer ]" data-testid="resale-entry-to-entries" t="newResaleEntry.toEntries"></a>
	</section>
</template>
