<import from="./language-selector.css"></import>
<import from="./identity-verification.css"></import>
<import from="./personal-details.css"></import>
<import from="../../components/settings-list/settings-list.css"></import>

<!-- The page title ("Settings") is owned by the shell-hosted <page-header>,
     driven from the route's data.titleKey. -->

<main>
  <div class="[ settings-scroll ] [ stack ]" data-testid="settings-scroll">
  <!-- Guest sign-in / sign-up hero. Top-of-page, guest-only: the most
       important action for an unauthenticated user, lifted out of the
       bottom ACCOUNT list so it reads as a primary CTA rather than a link. -->
  <section if.bind="!auth.isAuthenticated" class="settings-guest-hero">
    <h2 t="settings.guestHero.heading" class="settings-guest-hero-heading"></h2>
    <p t="settings.guestHero.body" class="settings-guest-hero-body"></p>
    <div class="settings-guest-hero-actions">
      <button click.trigger="signIn()" t="settings.signIn" class="[ button ] [ pressable ]" data-testid="settings-sign-in"></button>
      <button click.trigger="signUp()" t="settings.signUp" class="[ button ] [ pressable ]" data-variant="outlined" data-testid="settings-sign-up"></button>
    </div>
    <!-- Sign-in help for a fan who can use none of their passkeys. -->
    <a href="/passkey-recovery" t="settings.guestHero.cantSignIn" class="settings-guest-hero-help" data-testid="settings-cant-sign-in"></a>
  </section>

  <!-- PREFERENCES Section.
       The card is a `role="list"` of settings; each row is wrapped in a
       `<li class="settings-list-item">` (display:contents) so the row stays a
       subgrid item spanning the card's `icon | content | control` columns while
       SR users hear a bounded "list, N items". Row separators are CSS borders,
       not `<hr>`s (which an `<ul>` may not contain and SR announces as noise). -->
  <section>
    <h2 t="settings.preferences" class="settings-section-title"></h2>
    <ul class="settings-card" role="list">
      <!-- My Home Area -->
      <li class="settings-list-item">
        <settings-link-row
          icon="map-pin"
          label.bind="'settings.myHomeArea' | t"
          value.bind="currentHomeKey | t"
          test-id="settings-first-row"
          action.bind="() => openHomeSelector()"
        ></settings-link-row>
      </li>

      <!-- Language -->
      <li class="settings-list-item">
        <settings-link-row
          icon="globe"
          label.bind="'settings.language' | t"
          value.bind="'languages.' + currentLocale | t"
          action.bind="() => openLanguageSelector()"
        ></settings-link-row>
      </li>

      <!-- Push Notifications (whole row is the switch). Without the VAPID key
           the row is unavailable and its description says why.
           Authenticated-only: a push subscription is persisted as a backend
           `push_subscriptions` row of the signed-in User, so before account creation
           (onboarding / guest) there is nothing to register and the toggle
           would no-op — hidden entirely, matching the ACCOUNT section below. -->
      <li if.bind="auth.isAuthenticated" class="settings-list-item">
        <settings-switch-row
          icon="bell"
          label.bind="'settings.pushNotifications' | t"
          description.bind="(vapidAvailable ? '' : 'settings.notAvailable') | t"
          description-id="push-na-hint"
          checked.bind="notificationsEnabled"
          unavailable.bind="!vapidAvailable"
          action.bind="() => toggleNotifications()"
        ></settings-switch-row>
      </li>

      <!-- Sound Effects (whole row is the switch) -->
      <li class="settings-list-item">
        <settings-switch-row
          icon="music"
          label.bind="'settings.soundEffects' | t"
          description.bind="(isIOS ? 'settings.soundEffectsHint' : '') | t"
          description-id="sound-ios-hint"
          checked.bind="soundEnabled"
          action.bind="() => toggleSound()"
        ></settings-switch-row>
      </li>

      <!-- Sound volume: a sub-row of Sound Effects, so no divider above it. -->
      <li if.bind="soundEnabled" class="[ settings-list-item ] [ settings-list-subitem ]">
        <div class="settings-row settings-volume-row">
          <label for="se-volume" t="settings.soundVolume" class="settings-row-label"></label>
          <input
            id="se-volume"
            type="range"
            min="0"
            max="100"
            step="5"
            value-as-number.bind="soundVolume"
            input.trigger="onSoundVolumeInput()"
            change.trigger="onSoundVolumePersist()"
            class="settings-volume-slider"
          >
        </div>
      </li>

      <!-- Left-handed mode: mirrors the FAB's action arc to open toward the left
           hand. Persisted via the storage adapter (fab-menu spec). -->
      <li class="settings-list-item">
        <settings-switch-row
          icon="swap"
          label.bind="'settings.leftHanded' | t"
          description.bind="'settings.leftHandedDesc' | t"
          description-id="left-handed-desc"
          checked.bind="fabMenu.isLeftHanded"
          action.bind="() => fabMenu.toggleHanded()"
        ></settings-switch-row>
      </li>
    </ul>
  </section>

  <!-- PRIVACY & ANALYTICS Section -->
  <section>
    <h2 t="settings.analytics.sectionTitle" class="settings-section-title"></h2>
    <ul class="settings-card" role="list">
      <!-- Analytics consent: the label opens its description; the switch is
           a separate control. -->
      <li class="settings-list-item">
        <settings-consent-row
          icon="info"
          label.bind="'settings.analytics.toggleLabel' | t"
          description.bind="'settings.analytics.toggleDescription' | t"
          checked.bind="consent.analytics"
          action.bind="() => handleAnalyticsToggle()"
        ></settings-consent-row>
      </li>

      <!-- Session-replay opt-out. Independent of Analytics: turning this off
           stops session recording only — catalogue events and the identified
           profile continue. Defaults ON. -->
      <li class="settings-list-item">
        <settings-consent-row
          icon="lock"
          label.bind="'settings.analytics.sessionReplayLabel' | t"
          description.bind="'settings.analytics.sessionReplayDescription' | t"
          checked.bind="consent.sessionReplay"
          action.bind="() => handleSessionReplayToggle()"
        ></settings-consent-row>
      </li>

      <!-- Privacy-policy link for both opt-out toggles. The policy names
           the analytics processor (PostHog / Klant Solutions B.V.) and the
           cross-border purpose; the toggles above are the always-available
           opt-out controls. Navigates in-app via the same openLegal handler
           as the ABOUT-section Privacy Policy row. -->
      <li class="settings-list-item">
        <settings-link-row
          icon="info"
          label.bind="'settings.analytics.privacyPolicyLink' | t"
          action.bind="() => openLegal('/legal/privacy')"
        ></settings-link-row>
      </li>
    </ul>
  </section>

  <!-- ABOUT Section. Iconless rows: the label still lands in the content
       column, so it lines up with the icon rows' labels above. -->
  <section>
    <h2 t="settings.about" class="settings-section-title"></h2>
    <ul class="settings-card" role="list">
      <!-- Terms of Service. Navigates via the VM's root router (openLegal), not
           a load/href attribute — see SettingsRoute.openLegal for why. -->
      <li class="settings-list-item">
        <settings-link-row label.bind="'settings.termsOfService' | t" action.bind="() => openLegal('/legal/terms')"></settings-link-row>
      </li>

      <!-- Privacy Policy -->
      <li class="settings-list-item">
        <settings-link-row label.bind="'settings.privacyPolicy' | t" action.bind="() => openLegal('/legal/privacy')"></settings-link-row>
      </li>

      <!-- OSS Licenses -->
      <li class="settings-list-item">
        <settings-link-row label.bind="'settings.ossLicenses' | t" action.bind="() => openLegal('/legal/licenses')"></settings-link-row>
      </li>

      <!-- App version. Read-only display; tapping copies the version string
           to the clipboard as a support affordance. -->
      <li class="settings-list-item">
        <settings-link-row
          label.bind="'settings.version' | t"
          value.bind="releaseVersion"
          chevron.bind="false"
          action.bind="() => copyVersion()"
        ></settings-link-row>
      </li>
    </ul>
  </section>

  <!-- NAME ON YOUR TICKETS Section. Authenticated-only: the full name and
       phone number saved on the User, shown on the face of the fan's tickets
       and prefilled at lottery entry and checkout. Saved with
       UserService.Update; the phone is typed in the domestic form and sent as
       E.164. `novalidate`: the VM validates on submit and shows the errors
       below each field, tied to it with aria-describedby. -->
  <section if.bind="auth.isAuthenticated" aria-labelledby="personal-details-title">
    <h2 id="personal-details-title" t="settings.personalDetails.title" class="settings-section-title"></h2>
    <form
      class="[ settings-personal-details ] [ stack ]"
      submit.trigger="savePersonalDetails()"
      novalidate
      data-testid="settings-personal-details"
    >
      <p id="personal-details-note" t="settings.personalDetails.note" class="settings-personal-details-note"></p>
      <label class="settings-field">
        <span t="settings.personalDetails.name" class="settings-field-label"></span>
        <input
          type="text"
          autocomplete="name"
          value.bind="fullName"
          aria-invalid.bind="nameInvalid"
          aria-describedby="personal-details-note settings-name-error"
          class="settings-field-input"
          data-testid="settings-full-name"
        />
      </label>
      <p id="settings-name-error" if.bind="nameInvalid" t="settings.personalDetails.nameRequired" class="settings-field-error"></p>
      <label class="settings-field">
        <span t="settings.personalDetails.phone" class="settings-field-label"></span>
        <input
          type="tel"
          inputmode="tel"
          autocomplete="tel-national"
          value.bind="phoneNumber"
          aria-invalid.bind="phoneInvalid"
          aria-describedby="personal-details-note settings-phone-error"
          class="settings-field-input"
          data-testid="settings-phone-number"
        />
      </label>
      <p id="settings-phone-error" if.bind="phoneInvalid" t="settings.personalDetails.phoneInvalid" class="settings-field-error"></p>
      <button
        type="submit"
        disabled.bind="!personalDetailsChanged"
        t="settings.personalDetails.save"
        class="[ button settings-personal-details-save ] [ pressable ]"
        data-testid="settings-personal-details-save"
      ></button>
    </form>
  </section>

  <!-- ACCOUNT Section. Authenticated-only: the guest sign-in / sign-up entry
       lives in the top hero, so this section is hidden entirely for guests. -->
  <section if.bind="auth.isAuthenticated">
    <h2 t="settings.account" class="settings-section-title"></h2>

    <ul class="settings-card" role="list">
      <!-- Email Verification. The badge is a polite live region associated
           with the address, and carries a status icon and text so the state is
           not told by color alone. -->
      <li class="settings-list-item">
        <settings-status-row
          icon="mail"
          label.bind="auth.user.profile.email"
          label-id="account-email"
          status-id="email-verification-status"
          verified.bind="emailVerified"
          verified-text.bind="'settings.emailVerified' | t"
          unverified-text.bind="'settings.emailNotVerified' | t"
          show-action.bind="!emailVerified"
          action-label.bind="(resendSuccess ? 'settings.resendSent' : 'settings.resendVerification') | t"
          action-disabled.bind="resendSuccess"
          action.bind="() => resendVerification()"
        ></settings-status-row>
      </li>

      <!-- 本人確認 (identity verification, identity-ekyc-jpki, PocketSign Stamp
           flow): whether the fan is verified (an Active IdentityVerification),
           plus method + dedupe strength when verified. "本人確認する" calls
           IdentityVerificationService.Start and redirects the browser to the
           PocketSign app; the fan returns via the /verify/callback route. It is
           hidden once the fan is verified, and when the card already verified
           another account (only support can help then). -->
      <li class="settings-list-item">
        <settings-status-row
          icon="shield-check"
          label.bind="'settings.identityVerification.label' | t"
          label-id="identity-verification-label"
          status-id="identity-verification-status"
          verified.bind="isVerified"
          verified-text.bind="'settings.identityVerification.verified' | t"
          unverified-text.bind="'settings.identityVerification.unverified' | t"
          show-action.bind="canStartIdentityVerification"
          action-label.bind="'settings.identityVerification.verifyCta' | t"
          action-described-by.bind="identityFailureKey ? 'identity-verification-failure' : ''"
          action.bind="() => startIdentityVerification()"
        >
          <!-- Why the last return from the PocketSign app did not verify the
               fan, kept next to the button until the fan starts again. -->
          <p
            if.bind="identityFailureKey"
            id="identity-verification-failure"
            class="settings-identity-verification-failure"
            data-testid="identity-verification-failure"
          >
            <span t.bind="identityFailureKey"></span>
            <span if.bind="identityFailureNeedsSupport">
              <span t="verifyCallback.error.contact"></span><a href="mailto:${supportEmail}">${supportEmail}</a>
            </span>
          </p>
          <!-- Method + dedupe strength, verified-only. -->
          <span if.bind="isVerified && verificationMethodKey" class="settings-identity-verification-detail">
            <span t="settings.identityVerification.methodPrefix"></span>
            <span t.bind="verificationMethodKey"></span>
            <span t.bind="dedupeStrengthKey" class="settings-identity-verification-dedupe"></span>
          </span>
        </settings-status-row>
      </li>

      <!-- Passkeys: opens passkey management, which requires a sign-in
           within the last 5 minutes (the hosted login asks again otherwise). -->
      <li class="settings-list-item">
        <settings-link-row
          icon="lock"
          label.bind="'settings.passkeys' | t"
          test-id="settings-passkeys"
          action.bind="() => openPasskeys()"
        ></settings-link-row>
      </li>

    </ul>
  </section>

  <!-- Sign Out stands in a group of its own below ACCOUNT, separated by the
       scroll stack's gap (--space-m, at least 24px), so a tap meant for an
       account row (Passkeys) never signs the fan out. -->
  <section if.bind="auth.isAuthenticated" aria-label.bind="'settings.signOut' | t" data-testid="settings-sign-out-group">
    <ul class="settings-card" role="list">
      <li class="settings-list-item">
        <button busy-on-click.bind="() => signOut()" class="settings-row settings-sign-out">
          <span t="settings.signOut" class="settings-sign-out-text"></span>
        </button>
      </li>
    </ul>
  </section>

  <!-- Delete account stands in a group of its own below Sign Out, separated
       by the same scroll stack gap (at least 24px), and opens the withdrawal
       screen, which asks again before anything is deleted. -->
  <section if.bind="auth.isAuthenticated" aria-label.bind="'settings.deleteAccount' | t" data-testid="settings-delete-account-group">
    <ul class="settings-card" role="list">
      <li class="settings-list-item">
        <settings-link-row
          icon="trash"
          label.bind="'settings.deleteAccount' | t"
          test-id="settings-delete-account"
          action.bind="() => openDeleteAccount()"
        ></settings-link-row>
      </li>
    </ul>
  </section>
  </div>
</main>

<!-- Home Area Selector Bottom Sheet -->
<user-home-selector
  component.ref="homeSelector"
  current-code.bind="userStore.currentHome"
  on-home-selected.bind="(code) => onHomeSelected(code)"
></user-home-selector>

<!-- Language Selector Bottom Sheet. Single-select: a radiogroup whose options
     expose `aria-checked` so SR users perceive the active language and that
     exactly one may be chosen (the check icon + data-selected are visual only). -->
<bottom-sheet open.bind="languageSelectorOpen" sheet-closed.trigger="languageSelectorOpen = false" aria-label="Select language">
  <div class="selector-content">
    <h2 id="language-selector-title" t="settings.language" class="selector-title"></h2>
    <div class="[ language-list ] [ stack ]" role="radiogroup" aria-labelledby="language-selector-title">
      <button
        repeat.for="lang of supportedLanguages"
        busy-on-click.bind="() => selectLanguage(lang)"
        role="radio"
        aria-checked.bind="currentLocale === lang"
        class="language-option"
        data-selected.bind="currentLocale === lang"
      >
        <span t.bind="'languages.' + lang"></span>
        <svg-icon if.bind="currentLocale === lang" name="check" class="language-check"></svg-icon>
      </button>
    </div>
  </div>
</bottom-sheet>
