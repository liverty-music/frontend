<import from="./language-selector.css"></import>
<import from="./identity-verification.css"></import>
<import from="./personal-details.css"></import>

<!-- The page title ("Settings") is owned by the shell-hosted <page-header>,
     driven from the route's data.titleKey. -->

<main>
  <div class="[ settings-scroll ] [ stack ]" data-testid="settings-scroll">
  <!-- Guest sign-in / sign-up hero. Top-of-page, guest-only: the most
       important action for an unauthenticated user, lifted out of the
       bottom ACCOUNT list so it reads as a primary CTA rather than a link. -->
  <section if.bind="!auth.isAuthenticated" class="settings-guest-hero">
    <h2 t="settings.guestHero.heading" class="settings-guest-hero-heading"></h2>
    <p t="settings.guestHero.body" class="settings-guest-hero-body"></p>
    <div class="settings-guest-hero-actions">
      <button click.trigger="signIn()" t="settings.signIn" class="[ button ] [ pressable ]" data-testid="settings-sign-in"></button>
      <button click.trigger="signUp()" t="settings.signUp" class="[ button ] [ pressable ]" data-variant="outlined" data-testid="settings-sign-up"></button>
    </div>
  </section>

  <!-- PREFERENCES Section.
       The card is a `role="list"` of settings; each row is wrapped in a
       `<li class="settings-list-item">` (display:contents) so the row stays a
       subgrid item spanning the card's `icon | content | control` columns while
       SR users hear a bounded "list, N items". Row separators are CSS borders,
       not `<hr>`s (which an `<ul>` may not contain and SR announces as noise). -->
  <section>
    <h2 t="settings.preferences" class="settings-section-title"></h2>
    <ul class="settings-card" role="list">
      <!-- My Home Area -->
      <li class="settings-list-item">
        <button click.trigger="openHomeSelector()" class="settings-row" data-testid="settings-first-row">
          <svg-icon name="map-pin" class="settings-icon"></svg-icon>
          <span t="settings.myHomeArea" class="settings-row-label"></span>
          <div class="settings-row-end">
            <span class="settings-row-value" t.bind="currentHomeKey"></span>
            <svg-icon name="chevron-right" class="settings-chevron"></svg-icon>
          </div>
        </button>
      </li>

      <!-- Language -->
      <li class="settings-list-item">
        <button click.trigger="openLanguageSelector()" class="settings-row">
          <svg-icon name="globe" class="settings-icon"></svg-icon>
          <span t="settings.language" class="settings-row-label"></span>
          <div class="settings-row-end">
            <span class="settings-row-value" t.bind="'languages.' + currentLocale"></span>
            <svg-icon name="chevron-right" class="settings-chevron"></svg-icon>
          </div>
        </button>
      </li>

      <!-- Push Notifications (whole row is the switch). When the VAPID key is
           absent the row uses `aria-disabled` (not native `disabled`, which
           removes it from AT discovery) and the explanatory hint is associated
           via `aria-describedby`.
           Authenticated-only: a push subscription is persisted as a backend
           `push_subscriptions` row of the signed-in User, so before account creation
           (onboarding / guest) there is nothing to register and the toggle
           would no-op — hidden entirely, matching the ACCOUNT section below. -->
      <li if.bind="auth.isAuthenticated" class="settings-list-item">
        <button
          busy-on-click.bind="() => toggleNotifications()"
          role="switch"
          aria-checked.bind="notificationsEnabled"
          aria-disabled.bind="!vapidAvailable"
          aria-describedby="push-na-hint"
          class="[ settings-row ] [ settings-row-toggle ]"
          data-disabled.bind="!vapidAvailable"
        >
          <svg-icon name="bell" class="settings-icon"></svg-icon>
          <div class="settings-toggle-col">
            <span t="settings.pushNotifications" class="settings-row-label"></span>
            <span id="push-na-hint" if.bind="!vapidAvailable" t="settings.notAvailable" class="settings-toggle-desc"></span>
          </div>
          <div class="settings-toggle-track" data-on.bind="notificationsEnabled">
            <div class="settings-toggle-thumb" data-on.bind="notificationsEnabled"></div>
          </div>
        </button>
      </li>

      <!-- Sound Effects (whole row is the switch) -->
      <li class="settings-list-item">
        <button
          click.trigger="toggleSound()"
          role="switch"
          aria-checked.bind="soundEnabled"
          aria-describedby="sound-ios-hint"
          class="[ settings-row ] [ settings-row-toggle ]"
        >
          <svg-icon name="music" class="settings-icon"></svg-icon>
          <div class="settings-toggle-col">
            <span t="settings.soundEffects" class="settings-row-label"></span>
            <span id="sound-ios-hint" if.bind="isIOS" t="settings.soundEffectsHint" class="settings-toggle-desc"></span>
          </div>
          <div class="settings-toggle-track" data-on.bind="soundEnabled">
            <div class="settings-toggle-thumb" data-on.bind="soundEnabled"></div>
          </div>
        </button>
      </li>

      <!-- Sound volume: a sub-row of Sound Effects, so no divider above it. -->
      <li if.bind="soundEnabled" class="[ settings-list-item ] [ settings-list-subitem ]">
        <div class="settings-row settings-volume-row">
          <label for="se-volume" t="settings.soundVolume" class="settings-row-label"></label>
          <input
            id="se-volume"
            type="range"
            min="0"
            max="100"
            step="5"
            value-as-number.bind="soundVolume"
            input.trigger="onSoundVolumeInput()"
            change.trigger="onSoundVolumePersist()"
            class="settings-volume-slider"
          >
        </div>
      </li>

      <!-- Left-handed mode: mirrors the FAB's action arc to open toward the left
           hand. Persisted via the storage adapter (fab-menu spec). -->
      <li class="settings-list-item">
        <button
          click.trigger="fabMenu.toggleHanded()"
          role="switch"
          aria-checked.bind="fabMenu.isLeftHanded"
          class="[ settings-row ] [ settings-row-toggle ]"
        >
          <svg-icon name="swap" class="settings-icon"></svg-icon>
          <div class="settings-toggle-col">
            <span t="settings.leftHanded" class="settings-row-label"></span>
            <span t="settings.leftHandedDesc" class="settings-toggle-desc"></span>
          </div>
          <div class="settings-toggle-track" data-on.bind="fabMenu.isLeftHanded">
            <div class="settings-toggle-thumb" data-on.bind="fabMenu.isLeftHanded"></div>
          </div>
        </button>
      </li>
    </ul>
  </section>

  <!-- PRIVACY & ANALYTICS Section -->
  <section>
    <h2 t="settings.analytics.sectionTitle" class="settings-section-title"></h2>
    <ul class="settings-card" role="list">
      <!-- Analytics consent. Icon (col1), disclosure (col2), switch (col3) are
           siblings — a role="switch" must never contain another interactive
           control, and keeping the icon a direct row child aligns it with the
           other rows' icons. -->
      <li class="settings-list-item">
        <div class="[ settings-row ] [ settings-row-toggle ]">
          <svg-icon name="info" class="settings-icon"></svg-icon>
          <button
            click.trigger="toggleAnalyticsDesc()"
            aria-expanded.bind="analyticsDescExpanded"
            class="settings-expand"
          >
            <span class="settings-expand-head">
              <span t="settings.analytics.toggleLabel" class="settings-row-label"></span>
              <svg-icon name="chevron-right" class="settings-expand-caret" data-expanded.bind="analyticsDescExpanded"></svg-icon>
            </span>
            <span
              if.bind="analyticsDescExpanded"
              t="settings.analytics.toggleDescription"
              class="settings-toggle-desc"
            ></span>
          </button>
          <button
            click.trigger="handleAnalyticsToggle()"
            role="switch"
            aria-checked.bind="consent.analytics"
            class="settings-switch"
          >
            <div class="settings-toggle-track" data-on.bind="consent.analytics">
              <div class="settings-toggle-thumb" data-on.bind="consent.analytics"></div>
            </div>
          </button>
        </div>
      </li>

      <!-- Session-replay opt-out. Independent of Analytics: turning this off
           stops session recording only — catalogue events and the identified
           profile continue. Defaults ON. -->
      <li class="settings-list-item">
        <div class="[ settings-row ] [ settings-row-toggle ]">
          <svg-icon name="lock" class="settings-icon"></svg-icon>
          <button
            click.trigger="toggleSessionReplayDesc()"
            aria-expanded.bind="sessionReplayDescExpanded"
            class="settings-expand"
          >
            <span class="settings-expand-head">
              <span t="settings.analytics.sessionReplayLabel" class="settings-row-label"></span>
              <svg-icon name="chevron-right" class="settings-expand-caret" data-expanded.bind="sessionReplayDescExpanded"></svg-icon>
            </span>
            <span
              if.bind="sessionReplayDescExpanded"
              t="settings.analytics.sessionReplayDescription"
              class="settings-toggle-desc"
            ></span>
          </button>
          <button
            click.trigger="handleSessionReplayToggle()"
            role="switch"
            aria-checked.bind="consent.sessionReplay"
            class="settings-switch"
          >
            <div class="settings-toggle-track" data-on.bind="consent.sessionReplay">
              <div class="settings-toggle-thumb" data-on.bind="consent.sessionReplay"></div>
            </div>
          </button>
        </div>
      </li>

      <!-- Privacy-policy link for both opt-out toggles. The policy names
           the analytics processor (PostHog / Klant Solutions B.V.) and the
           cross-border purpose; the toggles above are the always-available
           opt-out controls. Navigates in-app via the same openLegal handler
           as the ABOUT-section Privacy Policy row, so there is a single
           consistent in-app navigation path to /legal/privacy. -->
      <li class="settings-list-item">
        <button type="button" click.trigger="openLegal('/legal/privacy')" class="settings-row">
          <svg-icon name="info" class="settings-icon"></svg-icon>
          <span t="settings.analytics.privacyPolicyLink" class="settings-row-label"></span>
          <svg-icon name="chevron-right" class="settings-chevron"></svg-icon>
        </button>
      </li>
    </ul>
  </section>

  <!-- ABOUT Section. Iconless rows: the label still lands in the content
       column, so it lines up with the icon rows' labels above. -->
  <section>
    <h2 t="settings.about" class="settings-section-title"></h2>
    <ul class="settings-card" role="list">
      <!-- Terms of Service. Navigates via the VM's root router (openLegal), not
           a load/href attribute — see SettingsRoute.openLegal for why. -->
      <li class="settings-list-item">
        <button type="button" click.trigger="openLegal('/legal/terms')" class="settings-row">
          <span t="settings.termsOfService" class="settings-row-label"></span>
          <svg-icon name="chevron-right" class="settings-chevron"></svg-icon>
        </button>
      </li>

      <!-- Privacy Policy -->
      <li class="settings-list-item">
        <button type="button" click.trigger="openLegal('/legal/privacy')" class="settings-row">
          <span t="settings.privacyPolicy" class="settings-row-label"></span>
          <svg-icon name="chevron-right" class="settings-chevron"></svg-icon>
        </button>
      </li>

      <!-- OSS Licenses -->
      <li class="settings-list-item">
        <button type="button" click.trigger="openLegal('/legal/licenses')" class="settings-row">
          <span t="settings.ossLicenses" class="settings-row-label"></span>
          <svg-icon name="chevron-right" class="settings-chevron"></svg-icon>
        </button>
      </li>

      <!-- App version. Read-only display; tapping copies the version string
           to the clipboard as a support affordance. -->
      <li class="settings-list-item">
        <button
          type="button"
          click.trigger="copyVersion()"
          class="settings-row"
        >
          <span t="settings.version" class="settings-row-label"></span>
          <span class="settings-row-value">${releaseVersion}</span>
        </button>
      </li>
    </ul>
  </section>

  <!-- NAME ON YOUR TICKETS Section. Authenticated-only: the full name and
       phone number saved on the User, shown on the face of the fan's tickets
       and prefilled at lottery entry and checkout. Saved with
       UserService.Update; the phone is typed in the domestic form and sent as
       E.164. `novalidate`: the VM validates on submit and shows the errors
       below each field, tied to it with aria-describedby. -->
  <section if.bind="auth.isAuthenticated" aria-labelledby="personal-details-title">
    <h2 id="personal-details-title" t="settings.personalDetails.title" class="settings-section-title"></h2>
    <form
      class="[ settings-personal-details ] [ stack ]"
      submit.trigger="savePersonalDetails()"
      novalidate
      data-testid="settings-personal-details"
    >
      <p id="personal-details-note" t="settings.personalDetails.note" class="settings-personal-details-note"></p>
      <label class="settings-field">
        <span t="settings.personalDetails.name" class="settings-field-label"></span>
        <input
          type="text"
          autocomplete="name"
          value.bind="fullName"
          aria-invalid.bind="nameInvalid"
          aria-describedby="personal-details-note settings-name-error"
          class="settings-field-input"
          data-testid="settings-full-name"
        />
      </label>
      <p id="settings-name-error" if.bind="nameInvalid" t="settings.personalDetails.nameRequired" class="settings-field-error"></p>
      <label class="settings-field">
        <span t="settings.personalDetails.phone" class="settings-field-label"></span>
        <input
          type="tel"
          inputmode="tel"
          autocomplete="tel-national"
          value.bind="phoneNumber"
          aria-invalid.bind="phoneInvalid"
          aria-describedby="personal-details-note settings-phone-error"
          class="settings-field-input"
          data-testid="settings-phone-number"
        />
      </label>
      <p id="settings-phone-error" if.bind="phoneInvalid" t="settings.personalDetails.phoneInvalid" class="settings-field-error"></p>
      <button
        type="submit"
        disabled.bind="!personalDetailsChanged"
        t="settings.personalDetails.save"
        class="[ button settings-personal-details-save ] [ pressable ]"
        data-testid="settings-personal-details-save"
      ></button>
    </form>
  </section>

  <!-- ACCOUNT Section. Authenticated-only: the guest sign-in / sign-up entry
       lives in the top hero, so this section is hidden entirely for guests. -->
  <section if.bind="auth.isAuthenticated">
    <h2 t="settings.account" class="settings-section-title"></h2>

    <ul class="settings-card" role="list">
      <!-- Email Verification. The badge is a polite live region (`<output>`)
           associated with the email via `aria-describedby`, and carries a
           non-color status icon so verification state is not conveyed by colour
           alone. -->
      <li class="settings-list-item">
        <div class="settings-row">
          <svg-icon name="mail" class="settings-icon"></svg-icon>
          <div class="settings-account">
            <span id="account-email" class="settings-row-label" aria-describedby="email-verification-status">${auth.user.profile.email}</span>
            <output
              id="email-verification-status"
              class="settings-verification-badge"
              aria-live="polite"
              data-verified.bind="emailVerified"
            >
              <svg-icon if.bind="emailVerified" name="check" class="settings-verification-icon"></svg-icon>
              <svg-icon if.bind="!emailVerified" name="alert-triangle" class="settings-verification-icon"></svg-icon>
              <span if.bind="emailVerified" t="settings.emailVerified"></span>
              <span if.bind="!emailVerified" t="settings.emailNotVerified"></span>
            </output>
          </div>
          <button
            if.bind="!emailVerified"
            busy-on-click.bind="() => resendVerification()"
            disabled.bind="resendSuccess"
            aria-live="polite"
            class="[ button settings-row-action ] [ pressable ]"
            data-variant="outlined"
          >
            <span if.bind="resendSuccess" t="settings.resendSent"></span>
            <span if.bind="!resendSuccess" t="settings.resendVerification"></span>
          </button>
        </div>
      </li>

      <!-- 本人確認 (identity verification, identity-ekyc-jpki, PocketSign Stamp
           flow). Shows whether the fan is verified (an Active
           IdentityVerification), plus method + dedupe strength when verified.
           The status badge is a polite live region (<output>) carrying a
           non-colour status icon so state is not conveyed by colour alone.
           Tapping "本人確認する" calls IdentityVerificationService.Start and
           redirects the browser to the PocketSign app; the fan returns via the
           /verify/callback route. -->
      <li class="settings-list-item">
        <div class="[ settings-row ] [ settings-row-toggle ]">
          <svg-icon name="shield-check" class="settings-icon"></svg-icon>
          <div class="[ settings-identity-verification ] [ stack ]">
            <span id="identity-verification-label" t="settings.identityVerification.label" class="settings-row-label"></span>
            <output
              id="identity-verification-status"
              class="settings-verification-badge"
              aria-live="polite"
              aria-describedby="identity-verification-label"
              data-verified.bind="isVerified"
            >
              <svg-icon if.bind="isVerified" name="check" class="settings-verification-icon"></svg-icon>
              <svg-icon if.bind="!isVerified" name="alert-triangle" class="settings-verification-icon"></svg-icon>
              <span if.bind="isVerified" t="settings.identityVerification.verified"></span>
              <span if.bind="!isVerified" t="settings.identityVerification.unverified"></span>
            </output>
            <!-- Method + dedupe strength, verified-only. -->
            <span if.bind="isVerified && verificationMethodKey" class="settings-identity-verification-detail">
              <span t="settings.identityVerification.methodPrefix"></span>
              <span t.bind="verificationMethodKey"></span>
              <span t.bind="dedupeStrengthKey" class="settings-identity-verification-dedupe"></span>
            </span>
          </div>
          <!-- "本人確認する" button: redirects to PocketSign Stamp.
               Hidden once the fan is verified. -->
          <button
            if.bind="!isVerified"
            busy-on-click.bind="() => startIdentityVerification()"
            class="[ button settings-row-action ] [ pressable ]"
            data-variant="outlined"
          >
            <span t="settings.identityVerification.verifyCta"></span>
          </button>
        </div>
      </li>

      <li class="settings-list-item">
        <button busy-on-click.bind="() => signOut()" class="settings-row settings-sign-out">
          <span t="settings.signOut" class="settings-sign-out-text"></span>
        </button>
      </li>
    </ul>
  </section>
  </div>
</main>

<!-- Home Area Selector Bottom Sheet -->
<user-home-selector
  component.ref="homeSelector"
  current-code.bind="userStore.currentHome"
  on-home-selected.bind="(code) => onHomeSelected(code)"
></user-home-selector>

<!-- Language Selector Bottom Sheet. Single-select: a radiogroup whose options
     expose `aria-checked` so SR users perceive the active language and that
     exactly one may be chosen (the check icon + data-selected are visual only). -->
<bottom-sheet open.bind="languageSelectorOpen" sheet-closed.trigger="languageSelectorOpen = false" aria-label="Select language">
  <div class="selector-content">
    <h2 id="language-selector-title" t="settings.language" class="selector-title"></h2>
    <div class="[ language-list ] [ stack ]" role="radiogroup" aria-labelledby="language-selector-title">
      <button
        repeat.for="lang of supportedLanguages"
        busy-on-click.bind="() => selectLanguage(lang)"
        role="radio"
        aria-checked.bind="currentLocale === lang"
        class="language-option"
        data-selected.bind="currentLocale === lang"
      >
        <span t.bind="'languages.' + lang"></span>
        <svg-icon if.bind="currentLocale === lang" name="check" class="language-check"></svg-icon>
      </button>
    </div>
  </div>
</bottom-sheet>
