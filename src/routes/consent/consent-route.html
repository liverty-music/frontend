<import from="./consent-route.css"></import>

<main class="[ consent-route ] [ flow ]">
  <header class="consent-header">
    <h1 t="onboarding.consent.title" class="[ consent-title ] [ md-typescale-headline-small ]"></h1>
    <p t="onboarding.consent.intro" class="[ consent-paragraph ] [ md-typescale-body-medium ]"></p>
  </header>

  <section class="[ consent-card ] [ flow ]">
    <div class="consent-row">
      <div class="consent-row-text">
        <div class="consent-row-label-line">
          <svg-icon name="globe" class="consent-row-icon"></svg-icon>
          <span t="onboarding.consent.processor.label" class="[ consent-row-label ] [ md-typescale-body-large ]"></span>
        </div>
        <span t="onboarding.consent.processor.description" class="[ consent-row-description ] [ md-typescale-body-medium ]"></span>
      </div>
    </div>

    <hr class="[ consent-divider ]">

    <div class="consent-row">
      <div class="consent-row-text">
        <div class="consent-row-label-line">
          <svg-icon name="info" class="consent-row-icon"></svg-icon>
          <span t="onboarding.consent.optOut.label" class="[ consent-row-label ] [ md-typescale-body-large ]"></span>
        </div>
        <span t="onboarding.consent.optOut.description" class="[ consent-row-description ] [ md-typescale-body-medium ]"></span>
      </div>
    </div>
  </section>

  <p class="[ consent-policy-line ] [ md-typescale-body-medium ]">
    <button
      type="button"
      click.trigger="openPrivacyPolicy()"
      t="settings.privacyPolicy"
      class="consent-policy-link"
    ></button>
  </p>

  <footer class="[ consent-actions ] [ wrapper ]">
    <button
      busy-on-click.bind="() => acknowledge()"
      class="[ button ] [ pressable ]"
      data-testid="consent-acknowledge"
      t="onboarding.consent.actions.acknowledge"
    ></button>
    <button
      busy-on-click.bind="() => openSettings()"
      class="[ button ] [ pressable ]"
      data-variant="outlined"
      t="onboarding.consent.actions.manage"
    ></button>
  </footer>
</main>
