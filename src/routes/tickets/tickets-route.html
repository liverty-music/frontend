<template class="[ tickets-route ] [ flow ]">
	<header class="tickets-header">
		<h1 class="[ tickets-title ] [ md-typescale-headline-small ]" t="tickets.title"></h1>
	</header>

	<!-- Saved list shown without a connection -->
	<output class="[ tickets-notice card ] [ wrapper ] [ md-typescale-body-medium ]" if.bind="offline && step === 'loaded'">
		<span t="tickets.offline" t-params.bind="{ time: savedAtLabel() }"></span>
	</output>

	<!-- Device preparation messages -->
	<output
		class="[ tickets-notice card ] [ wrapper ] [ md-typescale-body-medium ]"
		data-tone="warning"
		if.bind="device === 'needs-connection' && step === 'loaded'"
		t="tickets.device.needsConnection"
	></output>
	<output
		class="[ tickets-notice card ] [ wrapper ] [ md-typescale-body-medium ]"
		data-tone="warning"
		if.bind="device === 'failed' && step === 'loaded'"
		t="tickets.device.failed"
	></output>
	<output
		class="[ tickets-notice card ] [ wrapper ] [ md-typescale-body-medium ]"
		if.bind="movedToThisDevice"
		t="tickets.device.movedHere"
	></output>

	<!-- The entry QR code is set to another device: offer to move it here -->
	<section
		class="[ tickets-notice card ] [ flow wrapper ] [ md-typescale-body-medium ]"
		data-tone="warning"
		if.bind="device === 'other-device' && step === 'loaded'"
		aria-labelledby="tickets-other-device"
	>
		<p id="tickets-other-device" t="tickets.device.otherDevice"></p>
		<button
			type="button"
			class="[ button tickets-action ] [ pressable ]"
			data-variant="outlined"
			if.bind="canOfferMove && !confirmingMove"
			click.trigger="askToUseThisDevice()"
			t="tickets.device.useThisDevice"
		></button>
		<template if.bind="canOfferMove && confirmingMove">
			<p t="tickets.device.confirmMove"></p>
			<output class="[ tickets-error ] [ md-typescale-body-medium ]" if.bind="moveFailed" t="tickets.device.moveFailed"></output>
			<div class="cluster">
				<button
					type="button"
					class="[ button tickets-action ] [ pressable ]"
					disabled.bind="moving"
					click.trigger="confirmUseThisDevice()"
					t="tickets.device.confirm"
				></button>
				<button
					type="button"
					class="[ button tickets-action ] [ pressable ]"
					data-variant="outlined"
					disabled.bind="moving"
					click.trigger="cancelMove()"
					t="tickets.device.cancel"
				></button>
			</div>
		</template>
	</section>

	<!-- Loading -->
	<section class="[ tickets-panel card ] [ wrapper ]" if.bind="step === 'loading'">
		<p class="[ tickets-lead ] [ md-typescale-body-medium ]" t="tickets.loading"></p>
	</section>

	<!-- Empty: no issued tickets yet -->
	<section class="[ tickets-panel card ] [ flow wrapper ]" if.bind="step === 'empty'">
		<h2 class="[ tickets-step-title ] [ md-typescale-title-large-emphasized ]" t="tickets.empty.title"></h2>
		<p class="[ tickets-lead ] [ md-typescale-body-medium ]" t="tickets.empty.subtitle"></p>
	</section>

	<!-- Error -->
	<section class="[ tickets-panel card ] [ flow wrapper ]" if.bind="step === 'error'">
		<h2 class="[ tickets-step-title ] [ md-typescale-title-large-emphasized ]" t="tickets.error.title"></h2>
		<p class="[ tickets-error ] [ md-typescale-body-medium ]" t="tickets.error.message"></p>
		<button
			type="button"
			class="[ button tickets-action ] [ pressable ]"
			click.trigger="load()"
			t="tickets.error.retry"
		></button>
	</section>

	<!-- Loaded: tickets grouped by event, nearest first -->
	<div class="[ tickets-list ] [ flow wrapper ]" if.bind="step === 'loaded'">
		<section
			class="[ tickets-event card ] [ flow ]"
			repeat.for="group of groups"
			aria-labelledby.bind="'tickets-event-' + group.eventId"
		>
			<header class="[ tickets-event-head ] [ flow ]">
				<h2 class="[ tickets-event-title ] [ md-typescale-title-large-emphasized ]" id.bind="'tickets-event-' + group.eventId">
					<template if.bind="group.event">${group.event.title}</template>
					<template else><span t="tickets.event.unknown"></span></template>
				</h2>
				<dl class="summary-list" if.bind="group.event">
					<div>
						<dt class="md-typescale-label-large" t="tickets.event.date"></dt>
						<dd class="md-typescale-body-large">${eventDate(group)}</dd>
					</div>
					<div>
						<dt class="md-typescale-label-large" t="tickets.event.venue"></dt>
						<dd class="md-typescale-body-large">${group.event.venueName}</dd>
					</div>
					<div if.bind="group.event.openTime">
						<dt class="md-typescale-label-large" t="tickets.event.open"></dt>
						<dd class="md-typescale-body-large">${time(group.event.openTime)}</dd>
					</div>
					<div if.bind="group.event.startTime">
						<dt class="md-typescale-label-large" t="tickets.event.start"></dt>
						<dd class="md-typescale-body-large">${time(group.event.startTime)}</dd>
					</div>
				</dl>
			</header>

			<ul class="[ tickets-cards ] [ flow ]" role="list">
				<li
					class="[ tickets-card ] [ flow ]"
					repeat.for="ticket of group.tickets"
					data-state.bind="shownState(ticket, listings)"
				>
					<div class="[ tickets-card-head ] [ cluster ]">
						<span class="[ tickets-number ] [ md-typescale-label-large ]" t="tickets.ticketN" t-params.bind="{ n: ticketNumber(group, ticket) }"></span>
						<span class="[ status-label ] [ md-typescale-label-large ]" data-tone.bind="stateTone(ticket, listings)" data-testid="tickets-state">
							${stateLabel(ticket, listings)}
						</span>
						<span class="[ tickets-admitted ] [ md-typescale-body-medium ]" if.bind="ticket.state === 'entered'">
							${admitted(ticket)}
						</span>
					</div>

					<!-- 特定興行入場券 face: seat type, eligible person's name and phone, no seat, resale notice -->
					<dl class="summary-list">
						<div if.bind="ticket.seatTypeName">
							<dt class="md-typescale-label-large" t="tickets.field.seatType"></dt>
							<dd class="md-typescale-body-large" data-testid="tickets-seat-type">${ticket.seatTypeName}</dd>
						</div>
						<div>
							<dt class="md-typescale-label-large" t="tickets.field.fullName"></dt>
							<dd class="md-typescale-body-large" data-testid="tickets-full-name">${personalDetails.fullName}</dd>
						</div>
						<div>
							<dt class="md-typescale-label-large" t="tickets.field.phoneNumber"></dt>
							<dd class="md-typescale-body-large" data-testid="tickets-phone-number">${phoneNumberDisplay}</dd>
						</div>
						<div>
							<dt class="md-typescale-label-large" t="tickets.field.seat"></dt>
							<dd class="md-typescale-body-large" t="tickets.field.noSeat"></dd>
						</div>
					</dl>
					<p
						class="[ tickets-resale-notice ] [ md-typescale-body-small ]"
						if.bind="ticket.resaleWithoutConsentProhibited"
						t="tickets.resaleProhibited"
					></p>

					<!-- Official resale (公式リセール) of this ticket -->
					<template switch.bind="shownState(ticket, listings)">
						<template case="listed">
							<p class="[ tickets-lead ] [ md-typescale-body-medium ]" t="tickets.resale.listedNote" t-params.bind="{ deadline: listingDeadlineLabel(group) }"></p>
							<button
								type="button"
								class="[ button tickets-action ] [ pressable ]"
								data-variant="outlined"
								data-testid="tickets-withdraw"
								if.bind="!offline"
								disabled.bind="resaleBusy"
								click.trigger="withdraw(ticket)"
								t="tickets.resale.withdraw"
							></button>
						</template>
						<template case="resold">
							<dl class="summary-list" data-testid="tickets-resold">
								<div>
									<dt class="md-typescale-label-large" t="tickets.resale.refundAmount"></dt>
									<dd class="md-typescale-body-large" t="tickets.resale.yen" t-params.bind="{ amount: yen(listingOf(ticket, listings).refundAmount) }"></dd>
								</div>
								<div>
									<dt class="md-typescale-label-large" t="tickets.resale.refund"></dt>
									<dd class="md-typescale-body-large" if.bind="listingOf(ticket, listings).refundTime" t="tickets.resale.refunded" t-params.bind="{ date: day(listingOf(ticket, listings).refundTime) }"></dd>
									<dd class="md-typescale-body-large" else t="tickets.resale.refunding"></dd>
								</div>
							</dl>
						</template>
					</template>
					<button
						type="button"
						class="[ button tickets-action ] [ pressable ]"
						data-variant="outlined"
						data-testid="tickets-list-for-resale"
						if.bind="offersListing(ticket, listings, resaleByStock, offline)"
						click.trigger="askToList(group, ticket)"
						t="tickets.resale.list"
					></button>
					<output class="[ tickets-error ] [ md-typescale-body-medium ]" if.bind="resaleMessageFor(ticket, resaleMessage)" t.bind="resaleMessageFor(ticket, resaleMessage)"></output>

					<a
						class="[ text-link ] [ md-typescale-label-large ]"
						data-variant="standalone"
						href.bind="'/orders/' + ticket.orderId"
						if.bind="ticket.orderId && !offline"
						t="tickets.viewOrder"
					></a>
				</li>
			</ul>

			<p class="[ tickets-lead ] [ md-typescale-body-medium ]" if.bind="explainsNoResale(group, listings, resaleByStock, offline)" data-testid="tickets-resale-only-sold-out" t="tickets.resale.onlyWhenSoldOut"></p>

			<button
				type="button"
				class="[ button tickets-action ] [ pressable ]"
				if.bind="canShowCode && offersCode(group)"
				click.trigger="openCode(group)"
				t="tickets.code.show"
			></button>
		</section>
	</div>

	<!-- Confirmation before listing one ticket for official resale -->
	<bottom-sheet
		open.bind="isListingOpen"
		dismissable.bind="!resaleBusy"
		sheet-closed.trigger="cancelListing()"
		aria-label.bind="i18n.tr('tickets.resale.confirmTitle')"
	>
		<div class="[ tickets-code ] [ flow ]" if.bind="listingTicket" data-testid="tickets-resale-confirm">
			<h2 class="[ tickets-step-title ] [ md-typescale-title-large-emphasized ]" t="tickets.resale.confirmTitle"></h2>
			<p class="[ tickets-code-event ] [ md-typescale-title-medium ]">${listingGroup.event?.title}</p>
			<dl class="summary-list">
				<div>
					<dt class="md-typescale-label-large" t="tickets.resale.price"></dt>
					<dd class="md-typescale-body-large" t="tickets.resale.yen" t-params.bind="{ amount: yen(listingPrice(listingTicket)) }"></dd>
				</div>
				<div>
					<dt class="md-typescale-label-large" t="tickets.resale.fee"></dt>
					<dd class="md-typescale-body-large" t="tickets.resale.yen" t-params.bind="{ amount: yen(listingFee(listingPrice(listingTicket))) }"></dd>
				</div>
				<div>
					<dt class="md-typescale-label-large" t="tickets.resale.refundAmount"></dt>
					<dd class="md-typescale-body-large" t="tickets.resale.yen" t-params.bind="{ amount: yen(listingPrice(listingTicket) - listingFee(listingPrice(listingTicket))) }"></dd>
				</div>
			</dl>
			<ul class="[ tickets-resale-terms ] [ flow ]" role="list">
				<li t="tickets.resale.termRefund"></li>
				<li t="tickets.resale.termDeadline" t-params.bind="{ deadline: listingDeadlineLabel(listingGroup) }"></li>
				<li t="tickets.resale.termNotGuaranteed"></li>
				<li t="tickets.resale.termWithdraw"></li>
				<li t="tickets.resale.termInvalid"></li>
			</ul>
			<div class="cluster">
				<button
					type="button"
					class="[ button tickets-action ] [ pressable ]"
					data-testid="tickets-resale-confirm-list"
					disabled.bind="resaleBusy"
					click.trigger="confirmListing()"
					t="tickets.resale.confirm"
				></button>
				<button
					type="button"
					class="[ button tickets-action ] [ pressable ]"
					data-variant="outlined"
					disabled.bind="resaleBusy"
					click.trigger="cancelListing()"
					t="tickets.resale.cancel"
				></button>
			</div>
		</div>
	</bottom-sheet>

	<!-- Entry QR code for every not-yet-entered ticket of the event (up to 10) -->
	<bottom-sheet
		open.bind="isCodeOpen"
		dismissable.bind="true"
		sheet-closed.trigger="closeCode()"
		aria-label.bind="i18n.tr('tickets.code.title')"
	>
		<div class="[ tickets-code ] [ flow ]" if.bind="codeGroup">
			<h2 class="[ tickets-step-title ] [ md-typescale-title-large-emphasized ]" t="tickets.code.title"></h2>
			<p class="[ tickets-code-event ] [ md-typescale-title-medium ]">${codeGroup.event?.title}</p>

			<p class="[ tickets-code-count ] [ md-typescale-headline-large ]" if.bind="headCount > 0">
				<span t="tickets.code.headCount" t-params.bind="{ count: headCount }"></span>
			</p>

			<figure class="[ tickets-code-figure ] [ wrapper ]" if.bind="headCount > 0">
				<img
					class="tickets-code-image"
					if.bind="codeImage"
					src.bind="codeImage"
					alt.bind="i18n.tr('tickets.code.alt', { count: headCount })"
				>
				<p class="[ tickets-lead ] [ md-typescale-body-medium ]" else t="tickets.code.making"></p>
			</figure>
			<p class="[ tickets-lead ] [ md-typescale-body-medium ]" if.bind="headCount === 0" t="tickets.code.allEntered"></p>

			<p class="[ tickets-lead ] [ md-typescale-body-medium ]" t="tickets.code.rotation"></p>
			<p class="[ tickets-lead ] [ md-typescale-body-medium ]" t="tickets.code.brightness"></p>

			<!-- The tickets the code presents; none can be left out -->
			<section
				class="[ tickets-code-who ] [ flow ]"
				if.bind="headCount > 0"
				aria-labelledby="tickets-code-who"
			>
				<h3 class="[ tickets-code-who-title ] [ md-typescale-label-large ]" id="tickets-code-who" t="tickets.code.who"></h3>
				<ul class="[ tickets-code-tickets ] [ cluster ]" role="list">
					<li
						repeat.for="ticket of presented"
						t="tickets.ticketN"
						t-params.bind="{ n: ticketNumber(codeGroup, ticket) }"
					></li>
				</ul>
			</section>

			<button
				type="button"
				class="[ button tickets-action ] [ pressable ]"
				data-variant="outlined"
				click.trigger="closeCode()"
				t="tickets.code.close"
			></button>
		</div>
	</bottom-sheet>
</template>
