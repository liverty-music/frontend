<import from="./virtual-ticket.css"></import>
<import from="./admission-stamp"></import>

<!-- The face. Everything on it is text; it holds no QR code and no ticket id.
     `data-share` (set on a clone for the share image) masks the
     `data-personal` items, hides the stamp and empties the cover's area. -->
<article
	ref="face"
	class="virtual-ticket"
	style="--artist-hue: ${hue}"
	aria-labelledby.bind="titleId"
	data-testid="virtual-ticket"
>
	<!-- The cover is loaded with CORS so it can be drawn into the share image;
	     the CDN sends Access-Control-Allow-Origin on every cover. -->
	<div class="virtual-ticket-cover" if.bind="showsCover" data-testid="virtual-ticket-cover">
		<img
			ref="coverImage"
			class="virtual-ticket-cover-image"
			src.bind="event.coverUrl"
			alt=""
			crossorigin="anonymous"
			error.trigger="onCoverError()"
		>
	</div>

	<div class="[ virtual-ticket-body ] [ flow ]">
		<p class="[ virtual-ticket-performers ] [ md-typescale-label-large ]" if.bind="performers">${performers}</p>
		<h2 class="[ virtual-ticket-title ] [ md-typescale-headline-small ]" id.bind="titleId">
			<template if.bind="event">${event.title}</template>
			<template else><span t="tickets.event.unknown"></span></template>
		</h2>

		<dl class="virtual-ticket-details">
			<div if.bind="event">
				<dt class="md-typescale-label-medium" t="tickets.event.date"></dt>
				<dd class="md-typescale-body-large">${date}</dd>
			</div>
			<div if.bind="event">
				<dt class="md-typescale-label-medium" t="tickets.event.venue"></dt>
				<dd class="md-typescale-body-large">
					${event.venueName}<template if.bind="prefecture"> <span class="virtual-ticket-area" data-testid="virtual-ticket-prefecture">${prefecture}</span></template>
				</dd>
			</div>
			<div if.bind="event.openTime">
				<dt class="md-typescale-label-medium" t="tickets.event.open"></dt>
				<dd class="md-typescale-body-large">${time(event.openTime)}</dd>
			</div>
			<div if.bind="event.startTime">
				<dt class="md-typescale-label-medium" t="tickets.event.start"></dt>
				<dd class="md-typescale-body-large">${time(event.startTime)}</dd>
			</div>
			<div if.bind="ticket.seatTypeName">
				<dt class="md-typescale-label-medium" t="tickets.field.seatType"></dt>
				<dd class="md-typescale-body-large" data-testid="virtual-ticket-seat-type">${ticket.seatTypeName}</dd>
			</div>
			<div>
				<dt class="md-typescale-label-medium" t="tickets.field.seat"></dt>
				<dd class="md-typescale-body-large" t="tickets.field.noSeat"></dd>
			</div>
			<div data-personal>
				<dt class="md-typescale-label-medium" t="tickets.field.fullName"></dt>
				<dd class="md-typescale-body-large" data-testid="virtual-ticket-full-name">${personalDetails.fullName}</dd>
			</div>
			<div data-personal>
				<dt class="md-typescale-label-medium" t="tickets.field.phoneNumber"></dt>
				<dd class="md-typescale-body-large" data-testid="virtual-ticket-phone-number">${phoneNumber}</dd>
			</div>
		</dl>

		<p
			class="[ virtual-ticket-notice ] [ md-typescale-body-small ]"
			if.bind="ticket.resaleWithoutConsentProhibited"
			t="tickets.resaleProhibited"
		></p>
	</div>

	<!-- The admission stamp: real text, pressed once per ticket on a device -->
	<admission-stamp
		if.bind="entered"
		time.bind="admitTime"
		datetime.bind="admitIso"
		pressing.bind="pressing"
		animationend.trigger="onStampAnimationEnd($event)"
	></admission-stamp>
</article>
