<import from="./discovery-genre-bar.css"></import>

<!-- Pinned reset + scrollable chips -->
<div class="genre-bar">
  <button
    type="button"
    class="[ chip reset-chip ] [ state-layer ] [ md-typescale-label-large ]"
    click.trigger="reset()"
    disabled.bind="genre.isLoadingTag"
    aria-label.bind="$this.i18n?.tr('discovery.resetBubbles') ?? ''"
  >
    <svg-icon name="rotate-ccw" size="sm" class="chip-icon"></svg-icon>
  </button>
  <fieldset class="genre-chips">
    <button
      repeat.for="tag of genre.genreTags; key.bind: tag"
      type="button"
      class="[ chip ] [ state-layer ] [ md-typescale-label-large ]"
      click.trigger="select(tag)"
      disabled.bind="genre.isLoadingTag"
      aria-pressed.bind="genre.activeTag === tag"
    >
      <svg-icon if.bind="genre.activeTag === tag" name="check" class="chip-icon"></svg-icon>
      <span>${tag}</span>
    </button>
  </fieldset>
</div>
