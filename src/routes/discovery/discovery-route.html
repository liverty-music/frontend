<template>
  <import from="./discovery-route.css"></import>
  <import from="./discovery-swap.css"></import>
  <import from="../../components/dna-orb/dna-orb-canvas"></import>
  <import from="../../components/onboarding-progress/onboarding-progress"></import>
  <import from="../../components/all-nearby/nearby-concerts"></import>
  <import from="../../components/discovery-swap-button/discovery-swap-button"></import>
  <import from="./discovery-starfield"></import>
  <import from="./discovery-search-bar"></import>
  <import from="./discovery-genre-bar"></import>
  <import from="./discovery-search-results"></import>

  <!-- The page title ("Discovery") is owned by the shell-hosted <page-header>,
       driven from the route's data.titleKey. -->

  <!-- Help sheet: the `?` trigger moved to the FAB action launcher; opened via
       the ref. Auto-open on first visit is unchanged. -->
  <page-help component.ref="pageHelp" page="discovery"></page-help>

  <main class="[ discovery-layout ]" data-search-mode.bind="search.isSearchMode" data-view.bind="view" data-revealing.bind="revealing">

    <!-- Decorative stars behind the rows -->
    <discovery-starfield aria-hidden="true"></discovery-starfield>

    <discovery-search-bar search.bind="search" search-clear.trigger="clearSearch()"></discovery-search-bar>

    <!-- Genre row (hidden during search) -->
    <discovery-genre-bar
      genre.bind="genre"
      bubbles-reset.trigger="onReset()"
      genre-select.trigger="onGenreSelected($event.detail)"
    ></discovery-genre-bar>

    <!-- Onboarding progress row: outside the bubble field so it never covers a
         bubble or the orb (hidden during search and after onboarding) -->
    <onboarding-progress
      if.bind="showProgressRow"
      class="progress-row"
      value.bind="readiness"
    ></onboarding-progress>

    <!-- Bubble UI (hidden during search) -->
    <div class="bubble-area">
      <dna-orb-canvas
        component.ref="dnaOrbCanvas"
        artists.bind="bubbleStore.field"
        placements.bind="bubbleStore.pendingPlacements"
        followed-count.bind="followedCount"
        artist-selected.trigger="onArtistSelected($event)"
        need-more-bubbles.trigger="onNeedMoreBubbles($event)"
        reveal-mark.trigger="onRevealMark($event)"
      ></dna-orb-canvas>

    </div>

    <!-- Search results (shown during search) -->
    <discovery-search-results
      search.bind="search"
      followed-ids.bind="followedIds"
      follow.trigger="$event.detail.waitUntil(onFollowFromSearch($event.detail.artist))"
    ></discovery-search-results>

    <!-- All Nearby view: in place of the search bar, the genre chips and the
         bubbles, which keep their size underneath (the field is not rebuilt). -->
    <nearby-concerts
      component.ref="nearbyConcerts"
      if.bind="view === 'nearby'"
      class="nearby-view"
      visit.bind="nearbyVisit"
      on-signup-requested.bind="() => offerSignUp()"
    ></nearby-concerts>

    <!-- Swap tile beside the orb, in the band under the bubbles' floor that no
         bubble enters; mirrored in left-handed mode, hidden in search mode. -->
    <discovery-swap-button
      class="swap-tile-slot"
      data-handed.bind="fabMenu.handed"
      view.bind="view"
      on-swap.bind="() => switchView()"
    ></discovery-swap-button>

    <!-- Screen reader status -->
    <output
      role="status"
      aria-live="polite"
      class="visually-hidden"
      textcontent.bind="srStatusText"
    ></output>
  </main>

  <!-- Sign-up prompt for a guest who tapped follow in the All Nearby view.
       Outside <main>: the banner is fixed to the viewport, and the layout is
       a size container that would become its containing block. -->
  <signup-prompt-banner
    visible.bind="showSignupBanner && !isAuthenticated"
    message.bind="i18n.tr('myArtists.signupBanner.message')"
    signup-requested.trigger="onSignupRequested()"
  ></signup-prompt-banner>
</template>
