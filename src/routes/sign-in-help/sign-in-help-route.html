<!-- The page title is owned by the shell-hosted <page-header> (data.titleKey). -->
<main class="[ sign-in-help ] [ stack wrapper ]">
  <p t="signInHelp.lead" class="[ sign-in-help-lead ] [ md-typescale-body-large ]"></p>
  <ul class="[ sign-in-help-notes ] [ stack ] [ md-typescale-body-medium ]" role="list">
    <li t="signInHelp.noteValidity"></li>
    <li t="signInHelp.noteDevice"></li>
  </ul>

  <!-- `novalidate`: the VM checks the address on submit and shows the error
       below the field, tied to it with aria-describedby. -->
  <form
    if.bind="!sent"
    class="[ sign-in-help-form card ] [ stack ]"
    submit.trigger="send()"
    novalidate
    data-testid="sign-in-help-form"
  >
    <p class="[ md-typescale-body-small ]" t="common.requiredNote"></p>
    <label class="[ sign-in-help-field ] [ stack ]">
      <span t="signInHelp.emailLabel" data-required class="[ sign-in-help-label ] [ md-typescale-label-large ]"></span>
      <input
        type="email"
        inputmode="email"
        autocomplete="email"
        aria-required="true"
        value.bind="email"
        aria-invalid.bind="emailInvalid"
        aria-describedby="sign-in-help-email-error"
        class="[ text-field ] [ md-typescale-body-large ]"
        data-testid="sign-in-help-email"
      />
    </label>
    <p id="sign-in-help-email-error" if.bind="emailInvalid" class="[ field-error ] [ md-typescale-body-medium ]" role="alert"><svg-icon name="warning" size="sm" aria-hidden="true"></svg-icon><span t="signInHelp.emailInvalid"></span></p>
    <p if.bind="error === 'tooMany'" role="alert" t="signInHelp.tooMany" class="[ sign-in-help-error ] [ md-typescale-body-medium ]" data-testid="sign-in-help-too-many"></p>
    <p if.bind="error === 'failed'" role="alert" t="signInHelp.failed" class="[ sign-in-help-error ] [ md-typescale-body-medium ]" data-testid="sign-in-help-failed"></p>
    <button
      type="submit"
      aria-busy.bind="sending"
      disabled.bind="sending"
      class="[ button ] [ state-layer ]"
      data-testid="sign-in-help-send"
    >
      <span if.bind="error === 'failed'" t="signInHelp.retry"></span>
      <span else t="signInHelp.send"></span>
    </button>
  </form>

  <section if.bind="sent" class="[ sign-in-help-sent card ] [ stack ]" aria-live="polite" data-testid="sign-in-help-sent">
    <svg-icon name="check" size="xl" class="sign-in-help-icon"></svg-icon>
    <p t="signInHelp.sent" class="[ sign-in-help-sent-message ] [ md-typescale-body-large ]"></p>
    <button
      type="button"
      busy-on-click.bind="() => send()"
      disabled.bind="resendIn > 0"
      class="[ button ] [ state-layer ]"
      data-variant="outlined"
      data-testid="sign-in-help-resend"
    >
      <span if.bind="resendIn > 0" t="signInHelp.resendIn" t-params.bind="{ seconds: resendIn }"></span>
      <span else t="signInHelp.resend"></span>
    </button>
  </section>
</main>
