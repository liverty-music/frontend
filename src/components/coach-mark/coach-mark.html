<import from="./coach-mark.css"></import>
<import from="./coach-mark-tooltip.css"></import>

<!-- `hidden` and `inert`, not if.bind: the overlay stays in the DOM so it can
     fade out; `display: none` takes it away once the fade ends. -->
<div
  hidden.bind="!visible"
  inert.bind="!visible"
  ref="overlayEl"
  class="[ coach-mark-overlay ]"
  keydown.trigger="onKeydown($event)"
>
  <div class="visual-spotlight"></div>

  <div class="target-interceptor" click.trigger="onTargetClick($event)"></div>

  <div class="coach-mark-tooltip" aria-label="Onboarding tip" role="tooltip">
    <!-- The target names this line as its description, so a screen reader
         reads the tip when it reaches the target (the tooltip pattern). -->
    <p id.bind="messageId" class="[ coach-tooltip-message ] [ md-typescale-body-large ]">${message}</p>
  </div>
</div>
