<!-- Non-modal popover host: a native <dialog> shown via showPopover() (NOT
     showModal()) for Top-Layer promotion and the ::backdrop WITHOUT a modal's
     pointer-blocking backdrop. Using <dialog> keeps the native dialog role; the
     view-model manages focus-trap, background `inert`, and the Escape close
     request, which a non-modal popover does not provide. -->
<dialog
  ref="popoverEl"
  class="sheet-popover"
  popover="manual"
  aria-modal="true"
>
  <div
    ref="scrollArea"
    class="scroll-area"
    data-dismissable.bind="dismissable"
  >
    <!-- Dismiss zone (always in DOM; CSS controls snap behavior via data-dismissable).
         Tap-outside: clicking the dimmed area closes a dismissable sheet. -->
    <div
      class="dismiss-zone"
      aria-hidden="true"
      click.trigger="onDismissZoneClick()"
    ></div>

    <!-- Sheet body (scroll-snap target at bottom, initially visible). Focusable
         (tabindex="-1") so focus can be moved into it on open. -->
    <section ref="sheetBody" class="[ sheet-body ] [ wrapper ]" tabindex="-1">
      <div class="handle-bar"></div>
      <!-- The heading names the dialog (aria-labelledby, set by the view-model).
           A sheet's own action for the whole sheet (clear all) sits beside it. -->
      <div if.bind="heading" class="sheet-heading-row">
        <h2 id.bind="headingId" class="[ sheet-heading ] [ md-typescale-title-large ]">${heading}</h2>
        <au-slot name="heading-action"></au-slot>
      </div>
      <au-slot></au-slot>
    </section>
  </div>
</dialog>
