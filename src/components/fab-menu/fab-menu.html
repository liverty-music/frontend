<import from="./fab-menu.css"></import>

<!-- Collapsed FAB: a disclosure button (aria-expanded + aria-controls), NOT an
     ARIA menu. It is itself a manual popover (shown on attach) so it floats in
     the top layer, and controls the panel via popovertarget so the browser
     handles the open/close toggle natively (no invoker double-fire). -->
<button
  ref="fabButton"
  type="button"
  class="fab-toggle"
  popover="manual"
  popovertarget="fab-menu-panel"
  popovertargetaction="toggle"
  data-handed.bind="fabMenu.handed"
  aria-controls="fab-menu-panel"
  aria-expanded.bind="isOpen"
  t="[aria-label]fabMenu.toggleAriaLabel"
>
  <!-- Equalizer (collapsed) and close (expanded) glyphs, cross-faded on
       data-open. Inline so each equalizer bar can bounce on its own. -->
  <span class="fab-glyph" data-open.bind="isOpen" aria-hidden="true">
    <svg class="fab-equalizer" viewBox="0 0 24 24" focusable="false">
      <rect class="fab-bar" x="3.5" y="9" width="4" height="12" rx="2"></rect>
      <rect class="fab-bar" x="10" y="3" width="4" height="18" rx="2"></rect>
      <rect class="fab-bar" x="16.5" y="12" width="4" height="9" rx="2"></rect>
    </svg>
    <svg class="fab-close" viewBox="0 0 24 24" focusable="false">
      <path d="M6 6 18 18M18 6 6 18"></path>
    </svg>
  </span>
</button>

<!-- Expanded panel: top-layer auto popover, a role="group" of plain buttons
     (disclosure, not menu). Uses a dialog element (project lint requires popovers
     to be dialogs, not divs); the popover="auto" attribute governs behavior
     (light-dismiss + Esc), not modal dialog semantics, and role="group" keeps the
     disclosure contract. Each item is icon + text label (labels mandatory),
     placed along the thumb arc by its index (--i) out of the count (--n);
     toggle items carry aria-pressed, command/active items carry data-active. -->
<dialog
  ref="panel"
  id="fab-menu-panel"
  popover="auto"
  role="group"
  class="fab-panel"
  data-handed.bind="fabMenu.handed"
  t="[aria-label]fabMenu.panelAriaLabel"
  toggle.trigger="onPanelToggle($event)"
>
  <!-- Full-screen scrim inside the panel: a tap outside the arc lands here and
       only closes the arc. (A popover's own ::backdrop lets that tap through to
       the page underneath.) Hidden from assistive technology; Escape and the
       FAB close the arc for them. -->
  <div class="fab-scrim" aria-hidden="true" click.trigger="dismiss()"></div>
  <ul class="fab-list">
    <li
      repeat.for="action of fabMenu.actions"
      key.bind="action.id"
      class="fab-list-item"
      style="--i: ${$index}; --n: ${fabMenu.actions.length}"
    >
      <button
        type="button"
        class="fab-item"
        data-action-id.bind="action.id"
        data-kind.bind="action.kind"
        data-active.bind="isActive(action) & signal:'fab-menu:state'"
        aria-pressed.bind="(action.kind === 'toggle' ? isPressed(action) : null) & signal:'fab-menu:state'"
        click.trigger="onAction(action)"
      >
        <svg-icon name.bind="action.icon" size="md" class="fab-item-icon"></svg-icon>
        <span class="fab-item-label" t.bind="action.labelKey"></span>
      </button>
    </li>
  </ul>
</dialog>
