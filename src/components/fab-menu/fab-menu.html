<import from="./fab-menu.css"></import>
<import from="./fab-toggle/fab-toggle"></import>
<import from="./fab-action/fab-action"></import>

<!-- Collapsed FAB: a disclosure button that is itself a manual popover
     (see fab-toggle), handed back here so the launcher owns its top layer. -->
<fab-toggle
  button.from-view="fabButton"
  open.bind="isOpen"
  handed.bind="fabMenu.handed"
></fab-toggle>

<!-- Expanded panel: top-layer auto popover, a role="group" of plain buttons
     (disclosure, not menu). Uses a dialog element (project lint requires popovers
     to be dialogs, not divs); the popover="auto" attribute governs behavior
     (light-dismiss + Esc), not modal dialog semantics, and role="group" keeps the
     disclosure contract. Each item is icon + text label (labels mandatory),
     placed along the thumb arc by its index (--i) out of the count (--n);
     toggle items carry aria-pressed, command/active items carry data-active. -->
<dialog
  ref="panel"
  id="fab-menu-panel"
  popover="auto"
  role="group"
  class="fab-panel"
  data-handed.bind="fabMenu.handed"
  t="[aria-label]fabMenu.panelAriaLabel"
  toggle.trigger="onPanelToggle($event)"
>
  <!-- Full-screen scrim inside the panel: a tap outside the arc lands here and
       only closes the arc. (A popover's own ::backdrop lets that tap through to
       the page underneath.) Hidden from assistive technology; Escape and the
       FAB close the arc for them. -->
  <div class="fab-scrim" aria-hidden="true" click.trigger="dismiss()"></div>
  <ul class="fab-list">
    <li
      repeat.for="action of fabMenu.actions"
      key.bind="action.id"
      class="fab-list-item"
      style="--i: ${$index}; --n: ${fabMenu.actions.length}"
    >
      <fab-action
        action.bind="action"
        active.bind="isActive(action) & signal:'fab-menu:state'"
        pressed.bind="(action.kind === 'toggle' ? isPressed(action) : null) & signal:'fab-menu:state'"
        click.trigger="onAction(action)"
      ></fab-action>
    </li>
  </ul>
</dialog>
