<import from="./fab-glyph.css"></import>

<!-- Equalizer (collapsed) and close (expanded) glyphs, cross-faded on
     data-open. Inline so each equalizer bar can bounce on its own. -->
<span class="fab-glyph" data-open.bind="open" aria-hidden="true">
  <svg class="fab-equalizer" viewBox="0 0 24 24" focusable="false">
    <rect class="fab-bar" x="3.5" y="9" width="4" height="12" rx="2"></rect>
    <rect class="fab-bar" x="10" y="3" width="4" height="18" rx="2"></rect>
    <rect class="fab-bar" x="16.5" y="12" width="4" height="9" rx="2"></rect>
  </svg>
  <svg class="fab-close" viewBox="0 0 24 24" focusable="false">
    <path d="M6 6 18 18M18 6 6 18"></path>
  </svg>
</span>
