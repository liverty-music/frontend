<import from="./onboarding-progress.css"></import>
<import from="../onboarding-progress-meter/onboarding-progress-meter"></import>
<import from="../onboarding-ready-link/onboarding-ready-link"></import>

<onboarding-ready-link if.bind="ready"></onboarding-ready-link>

<div else class="onboarding-progress-track">
  <span id="onboarding-progress-label" class="[ onboarding-progress-label ] [ md-typescale-body-medium ]" t="discovery.progress.label"></span>
  <onboarding-progress-meter
    percent.bind="percent"
    rise.bind="rises % 2"
    labelled-by="onboarding-progress-label"
  ></onboarding-progress-meter>
  <span class="[ onboarding-progress-value ] [ md-typescale-label-large ]" aria-hidden="true">${percent}%</span>
</div>
