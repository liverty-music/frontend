<import from="./notification-bell.css"></import>

<button
	type="button"
	class="[ notification-bell ] [ state-layer ]"
	data-testid="notification-bell"
	t="[aria-label]notifications.bell"
	t-params.bind="{ count: unreadCount }"
>
	<span class="notification-bell-icon">
		<svg-icon name.bind="iconName" size="lg" data-testid="notification-bell-icon"></svg-icon>
		<small if.bind="unreadCount > 0" class="[ notification-bell-badge ] [ md-typescale-label-small ]" data-testid="notification-bell-badge" aria-hidden="true">${unreadCount}</small>
	</span>
</button>
