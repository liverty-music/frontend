<import from="./nearby-concerts.css"></import>
<import from="./date-range-sheet"></import>
<import from="./nearby-filter-sheet"></import>

<!-- Venue on every card; the AWAY lane is left out (two lanes). First in the
     content cell, so the states below paint over it and take the tap. -->
<concert-highway
  date-groups.bind="dateGroups"
  show-beams.bind="false"
  show-venue-always.bind="true"
  hide-away.bind="true"
  event-selected.trigger="onEventSelected($event)"
></concert-highway>

<!-- Loading: content-shaped skeleton. -->
<state-placeholder if.bind="isLoading" loading.bind="true" rows.bind="6" data-testid="all-nearby-loading"></state-placeholder>

<inline-error
  if.bind="loadError"
  message.bind="i18n.tr('dashboard.error.load')"
  retry-action.bind="() => load()"
></inline-error>

<!-- Empty: nothing for this area and period. The filter stays one tap away
     in the action launcher, for a longer period or another area. -->
<state-placeholder
  if.bind="!isLoading && !loadError && dateGroups.length === 0"
  icon="clock"
  data-testid="all-nearby-empty"
>
  <div class="[ nearby-empty-text ] [ stack ]">
    <p t="allNearby.empty.title" class="[ state-placeholder-title ] [ md-typescale-title-large ]"></p>
    <p t="allNearby.empty.subtitle" class="[ nearby-empty-subtitle ] [ md-typescale-body-medium ]"></p>
  </div>
</state-placeholder>

<!-- The follow action dispatches onSignupRequested for a guest. -->
<event-detail-sheet
  component.ref="detailSheet"
  on-signup-requested.bind="() => onFollowSignupRequested()"
></event-detail-sheet>

<!-- The filters, opened from the action launcher's filter item: one sheet with
     the area and period rows, each opening its own selector once it closes. -->
<nearby-filter-sheet
  component.ref="filterSheet"
  area-name.bind="selectedAreaName"
  period-label.bind="periodLabel"
  filter-row-chosen.trigger="onFilterRowChosen($event)"
></nearby-filter-sheet>

<!-- The area override, kept on the device; never saved to the account or as
     the guest home. -->
<user-home-selector
  component.ref="areaSelector"
  current-code.bind="effectiveAreaCode"
  on-home-selected.bind="(code) => onAreaSelected(code)"
></user-home-selector>

<!-- Emits its range on bind (seeding the period and the first load), starting
     from the visit's range: the kept preset, or the range of this visit. -->
<date-range-sheet
  component.ref="dateSheet"
  initial-range.bind="visit.range"
  range-changed.trigger="onRangeChanged($event)"
></date-range-sheet>
