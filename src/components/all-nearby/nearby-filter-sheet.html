<import from="./nearby-filter-sheet.css"></import>
<import from="../bottom-sheet/bottom-sheet"></import>

<bottom-sheet
  open.bind="isOpen"
  sheet-closed.trigger="onSheetClosed()"
  sheet-hidden.trigger="onSheetHidden()"
  aria-labelledby="nearby-filter-sheet-title"
>
  <div class="[ nearby-filter-sheet ] [ flow ]">
    <h2 class="[ sheet-title ] [ md-typescale-title-large ]" id="nearby-filter-sheet-title" t="allNearby.filter.title"></h2>
    <ul class="filter-rows" role="list">
      <li>
        <button type="button" class="[ filter-row ] [ pressable md-typescale-body-large ]" data-testid="nearby-area-row" click.trigger="choose('area')">
          <svg-icon name="map-pin" size="sm" aria-hidden="true"></svg-icon>
          <span class="row-label" t="allNearby.filter.area"></span>
          <span if.bind="areaName" class="[ row-value ] [ md-typescale-body-large-emphasized ]">${areaName}</span>
          <span else class="row-value" data-empty t="allNearby.area.choose"></span>
          <svg-icon name="chevron-right" size="xs" class="row-caret" aria-hidden="true"></svg-icon>
        </button>
      </li>
      <li>
        <button type="button" class="[ filter-row ] [ pressable md-typescale-body-large ]" data-testid="nearby-period-row" click.trigger="choose('period')">
          <svg-icon name="calendar" size="sm" aria-hidden="true"></svg-icon>
          <span class="row-label" t="allNearby.filter.period"></span>
          <span class="[ row-value ] [ md-typescale-body-large-emphasized ]">${periodLabel}</span>
          <svg-icon name="chevron-right" size="xs" class="row-caret" aria-hidden="true"></svg-icon>
        </button>
      </li>
    </ul>
  </div>
</bottom-sheet>
