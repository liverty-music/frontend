<import from="./date-preset-selector.css"></import>

<div class="[ date-preset-selector ] [ flow ]">
  <div class="[ preset-group ] [ cluster ]" role="group" t="[aria-label]allNearby.datePreset.groupLabel">
    <button
      repeat.for="p of presets"
      type="button"
      class="[ preset-chip ]"
      data-active.bind="preset === p"
      aria-pressed.bind="preset === p"
      click.trigger="selectPreset(p)"
      t.bind="'allNearby.datePreset.' + p"
    ></button>
  </div>

  <div if.bind="preset === 'custom'" class="[ custom-range ] [ cluster ]">
    <label class="[ custom-field ]">
      <span class="custom-label" t="allNearby.datePreset.from"></span>
      <input
        type="date"
        class="custom-input"
        value.bind="customFrom"
        change.trigger="onCustomFromChanged()"
      />
    </label>
    <label class="[ custom-field ]">
      <span class="custom-label" t="allNearby.datePreset.to"></span>
      <input
        type="date"
        class="custom-input"
        value.bind="customTo"
        min.bind="toMin"
        max.bind="toMax"
        change.trigger="onCustomToChanged()"
      />
    </label>
    <p
      class="custom-hint"
      t="allNearby.datePreset.rangeHint"
      t-params.bind="{ days: maxRangeDays }"
    ></p>
  </div>
</div>
