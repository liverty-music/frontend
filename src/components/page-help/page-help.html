<import from="./page-help.css"></import>
<import from="../stage-lane-legend/stage-lane-legend"></import>
<import from="../hype-tier-legend/hype-tier-legend"></import>

<!-- Opened only from the action launcher's help item (open()); it never opens
     on its own. A section with a guide moment ends with 「チュートリアル」 while
     the moment's target is on the screen. -->

<!-- Each per-page <template case="…"> contains one or more <section> sub-blocks.
     Each sub-section carries its own .help-section-title heading; there is no
     sheet-level <h2>, because the bottom-sheet itself provides the accessible
     name via its aria-label. See onboarding-page-help capability spec. -->
<bottom-sheet open.bind="isOpen" sheet-closed.trigger="onSheetClosed()" t="[aria-label]pageHelp.sheetAriaLabel">

  <template switch.bind="page">

    <template case="discovery">
      <!-- Discovery: 3 sub-sections — Finding Artists, Concerts, Unfollowing. -->
      <section class="[ page-help-content ] [ flow ]">
        <header class="page-help-header">
          <svg-icon name="info" size="md" class="page-help-icon"></svg-icon>
          <h3 class="[ help-section-title ] [ md-typescale-headline-small ]" t="pageHelp.discovery.findingSectionTitle"></h3>
        </header>
        <p class="page-help-desc" t="pageHelp.discovery.description"></p>

        <!-- Inline demo of the actual genre chips so the tip is shown, not just told. -->
        <div class="[ page-help-chip-demo ] [ cluster ]" aria-hidden="true">
          <span class="[ chip ] [ md-typescale-label-large ]">Rock</span>
          <span class="[ chip ] [ md-typescale-label-large ]" data-selected="true"><svg-icon name="check" class="chip-icon"></svg-icon>Pop</span>
          <span class="[ chip ] [ md-typescale-label-large ]">Jazz</span>
        </div>

        <ul class="[ page-help-tips ] [ stack ]">
          <li t="pageHelp.discovery.genreTip"></li>
          <li t="pageHelp.discovery.searchTip"></li>
        </ul>

        <button
          if.bind="findingReplay"
          type="button"
          class="[ button page-help-replay ] [ state-layer ]"
          data-variant="outlined"
          data-testid="help-replay-finding"
          click.trigger="replay(findingReplay)"
          t="guide.replay"
        ></button>
      </section>

      <!-- A signed-in fan's only: a guest has no Concerts view. -->
      <section if.bind="isAuthenticated" class="[ page-help-content ] [ flow ]">
        <header class="page-help-header">
          <svg-icon name="info" size="md" class="page-help-icon"></svg-icon>
          <h3 class="[ help-section-title ] [ md-typescale-headline-small ]" t="pageHelp.discovery.concertsSectionTitle"></h3>
        </header>
        <p class="page-help-desc" t="pageHelp.discovery.concertsDesc"></p>

        <button
          type="button"
          class="[ button page-help-replay ] [ state-layer ]"
          data-variant="outlined"
          data-testid="help-replay-concerts"
          click.trigger="replay(concertsReplay)"
          t="guide.replay"
        ></button>
      </section>

      <section class="[ page-help-content ] [ flow ]">
        <header class="page-help-header">
          <svg-icon name="info" size="md" class="page-help-icon"></svg-icon>
          <h3 class="[ help-section-title ] [ md-typescale-headline-small ]" t="pageHelp.discovery.unfollowSectionTitle"></h3>
        </header>
        <p class="page-help-desc" t="pageHelp.discovery.unfollowDesc"></p>
      </section>
    </template>

    <template case="timetable">
      <!-- Timetable: 2 sub-sections — Reading the Stage Lanes + Viewing Concert Details. -->
      <section class="[ page-help-content ] [ flow ]">
        <header class="page-help-header">
          <svg-icon name="info" size="md" class="page-help-icon"></svg-icon>
          <h3 class="[ help-section-title ] [ md-typescale-headline-small ]" t="pageHelp.timetable.lanesSectionTitle"></h3>
        </header>
        <p class="page-help-desc" t="pageHelp.timetable.description"></p>
        <dl as-element="stage-lane-legend" class="page-help-lanes"></dl>
      </section>

      <section class="[ page-help-content ] [ flow ]">
        <header class="page-help-header">
          <svg-icon name="info" size="md" class="page-help-icon"></svg-icon>
          <h3 class="[ help-section-title ] [ md-typescale-headline-small ]" t="pageHelp.timetable.detailsSectionTitle"></h3>
        </header>
        <p class="page-help-desc" t="pageHelp.timetable.cardTip"></p>
      </section>
    </template>

    <template case="my-artists">
      <!-- My Artists: Hype sub-section + Unfollow (Edit mode) sub-section. -->
      <section class="[ page-help-content ] [ flow ]">
        <header class="page-help-header">
          <svg-icon name="info" size="md" class="page-help-icon"></svg-icon>
          <h3 class="[ help-section-title ] [ md-typescale-headline-small ]" t="pageHelp.myArtists.hypeSectionTitle"></h3>
        </header>
        <p class="page-help-desc" t="pageHelp.myArtists.description"></p>

        <ul as-element="hype-tier-legend" class="help-hype-grid"></ul>

        <p class="[ page-help-note ] [ md-typescale-body-medium ]" t="pageHelp.myArtists.tip"></p>

        <button
          if.bind="hypeReplay"
          type="button"
          class="[ button page-help-replay ] [ state-layer ]"
          data-variant="outlined"
          data-testid="help-replay-hype"
          click.trigger="replay(hypeReplay)"
          t="guide.replay"
        ></button>
      </section>

      <!-- Unfollow section: Edit-mode guidance, shown to all users on all devices. -->
      <section class="[ page-help-content ] [ flow ]">
        <header class="page-help-header">
          <svg-icon name="info" size="md" class="page-help-icon"></svg-icon>
          <h3 class="[ help-section-title ] [ md-typescale-headline-small ]" t="pageHelp.myArtists.unfollowSectionTitle"></h3>
        </header>
        <p class="page-help-desc" t="pageHelp.myArtists.editModeTip"></p>
      </section>
    </template>

  </template>

</bottom-sheet>
