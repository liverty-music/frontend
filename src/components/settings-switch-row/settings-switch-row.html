<import from="../settings-list/settings-list.css"></import>
<import from="../settings-list/settings-row.css"></import>
<import from="./settings-switch-row.css"></import>
<import from="../settings-list/settings-toggle-track.css"></import>

<button
  type="button"
  busy-on-click.bind="action"
  role="switch"
  aria-checked.bind="checked"
  aria-disabled.bind="unavailable"
  aria-describedby.bind="description ? descriptionId : null"
  class="[ settings-row ] [ settings-row-toggle ] [ state-layer ]"
  data-disabled.bind="unavailable"
>
  <svg-icon name.bind="icon" size="lg" class="settings-icon"></svg-icon>
  <span class="[ settings-toggle-col ] [ stack ]">
    <span class="[ settings-row-label ] [ md-typescale-body-large ]">${label}</span>
    <span if.bind="description" id.bind="descriptionId" class="[ settings-toggle-desc ] [ md-typescale-body-medium ]">${description}</span>
  </span>
  <span class="settings-toggle-track" data-on.bind="checked">
    <span class="settings-toggle-thumb" data-on.bind="checked"></span>
  </span>
</button>
