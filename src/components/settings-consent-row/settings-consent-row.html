<import from="../settings-list/settings-list.css"></import>
<import from="../settings-list/settings-row.css"></import>
<import from="./settings-consent-row.css"></import>
<import from="./settings-consent-description.css"></import>
<import from="../settings-list/settings-toggle-track.css"></import>

<div class="[ settings-row ] [ settings-row-toggle ]">
  <svg-icon name.bind="icon" size="lg" class="settings-icon"></svg-icon>
  <button type="button" click.trigger="toggleExpanded()" aria-expanded.bind="expanded" aria-controls.bind="descriptionId" class="[ settings-expand ] [ state-layer ]">
    <span class="[ settings-row-label ] [ md-typescale-body-large ]">${label}</span>
    <svg-icon name="chevron-right" size="sm" class="settings-expand-caret" data-expanded.bind="expanded"></svg-icon>
  </button>
  <button
    type="button"
    busy-on-click.bind="action"
    role="switch"
    aria-checked.bind="checked"
    aria-label.bind="label"
    class="[ settings-switch ] [ state-layer ]"
  >
    <span class="settings-toggle-track" data-on.bind="checked">
      <span class="settings-toggle-thumb" data-on.bind="checked"></span>
    </span>
  </button>
  <!-- Outside the disclosure button: the text is not a control, so the
       hover and press layer covers the label row only. -->
  <span id.bind="descriptionId" hidden.bind="!expanded" class="[ settings-toggle-desc ] [ md-typescale-body-medium ]">${description}</span>
</div>
