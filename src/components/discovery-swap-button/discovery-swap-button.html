<import from="./discovery-swap-button.css"></import>

<!-- The icon is decoration (aria-hidden); the visually hidden label names
     the view a tap leads to and is the button's accessible name. -->
<button
  type="button"
  class="discovery-swap-button"
  data-testid="discovery-swap"
  click.trigger="swap()"
>
  <span class="swap-tile">
    <svg
      class="swap-icon"
      viewBox="0 0 64 64"
      aria-hidden="true"
      focusable="false"
      data-view.bind="view"
      style="--ring-turn: ${ringTurn}"
    >
      <defs>
    <radialGradient id="swap-bubble-0" cx="50%" cy="50%" r="55%" fx="32%" fy="30%">
      <stop offset="0" stop-color="hsl(275 95% 88%)"></stop>
      <stop offset="0.45" stop-color="hsl(275 85% 68%)"></stop>
      <stop offset="1" stop-color="hsl(290 80% 52%)"></stop>
    </radialGradient>
    <radialGradient id="swap-bubble-1" cx="50%" cy="50%" r="55%" fx="32%" fy="30%">
      <stop offset="0" stop-color="hsl(182 95% 88%)"></stop>
      <stop offset="0.45" stop-color="hsl(182 85% 68%)"></stop>
      <stop offset="1" stop-color="hsl(197 80% 52%)"></stop>
    </radialGradient>
    <radialGradient id="swap-bubble-2" cx="50%" cy="50%" r="55%" fx="32%" fy="30%">
      <stop offset="0" stop-color="hsl(46 95% 88%)"></stop>
      <stop offset="0.45" stop-color="hsl(46 85% 68%)"></stop>
      <stop offset="1" stop-color="hsl(61 80% 52%)"></stop>
    </radialGradient>
        <!-- A faint pink-to-cyan film like a soap bubble, and a white glint. -->
        <linearGradient id="swap-sheen" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="hsl(318 100% 80%)" stop-opacity="0.55"></stop>
          <stop offset="0.45" stop-color="hsl(0 0% 100%)" stop-opacity="0"></stop>
          <stop offset="0.75" stop-color="hsl(187 100% 75%)" stop-opacity="0.45"></stop>
          <stop offset="1" stop-color="hsl(0 0% 100%)" stop-opacity="0"></stop>
        </linearGradient>
        <radialGradient id="swap-glint" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="hsl(0 0% 100%)" stop-opacity="0.95"></stop>
          <stop offset="1" stop-color="hsl(0 0% 100%)" stop-opacity="0"></stop>
        </radialGradient>
        <linearGradient id="swap-ticket" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="oklch(82% 0.17 65)"></stop>
          <stop offset="1" stop-color="oklch(66% 0.21 45)"></stop>
        </linearGradient>
      </defs>

      <!-- Two tapered arrows in a loop, point-symmetric about (32, 32), so a
           half turn maps the loop onto itself. Generated once (design D3). -->
      <g class="swap-ring">
        <path class="swap-arrow swap-arrow-brand" d="M9.54 36.77 C9.36 36.43 8.77 35.41 8.43 34.68 C8.10 33.96 7.79 33.20 7.52 32.43 C7.26 31.65 7.02 30.84 6.84 30.02 C6.66 29.20 6.52 28.35 6.44 27.49 C6.36 26.64 6.32 25.76 6.36 24.89 C6.40 24.02 6.49 23.13 6.65 22.27 C6.81 21.40 7.03 20.53 7.32 19.70 C7.61 18.86 7.97 18.03 8.38 17.24 C8.80 16.46 9.28 15.69 9.81 14.97 C10.34 14.26 10.93 13.57 11.56 12.94 C12.20 12.31 12.88 11.73 13.59 11.20 C14.31 10.67 15.07 10.18 15.84 9.76 C16.61 9.33 17.42 8.95 18.23 8.63 C19.04 8.30 19.88 8.03 20.71 7.79 C21.55 7.56 22.39 7.38 23.23 7.23 C24.07 7.08 24.91 6.98 25.74 6.90 C26.57 6.82 27.40 6.78 28.23 6.75 C29.05 6.73 29.87 6.73 30.68 6.75 C31.49 6.77 32.29 6.81 33.10 6.87 C33.90 6.92 34.70 6.99 35.50 7.07 C36.31 7.15 37.11 7.25 37.92 7.36 C38.72 7.47 39.53 7.60 40.35 7.75 C41.17 7.89 41.99 8.06 42.82 8.25 C43.65 8.45 44.91 8.80 45.33 8.91 L47.93 4.41 Q50.85 11.93 50.98 18.21 Q44.28 18.92 38.33 21.04 L40.93 16.53 C40.65 16.45 39.83 16.18 39.28 16.02 C38.74 15.86 38.20 15.71 37.66 15.57 C37.12 15.42 36.59 15.28 36.05 15.14 C35.51 15.01 34.97 14.87 34.43 14.73 C33.88 14.60 33.33 14.46 32.77 14.33 C32.21 14.19 31.64 14.06 31.05 13.94 C30.47 13.82 29.87 13.70 29.25 13.60 C28.63 13.50 28.00 13.41 27.35 13.34 C26.70 13.28 26.03 13.24 25.35 13.23 C24.68 13.22 23.98 13.24 23.28 13.30 C22.59 13.37 21.87 13.47 21.17 13.62 C20.47 13.77 19.76 13.96 19.07 14.21 C18.39 14.46 17.70 14.75 17.05 15.10 C16.40 15.45 15.76 15.85 15.16 16.30 C14.56 16.74 13.99 17.24 13.47 17.78 C12.95 18.32 12.47 18.91 12.04 19.53 C11.61 20.14 11.23 20.80 10.90 21.48 C10.57 22.16 10.30 22.87 10.08 23.59 C9.86 24.30 9.70 25.05 9.59 25.78 C9.48 26.52 9.42 27.28 9.40 28.02 C9.39 28.76 9.43 29.50 9.50 30.23 C9.56 30.96 9.68 31.68 9.82 32.39 C9.96 33.09 10.14 33.79 10.32 34.47 C10.50 35.15 10.81 36.15 10.91 36.48 A0.70 0.70 0 0 1 9.54 36.77Z"></path>
        <path class="swap-arrow swap-arrow-near" d="M54.46 27.23 C54.64 27.57 55.23 28.59 55.57 29.32 C55.90 30.04 56.21 30.80 56.48 31.57 C56.74 32.35 56.98 33.16 57.16 33.98 C57.34 34.80 57.48 35.65 57.56 36.51 C57.64 37.36 57.68 38.24 57.64 39.11 C57.60 39.98 57.51 40.87 57.35 41.73 C57.19 42.60 56.97 43.47 56.68 44.30 C56.39 45.14 56.03 45.97 55.62 46.76 C55.20 47.54 54.72 48.31 54.19 49.03 C53.66 49.74 53.07 50.43 52.44 51.06 C51.80 51.69 51.12 52.27 50.41 52.80 C49.69 53.33 48.93 53.82 48.16 54.24 C47.39 54.67 46.58 55.05 45.77 55.37 C44.96 55.70 44.12 55.97 43.29 56.21 C42.45 56.44 41.61 56.62 40.77 56.77 C39.93 56.92 39.09 57.02 38.26 57.10 C37.43 57.18 36.60 57.22 35.77 57.25 C34.95 57.27 34.13 57.27 33.32 57.25 C32.51 57.23 31.71 57.19 30.90 57.13 C30.10 57.08 29.30 57.01 28.50 56.93 C27.69 56.85 26.89 56.75 26.08 56.64 C25.28 56.53 24.47 56.40 23.65 56.25 C22.83 56.11 22.01 55.94 21.18 55.75 C20.35 55.55 19.09 55.20 18.67 55.09 L16.07 59.59 Q13.15 52.07 13.02 45.79 Q19.72 45.08 25.67 42.96 L23.07 47.47 C23.35 47.55 24.17 47.82 24.72 47.98 C25.26 48.14 25.80 48.29 26.34 48.43 C26.88 48.58 27.41 48.72 27.95 48.86 C28.49 48.99 29.03 49.13 29.57 49.27 C30.12 49.40 30.67 49.54 31.23 49.67 C31.79 49.81 32.36 49.94 32.95 50.06 C33.53 50.18 34.13 50.30 34.75 50.40 C35.37 50.50 36.00 50.59 36.65 50.66 C37.30 50.72 37.97 50.76 38.65 50.77 C39.32 50.78 40.02 50.76 40.72 50.70 C41.41 50.63 42.13 50.53 42.83 50.38 C43.53 50.23 44.24 50.04 44.93 49.79 C45.61 49.54 46.30 49.25 46.95 48.90 C47.60 48.55 48.24 48.15 48.84 47.70 C49.44 47.26 50.01 46.76 50.53 46.22 C51.05 45.68 51.53 45.09 51.96 44.47 C52.39 43.86 52.77 43.20 53.10 42.52 C53.43 41.84 53.70 41.13 53.92 40.41 C54.14 39.70 54.30 38.95 54.41 38.22 C54.52 37.48 54.58 36.72 54.60 35.98 C54.61 35.24 54.57 34.50 54.50 33.77 C54.44 33.04 54.32 32.32 54.18 31.61 C54.04 30.91 53.86 30.21 53.68 29.53 C53.50 28.85 53.19 27.85 53.09 27.52 A0.70 0.70 0 0 1 54.46 27.23Z"></path>
      </g>

      <circle class="swap-badge" cx="53" cy="53" r="8.5"></circle>

      <!-- Artist bubbles: three bubbles and three sparkles, drawn around (0, 0). -->
      <g class="swap-glyph swap-glyph-artists" data-testid="swap-glyph-artists">
        <circle cx="-3.5" cy="-1" r="7.5" fill="url(#swap-bubble-0)"></circle>
        <circle cx="-3.5" cy="-1" r="7.5" fill="url(#swap-sheen)"></circle>
        <ellipse cx="-6.35" cy="-4.15" rx="3.15" ry="1.95" fill="url(#swap-glint)" transform="rotate(-35 -6.35 -4.15)"></ellipse>
        <circle cx="-0.35" cy="2.0" r="0.67" class="swap-glint-dot"></circle>
        <circle cx="-3.5" cy="-1" r="7.2" class="swap-rim"></circle>
        <circle cx="6.5" cy="-6.5" r="4.6" fill="url(#swap-bubble-1)"></circle>
        <circle cx="6.5" cy="-6.5" r="4.6" fill="url(#swap-sheen)"></circle>
        <ellipse cx="4.75" cy="-8.43" rx="1.93" ry="1.2" fill="url(#swap-glint)" transform="rotate(-35 4.75 -8.43)"></ellipse>
        <circle cx="8.43" cy="-4.66" r="0.41" class="swap-glint-dot"></circle>
        <circle cx="6.5" cy="-6.5" r="4.3" class="swap-rim"></circle>
        <circle cx="5" cy="6.5" r="5.4" fill="url(#swap-bubble-2)"></circle>
        <circle cx="5" cy="6.5" r="5.4" fill="url(#swap-sheen)"></circle>
        <ellipse cx="2.95" cy="4.23" rx="2.27" ry="1.4" fill="url(#swap-glint)" transform="rotate(-35 2.95 4.23)"></ellipse>
        <circle cx="7.27" cy="8.66" r="0.49" class="swap-glint-dot"></circle>
        <circle cx="5" cy="6.5" r="5.1" class="swap-rim"></circle>
        <g transform="translate(-11.5 -9) scale(0.9)"><path class="swap-sparkle" data-sparkle="1" d="M0 -3.2 Q0.45 -0.45 3.2 0 Q0.45 0.45 0 3.2 Q-0.45 0.45 -3.2 0 Q-0.45 -0.45 0 -3.2 Z"></path></g>
        <g transform="translate(12.5 1.5) scale(0.7)"><path class="swap-sparkle" data-sparkle="2" d="M0 -3.2 Q0.45 -0.45 3.2 0 Q0.45 0.45 0 3.2 Q-0.45 0.45 -3.2 0 Q-0.45 -0.45 0 -3.2 Z"></path></g>
        <g transform="translate(-9 9.5) scale(0.6)"><path class="swap-sparkle" data-sparkle="3" d="M0 -3.2 Q0.45 -0.45 3.2 0 Q0.45 0.45 0 3.2 Q-0.45 0.45 -3.2 0 Q-0.45 -0.45 0 -3.2 Z"></path></g>
      </g>

      <!-- All Nearby: a ticket marked LIVE with a white location pin, drawn around (0, 0). -->
      <g class="swap-glyph swap-glyph-nearby" data-testid="swap-glyph-nearby">
        <g transform="rotate(-14)">
          <path d="M-13 -7.5 H13 V-2.6 A2.6 2.6 0 0 0 13 2.6 V7.5 H-13 V2.6 A2.6 2.6 0 0 0 -13 -2.6 Z" fill="url(#swap-ticket)"></path>
          <path class="swap-ticket-perforation" d="M4.5 -6.2 V6.2"></path>
          <text class="swap-ticket-text" x="-3" y="2.1" text-anchor="middle" font-size="6" textLength="12.5" lengthAdjust="spacingAndGlyphs">LIVE</text>
        </g>
        <path class="swap-pin" d="M9 3 C6.2 0.2 4.2 -1.8 4.2 -4.4 A4.8 4.8 0 1 1 13.8 -4.4 C13.8 -1.8 11.8 0.2 9 3 Z"></path>
        <circle class="swap-pin-hole" cx="9" cy="-4.6" r="1.7"></circle>
      </g>
    </svg>
  </span>
  <span class="visually-hidden" t.bind="labelKey"></span>
</button>
