<bottom-sheet
  open.bind="prompt.open"
  sheet-closed.trigger="dismissed()"
  aria-label.bind="'addPasskeyPrompt.title' | t"
>
  <div class="[ add-passkey-prompt ] [ stack ]" data-testid="add-passkey-prompt">
    <h2 t="addPasskeyPrompt.title" class="add-passkey-prompt-title"></h2>
    <p t="addPasskeyPrompt.body" class="add-passkey-prompt-body"></p>
    <button type="button" click.trigger="create()" class="[ button ] [ pressable ]" data-testid="add-passkey-create" t="addPasskeyPrompt.create"></button>
    <button type="button" click.trigger="alreadyHasOne()" class="[ button ] [ pressable ]" data-variant="outlined" data-testid="add-passkey-already" t="addPasskeyPrompt.alreadyHasOne"></button>
    <button type="button" click.trigger="later()" class="[ button ] [ pressable ]" data-variant="outlined" data-testid="add-passkey-later" t="addPasskeyPrompt.later"></button>
  </div>
</bottom-sheet>
