<import from="./post-signup-dialog.css"></import>

<bottom-sheet open.bind="isOpen" t="[aria-label]postSignup.ariaLabel" sheet-closed.trigger="close()">
  <section class="post-signup-step" data-step.bind="step">

    <!-- Step 1: notifications -->
    <template if.bind="step === 'notify'">
      <h2 class="post-signup-title" t="postSignup.notify.title"></h2>
      <p if.bind="followedCount > 0" class="post-signup-body" t="postSignup.notify.body" t-params.bind="{ count: followedCount }"></p>
      <p else class="post-signup-body" t="postSignup.notify.bodyNoFollows"></p>
      <p if.bind="notifyProblem" class="post-signup-problem" role="status" t.bind="notifyProblem === 'blocked' ? 'postSignup.notify.blocked' : 'postSignup.notify.failed'"></p>
      <div class="post-signup-actions">
        <button
          if.bind="!notifyProblem"
          type="button"
          class="[ button ] [ pressable ]"
          busy-on-click.bind="() => onEnableNotifications()"
          t="postSignup.notify.enable"
        ></button>
        <button
          else
          type="button"
          class="[ button ] [ pressable ]"
          click.trigger="next()"
          t="postSignup.next"
        ></button>
        <button
          if.bind="!notifyProblem"
          type="button"
          class="[ button ] [ pressable ]"
          data-variant="outlined"
          click.trigger="next()"
          t="postSignup.defer"
        ></button>
      </div>
    </template>

    <!-- Step 2: add to the home screen -->
    <template if.bind="step === 'install'">
      <img class="post-signup-app-icon" src="/icons/icon-192x192.png" alt="" width="64" height="64">
      <h2 class="post-signup-title" t="postSignup.install.title"></h2>
      <p class="post-signup-body" t="postSignup.install.body"></p>
      <ol if.bind="installGuideShown" class="post-signup-steps">
        <li t="postSignup.install.step1"></li>
        <li t="postSignup.install.step2"></li>
        <li t="postSignup.install.step3"></li>
      </ol>
      <div class="post-signup-actions">
        <button
          if.bind="!installGuideShown"
          type="button"
          class="[ button ] [ pressable ]"
          busy-on-click.bind="() => onInstall()"
          t="postSignup.install.add"
        ></button>
        <button
          else
          type="button"
          class="[ button ] [ pressable ]"
          click.trigger="close()"
          t="postSignup.close"
        ></button>
        <button
          if.bind="!installGuideShown"
          type="button"
          class="[ button ] [ pressable ]"
          data-variant="outlined"
          click.trigger="next()"
          t="postSignup.defer"
        ></button>
      </div>
    </template>

    <!-- iOS / iPadOS: add to the home screen to receive notifications -->
    <template if.bind="step === 'iosGuide'">
      <h2 class="post-signup-title" t="postSignup.notify.title"></h2>
      <p class="post-signup-body" t="postSignup.ios.body"></p>
      <ol class="post-signup-steps">
        <li t="postSignup.ios.step1"></li>
        <li t="postSignup.ios.step2"></li>
        <li t="postSignup.ios.step3"></li>
      </ol>
      <div class="post-signup-actions">
        <button
          type="button"
          class="[ button ] [ pressable ]"
          data-variant="outlined"
          click.trigger="next()"
          t="postSignup.defer"
        ></button>
      </div>
    </template>

  </section>
</bottom-sheet>
