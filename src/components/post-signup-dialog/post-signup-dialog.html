<import from="./post-signup-dialog.css"></import>

<bottom-sheet
  open.bind="isOpen"
  heading.bind="(step === 'install' ? 'postSignup.install.title' : 'postSignup.notify.title') | t"
  sheet-closed.trigger="close()"
>
  <section class="[ post-signup-step ] [ stack ]" data-step.bind="step">

    <!-- Step 1: notifications -->
    <template if.bind="step === 'notify'">
      <div class="[ post-signup-text ] [ stack ]">
        <p if.bind="followedCount > 0" class="[ post-signup-body ] [ md-typescale-body-medium ]" t="postSignup.notify.body" t-params.bind="{ count: followedCount }"></p>
        <p else class="[ post-signup-body ] [ md-typescale-body-medium ]" t="postSignup.notify.bodyNoFollows"></p>
        <p if.bind="notifyProblem" class="[ post-signup-problem ] [ md-typescale-body-medium ]" role="status" t.bind="notifyProblem === 'blocked' ? 'postSignup.notify.blocked' : 'postSignup.notify.failed'"></p>
      </div>
      <div class="[ post-signup-actions ] [ stack ]">
        <button
          if.bind="!notifyProblem"
          type="button"
          class="[ button ] [ state-layer ]"
          busy-on-click.bind="() => onEnableNotifications()"
          t="postSignup.notify.enable"
        ></button>
        <button
          else
          type="button"
          class="[ button ] [ state-layer ]"
          click.trigger="next()"
          t="postSignup.next"
        ></button>
        <button
          if.bind="!notifyProblem"
          type="button"
          class="[ button ] [ state-layer ]"
          data-variant="outlined"
          click.trigger="next()"
          t="postSignup.defer"
        ></button>
      </div>
    </template>

    <!-- Step 2: add to the home screen -->
    <template if.bind="step === 'install'">
      <div class="[ post-signup-text ] [ stack ]">
        <img class="[ post-signup-app-icon ]" src="/icons/icon-192x192.png" alt="" width="64" height="64">
        <p class="[ post-signup-body ] [ md-typescale-body-medium ]" t="postSignup.install.body"></p>
        <ol if.bind="installGuideShown" class="[ post-signup-steps ] [ md-typescale-body-medium ]">
          <li t="postSignup.install.step1"></li>
          <li t="postSignup.install.step2"></li>
          <li t="postSignup.install.step3"></li>
        </ol>
      </div>
      <div class="[ post-signup-actions ] [ stack ]">
        <button
          if.bind="!installGuideShown"
          type="button"
          class="[ button ] [ state-layer ]"
          busy-on-click.bind="() => onInstall()"
          t="postSignup.install.add"
        ></button>
        <button
          else
          type="button"
          class="[ button ] [ state-layer ]"
          click.trigger="close()"
          t="postSignup.close"
        ></button>
        <button
          if.bind="!installGuideShown"
          type="button"
          class="[ button ] [ state-layer ]"
          data-variant="outlined"
          click.trigger="next()"
          t="postSignup.defer"
        ></button>
      </div>
    </template>

    <!-- iOS / iPadOS: add to the home screen to receive notifications -->
    <template if.bind="step === 'iosGuide'">
      <div class="[ post-signup-text ] [ stack ]">
        <p class="[ post-signup-body ] [ md-typescale-body-medium ]" t="postSignup.ios.body"></p>
        <ol class="[ post-signup-steps ] [ md-typescale-body-medium ]">
          <li t="postSignup.ios.step1"></li>
          <li t="postSignup.ios.step2"></li>
          <li t="postSignup.ios.step3"></li>
        </ol>
      </div>
      <div class="[ post-signup-actions ] [ stack ]">
        <button
          type="button"
          class="[ button ] [ state-layer ]"
          data-variant="outlined"
          click.trigger="next()"
          t="postSignup.defer"
        ></button>
      </div>
    </template>

  </section>
</bottom-sheet>
