<template>
  <import from="./celebration-overlay.css"></import>
  <import from="../confetti-burst/confetti-burst"></import>
  <import from="../celebration-message/celebration-message"></import>

  <output
    aria-live="polite"
    aria-atomic="true"
    class="[ celebration-overlay ]"
    data-state.bind="overlayState"
    click.trigger="onTap()"
    pointerdown.trigger="onTap()"
  >
    <confetti-burst if.bind="pieces.length" pieces.bind="pieces"></confetti-burst>
    <celebration-message
      message.bind="message"
      sub-message.bind="subMessage"
      hint.bind="hint"
    ></celebration-message>
  </output>
</template>
