<import from="./error-banner.css"></import>

<bottom-sheet open.to-view="errorBoundary.currentError" dismissable.bind="false" t="[aria-label]errorBanner.label">
  <section class="[ error-content card ] [ flow ]">
    <h2 class="[ error-title ] [ md-typescale-title-large ]" t="errorBanner.title"></h2>
    <!-- Fixed copy: neither the captured error's message nor its Error ID is
         shown; both stay in the report email, and the message in the console
         log (spec global/error-banner). -->
    <p class="[ error-message ] [ md-typescale-body-medium ]" t="errorBanner.message"></p>

    <footer class="[ error-actions ] [ stack ]">
      <button
        click.trigger="emailReport()"
        class="[ button ] [ state-layer ]"
        t="errorBanner.emailReport"
      ></button>
      <p
        if.bind="emailTapped"
        class="[ error-email-fallback ] [ md-typescale-body-medium ]"
        role="status"
        t="errorBanner.emailFallback"
        t-params.bind="{ address: emailAddress }"
      ></p>
      <button
        click.trigger="reload()"
        class="[ button ] [ state-layer ]"
        data-variant="outlined"
        t="errorBanner.reload"
      ></button>
      <button
        click.trigger="dismiss()"
        class="[ button ] [ state-layer ]"
        data-variant="outlined"
        t="errorBanner.dismiss"
      ></button>
    </footer>
  </section>
</bottom-sheet>
