<import from="./state-placeholder.css"></import>

<section if.bind="loading" class="state-skeleton" aria-busy="true" aria-live="polite">
  <span class="visually-hidden">Loading…</span>
  <div repeat.for="row of rowList" class="skeleton skeleton-row"></div>
</section>

<section else class="state-center">
  <svg-icon if.bind="icon" name.bind="icon" size="xl" class="state-icon"></svg-icon>
  <au-slot></au-slot>
</section>
