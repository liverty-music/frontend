<import from="./state-placeholder.css"></import>

<section if.bind="loading" class="[ state-skeleton ] [ stack ]" aria-busy="true" aria-live="polite">
  <span class="[ visually-hidden ]">Loading…</span>
  <div repeat.for="row of rowList" class="[ skeleton-row ] [ skeleton ]"></div>
</section>

<!-- The shared empty or error state (shared/styles/state-placeholder.css). -->
<section else class="[ state-placeholder ]">
  <svg-icon if.bind="icon" name.bind="icon" size="xl"></svg-icon>
  <au-slot></au-slot>
</section>
