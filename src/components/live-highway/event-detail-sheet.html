<template>
  <import from="./event-detail-sheet.css"></import>

  <bottom-sheet
    open.bind="isOpen"
    dismissable="true"
    sheet-closed.trigger="onSheetClosed()"
    t="[aria-label]eventDetail.ariaLabel"
  >
    <div if.bind="event" class="sheet-content" aria-labelledby="sheet-artist-name">
      <!-- Hero background image -->
      <div if.bind="backgroundUrl" class="sheet-hero" role="presentation">
        <img
          src.bind="backgroundUrl"
          alt=""
          loading="lazy"
          decoding="async"
          class="sheet-hero-img"
        />
      </div>

      <!-- Artist name header with dynamic color -->
      <header
        style="--artist-hue: ${event.artistHue}"
        class="sheet-artist-header hype-home"
      >
        <h2 id="sheet-artist-name" class="[ sheet-artist-name ] [ md-typescale-headline-small ]">
          ${event.artistName}
        </h2>
        <p class="[ sheet-event-title ] [ md-typescale-body-medium ]">${event.title}</p>
      </header>

      <!-- Event details -->
      <section class="sheet-details">
        <!-- Date & Time, with the add-to-calendar link -->
        <div class="detail-row">
          <span class="detail-icon"><svg-icon name="calendar" size="md"></svg-icon></span>
          <div>
            <time datetime.bind="event.date.toISOString()" class="[ detail-primary ] [ md-typescale-title-medium ]">${event.date | date:'long'}</time>
            <p
              class="[ detail-secondary ] [ md-typescale-body-medium ]"
              t="eventDetail.openStart"
              t-params.bind="{ open: openTimeOrFallback, start: event.startTime }"
            ></p>
            <a
              href.bind="calendarUrl"
              target="_blank"
              rel="noopener noreferrer"
              class="[ detail-link ] [ md-typescale-body-medium ]"
              data-testid="add-to-calendar"
              click.trigger="onCalendarOpened()"
              t="eventDetail.addToCalendar"
            ></a>
          </div>
        </div>

        <!-- Venue -->
        <div class="detail-row">
          <span class="detail-icon"><svg-icon name="map-pin" size="md"></svg-icon></span>
          <div>
            <p class="[ detail-primary ] [ md-typescale-title-medium ]">${event.venueName}</p>
            <p if.bind="event.locationLabel" class="[ detail-secondary ] [ md-typescale-body-medium ]">${event.locationLabel}</p>
            <a
              href.bind="googleMapsUrl"
              target="_blank"
              rel="noopener noreferrer"
              class="[ detail-link ] [ md-typescale-body-medium ]"
              t="eventDetail.openInGoogleMaps"
            ></a>
          </div>
        </div>
      </section>

      <!-- Out-of-range notice: the fan's hype level does not match the concert -->
      <section if.bind="outOfRange" class="sheet-out-of-range" data-testid="out-of-range">
        <p if.bind="!outOfRange.saved" class="[ out-of-range-text ] [ md-typescale-body-medium ]">
          <span if.bind="outOfRange.currentPlaces" t="[html]eventDetail.outOfRange.current" t-params.bind="{ places: outOfRange.currentPlaces }"></span>
          <span else t="eventDetail.outOfRange.none"></span>
        </p>
        <button
          if.bind="!outOfRange.saved"
          type="button"
          class="[ button out-of-range-action ] [ pressable ]"
          data-variant="outlined"
          disabled.bind="hypeUpdating"
          click.trigger="widenHype()"
        >${outOfRange.actionLabel}</button>
        <p if.bind="outOfRange.saved" class="[ out-of-range-text ] [ md-typescale-body-medium ]" t.bind="'[html]' + outOfRange.savedKey" t-params.bind="{ places: outOfRange.savedPlaces }"></p>
        <button
          if.bind="outOfRange.saved && pushAction"
          type="button"
          class="[ button push-action ] [ pressable ]"
          data-variant="outlined"
          click.trigger="pushAction.callback()"
        >${pushAction.label}</button>
      </section>

      <!-- Optional inline hint (landing page only). A real coach-mark overlay
           can't point into this top-layer dialog, so the guidance rides inline,
           right above the actions it describes. -->
      <p if.bind="actionsHint" class="[ sheet-actions-hint ] [ md-typescale-body-medium ]" role="note">
        <svg-icon name="info" size="md"></svg-icon>
        <span>${actionsHint}</span>
      </p>

      <!-- Ticket section: the notification button, the other four statuses,
           the push line and the official site button -->
      <section class="sheet-tickets" data-testid="sheet-journey" aria-labelledby="ticket-section-heading">
        <h3 id="ticket-section-heading" class="[ journey-heading ] [ md-typescale-title-small ]" t="eventDetail.ticketSection"></h3>

        <button
          if.bind="showNotifyButton"
          type="button"
          class="[ button journey-notify ] [ pressable ]"
          data-testid="journey-notify-btn"
          data-journey-status="tracking"
          data-emphasis.bind="notifyEmphasis"
          data-variant.bind="notifyVariant"
          aria-pressed.bind="status === 'tracking' ? 'true' : 'false'"
          disabled.bind="journeyUpdating"
          click.trigger="onNotifyPressed()"
          t.bind="notifyLabelKey"
        ></button>

        <div
          if.bind="isAuthenticated"
          class="journey-row"
          role="group"
          aria-labelledby="ticket-section-heading"
          aria-busy.bind="journeyUpdating"
        >
          <template repeat.for="config of rowStatuses">
            <span if.bind="config.status === 'lost'" class="journey-separator" aria-hidden="true"></span>
            <button
              type="button"
              class="[ journey-node ] [ md-typescale-label-large ]"
              md-typescale-label-large-emphasized.class="status === config.status"
              data-testid="journey-btn"
              data-journey-status.bind="config.status"
              aria-pressed.bind="status === config.status ? 'true' : 'false'"
              disabled.bind="journeyUpdating"
              click.trigger="onStatusPressed(config.status)"
            >
              <span class="[ journey-node-cue ] [ md-typescale-body-large ]" aria-hidden="true">${config.icon}</span>
              <span class="journey-node-label" t.bind="config.labelKey"></span>
            </button>
            <span
              if.bind="config.status === 'applied' || config.status === 'unpaid'"
              class="[ journey-arrow ] [ md-typescale-body-large ]"
              aria-hidden="true"
            ></span>
          </template>
        </div>

        <p if.bind="pushLine" class="[ push-line ] [ md-typescale-body-medium ]" data-testid="push-line">
          <span t.bind="pushLine.key"></span>
          <button
            if.bind="pushLine.offer && pushAction"
            type="button"
            class="[ button push-action ] [ pressable ]"
            data-variant="outlined"
            click.trigger="pushAction.callback()"
          >${pushAction.label}</button>
        </p>

        <a
          href.bind="event.sourceUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="[ button official-site ] [ pressable ]"
          data-variant="outlined"
          click.trigger="onSourceOpened()"
        >
          <svg-icon name="link" size="md"></svg-icon>
          <span t="eventDetail.viewOfficialInfo"></span>
        </a>
      </section>

      <!-- Follow CTA — All Nearby context only. Converts a discovered concert
           into a followed artist. No DNA Orb animation on success; the button
           simply flips to a static "Following" state. -->
      <section if.bind="isAllNearby && event.artist" class="sheet-follow" data-testid="all-nearby-follow">
        <button
          if.bind="!isFollowed"
          type="button"
          class="[ button follow-action ] [ pressable ]"
          disabled.bind="followUpdating"
          click.trigger="follow()"
          t="allNearby.follow.action"
        ></button>
        <p
          else
          class="[ follow-state ] [ md-typescale-label-large ]"
          data-testid="all-nearby-following"
          t="allNearby.follow.following"
        ></p>
      </section>

    </div>
  </bottom-sheet>
</template>
