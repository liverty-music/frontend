<import from="./beam-timeline.css"></import>

<!-- Laser beams — before header so header paints on top -->
<div class="[ beam-overlay ]" if.bind="showBeams && laserBeams.length > 0">
  <div
    repeat.for="b of laserBeams"
    class="[ laser-beam ]"
    data-beam-timeline.bind="b.timeline"
    beam-vars="hue.bind: b.hue; left.bind: b.left; right.bind: b.right; timeline.bind: b.timeline"
  ></div>
</div>

<!-- Concert grid (stage header + scrollable lanes) -->
<!-- `data-beams` is the only thing the beam effect changes on the timetable:
     the stylesheet declares each matched card's view timeline under it, from the
     name every card already carries. Toggling it rebuilds nothing. -->
<section
  class="[ concert-grid-wrapper ]"
  data-hide-away.bind="hideAway"
  data-beams.bind="showBeams || undefined"
>
  <!-- The stage header needs no data, so it is not gated on having any: it is
       the App Shell part of the timetable and must be on screen from the first
       render, while the concerts are still loading. Gating it on
       `dateGroups.length` withheld the frame for exactly the window it is there
       to fill. -->
  <header class="[ stage-header ]">
    <span data-stage="home" class="md-typescale-headline-small" t="dashboard.lane.home"></span>
    <span data-stage="near" class="md-typescale-headline-small" t="dashboard.lane.near"></span>
    <span if.bind="!hideAway" data-stage="away" class="md-typescale-headline-small" t="dashboard.lane.away"></span>
  </header>

  <ol class="[ concert-scroll ]" data-testid="concert-scroll" scrollend.trigger="onScrollEnd()">
    <!-- Loading placeholder. Built from the timetable's own structure — real
         date groups, real lanes, card-shaped blocks — rather than a generic bar
         stack, so the swap to concerts moves nothing. The stage header above is
         already on screen, so what the fan sees while data loads is the actual
         frame with its lanes filling in. -->
    <template if.bind="showSkeleton">
    <li
      class="[ date-group ] [ date-group-skeleton ]"
      repeat.for="row of skeletonRows"
      data-testid="dashboard-loading"
      aria-hidden="true"
    >
      <header class="[ date-separator ]">
        <span class="skeleton skeleton-date"></span>
      </header>
      <ol class="[ lane-grid ]">
        <li class="[ lane ] [ md-typescale-body-medium ]" data-lane="home"><span class="skeleton skeleton-card"></span></li>
        <li class="[ lane ] [ md-typescale-body-medium ]" data-lane="near"><span class="skeleton skeleton-card"></span></li>
        <li if.bind="!hideAway" class="[ lane ] [ md-typescale-body-medium ]" data-lane="away"><span class="skeleton skeleton-card"></span></li>
      </ol>
    </li>
    </template>

    <!-- Edge markers of the date window. Seeing one grows the window on that
         side; they are empty and outside the accessibility tree. -->
    <li class="[ window-edge ]" ref="topEdge" aria-hidden="true"></li>

    <!-- The date group is the unit of the date window, so it is addressable by
         class rather than by its position in the markup. Only the groups in the
         window are built. -->
    <li
      class="[ date-group ]"
      repeat.for="group of visibleGroups; key.bind: group.dateKey"
      data-date-key.bind="group.dateKey"
    >
      <div if.bind="group.isFirstOfMonth" class="[ month-separator ] [ md-typescale-label-small ]" aria-hidden="true">
        ${group.monthSeparatorLabel}
      </div>
      <header class="[ date-separator ]">
        <time class="md-typescale-title-large" datetime.bind="group.dateKey">${group.label}</time>
      </header>

      <ol class="[ lane-grid ]" aria-label="Concerts">
        <li class="[ lane ] [ md-typescale-body-medium ]" data-lane="home" data-empty.bind="group.home.length === 0">
          <event-card
            repeat.for="ev of group.home; key.bind: ev.id"
            event.bind="ev"
            lane="home"
            readonly.bind="isReadonly"
            show-venue-always.bind="showVenueAlways"
          ></event-card>
        </li>
        <li class="[ lane ] [ md-typescale-body-medium ]" data-lane="near" data-empty.bind="group.nearby.length === 0">
          <event-card
            repeat.for="ev of group.nearby; key.bind: ev.id"
            event.bind="ev"
            lane="nearby"
            readonly.bind="isReadonly"
            show-venue-always.bind="showVenueAlways"
          ></event-card>
        </li>
        <li if.bind="!hideAway" class="[ lane ] [ md-typescale-body-medium ]" data-lane="away" data-empty.bind="group.away.length === 0">
          <event-card
            repeat.for="ev of group.away; key.bind: ev.id"
            event.bind="ev"
            lane="away"
            readonly.bind="isReadonly"
            show-venue-always.bind="showVenueAlways"
          ></event-card>
        </li>
      </ol>
    </li>

    <li class="[ window-edge ]" ref="bottomEdge" aria-hidden="true"></li>

    <!-- Month jump: previous and next month in one capsule, stuck to the
         bottom of the list above the FAB. Each button is hidden when there
         is no month in its direction; the stylesheet also hides the capsule
         until the list has been scrolled and while the FAB is open. -->
    <li
      if.bind="visibleGroups.length > 0"
      class="[ month-jump ]"
      data-testid="month-jump"
      data-has-prev.bind="prevMonth !== null"
      data-has-next.bind="nextMonth !== null"
      data-moved.bind="moved"
    >
      <div class="[ month-jump-capsule ]">
        <button
          type="button"
          class="[ month-jump-button ] [ state-layer ]"
          data-direction="prev"
          t="[aria-label]dashboard.monthJump.prev"
          t-params.bind="{ date: prevMonth }"
          click.trigger="jumpToMonth(-1)"
        >
          <svg-icon name="skip-up" size="md"></svg-icon>
        </button>
        <button
          type="button"
          class="[ month-jump-button ] [ state-layer ]"
          data-direction="next"
          t="[aria-label]dashboard.monthJump.next"
          t-params.bind="{ date: nextMonth }"
          click.trigger="jumpToMonth(1)"
        >
          <svg-icon name="skip-down" size="md"></svg-icon>
        </button>
      </div>
    </li>
  </ol>
</section>
