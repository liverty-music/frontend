<template>
  <import from="./event-card.css"></import>

  <div
    data-live-card
    data-lane.bind="lane"
    data-matched.bind="event.matched || undefined"
    click.trigger="onClick()"
    keydown.trigger="handleKeydown($event)"
    role="button"
    tabindex="0"
    style="--artist-hue: ${event.artistHue}"
    data-beam-name.one-time="beamName"
    class="[ event-card ]"
  >
    <span class="artist-name">
      ${event.artistName}
    </span>
    <span if.bind="showLocation" class="location-label">
      ${displayedLocation}
    </span>
    <span
      if.bind="journeyConfig"
      data-journey-status.bind="event.journeyStatus"
      class="journey-badge"
      data-testid="journey-badge"
      role="img"
      aria-label.bind="journeyConfig.labelKey | t"
    >${journeyConfig.icon}</span>
    <span
      if.bind="isPurchased"
      class="journey-badge"
      data-testid="purchased-badge"
      role="img"
      t="[aria-label]eventCard.purchased"
    >🎫</span>
  </div>
</template>
