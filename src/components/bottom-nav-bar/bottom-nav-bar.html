<import from="./bottom-nav-tab/bottom-nav-tab"></import>

<nav class="[ nav-bar ]" data-notch.bind="fabMenu.actions.length > 0">
  <bottom-nav-tab
    repeat.for="tab of tabs; key.bind: tab.id"
    tab.bind="tab"
    active.bind="tab.isActive || tab.id === section"
    click.capture="switchTab($event, tab)"
  ></bottom-nav-tab>
</nav>
