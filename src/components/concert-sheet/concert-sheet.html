<template>
  <import from="./concert-sheet.css"></import>
  <import from="./concert-sheet-hero"></import>
  <import from="./out-of-range-notice"></import>
  <import from="./concert-sheet-hint"></import>
  <import from="./journey-status-row"></import>
  <import from="./concert-follow-cta"></import>
  <import from="../confirm-dialog/confirm-dialog"></import>

  <bottom-sheet
    open.bind="isOpen"
    dismissable="true"
    sheet-closed.trigger="onSheetClosed()"
    t="[aria-label]concertSheet.ariaLabel"
  >
    <div if.bind="event" class="[ sheet-content ] [ flow ]">
      <!-- Hero background image -->
      <div
        as-element="concert-sheet-hero"
        if.bind="backgroundUrl"
        class="sheet-hero"
        role="presentation"
        src.bind="backgroundUrl"
      ></div>

      <!-- Artist name header. In the Concerts view a signed-in fan's follow
           action sits on the right of the name, seen without scrolling; a long
           name wraps while the button keeps its size. -->
      <header class="[ sheet-artist-header ] [ flow ]">
        <div class="sheet-artist-row">
          <h2 class="[ sheet-artist-name ] [ md-typescale-headline-small ]">
            ${event.artistName}
          </h2>
          <div
            as-element="concert-follow-cta"
            if.bind="showFollowAction"
            class="sheet-follow"
            data-testid="discovery-concerts-follow"
            followed.bind="isFollowed"
            updating.bind="followUpdating"
            follow.trigger="follow()"
          ></div>
        </div>
        <p class="[ sheet-event-title ] [ md-typescale-body-medium ]">${event.title}</p>
      </header>

      <!-- Event details -->
      <section class="[ sheet-details ] [ stack ]">
        <!-- Date & Time, with the add-to-calendar link -->
        <div class="detail-row">
          <span class="detail-icon"><svg-icon name="calendar" size="lg"></svg-icon></span>
          <div>
            <time datetime.bind="event.date.toISOString()" class="[ detail-primary ] [ md-typescale-title-medium ]">${event.date | date:'long'}</time>
            <p
              class="[ detail-secondary ] [ md-typescale-body-medium ]"
              t="concertSheet.openStart"
              t-params.bind="{ open: openTimeOrFallback, start: event.startTime }"
            ></p>
            <a
              href.bind="calendarUrl"
              target="_blank"
              rel="noopener noreferrer"
              class="[ text-link ] [ md-typescale-body-medium ]"
              data-variant="standalone"
              data-testid="add-to-calendar"
              click.trigger="onCalendarOpened()"
              t="concertSheet.addToCalendar"
            ></a>
          </div>
        </div>

        <!-- Venue -->
        <div class="detail-row">
          <span class="detail-icon"><svg-icon name="map-pin" size="lg"></svg-icon></span>
          <div>
            <p class="[ detail-primary ] [ md-typescale-title-medium ]">${event.venueName}</p>
            <p if.bind="event.locationLabel" class="[ detail-secondary ] [ md-typescale-body-medium ]">${event.locationLabel}</p>
            <a
              href.bind="googleMapsUrl"
              target="_blank"
              rel="noopener noreferrer"
              class="[ text-link ] [ md-typescale-body-medium ]"
              data-variant="standalone"
              t="concertSheet.openInGoogleMaps"
            ></a>
          </div>
        </div>
      </section>

      <!-- Out-of-range notice: the fan's hype level does not match the concert -->
      <section
        as-element="out-of-range-notice"
        if.bind="outOfRange"
        class="[ sheet-out-of-range card ] [ stack ]"
        data-testid="out-of-range"
        notice.bind="outOfRange"
        updating.bind="hypeUpdating"
        push-action.bind="pushAction"
        widen.trigger="widenHype()"
      ></section>

      <!-- Optional inline hint (landing page only). A real coach-mark overlay
           can't point into this top-layer dialog, so the guidance rides inline,
           right above the actions it describes. -->
      <p
        as-element="concert-sheet-hint"
        if.bind="actionsHint"
        class="[ sheet-actions-hint ] [ md-typescale-body-medium ]"
        role="note"
        text.bind="actionsHint"
      ></p>

      <!-- The notification button's guide moment: its line rides in the same
           slot, inside the sheet, right above the ticket section; the button
           glows and swings. Announced once as a status. -->
      <p
        as-element="concert-sheet-hint"
        if.bind="notifyMomentShown"
        class="[ sheet-actions-hint ] [ md-typescale-body-medium ]"
        role="status"
        data-testid="sheet-notify-guide"
        text.bind="'guide.sheetNotify' | t"
      ></p>

      <!-- Ticket section: the notification button, the other four statuses,
           the push line and the official site button -->
      <section class="[ sheet-tickets ] [ stack ]" data-testid="sheet-journey" aria-labelledby="ticket-section-heading">
        <h3 id="ticket-section-heading" class="[ journey-heading ] [ md-typescale-title-small ]" t="concertSheet.ticketSection"></h3>

        <button
          if.bind="showNotifyButton"
          type="button"
          class="[ button journey-notify ] [ state-layer ]"
          data-testid="journey-notify-btn"
          data-journey-status="tracking"
          data-emphasis.bind="notifyEmphasis"
          data-variant.bind="notifyVariant"
          aria-pressed.bind="status === 'tracking' ? 'true' : 'false'"
          disabled.bind="journeyUpdating"
          click.trigger="onNotifyPressed()"
          guide-target="value: sheet.notify; shape: bell"
          t.bind="notifyLabelKey"
        ></button>

        <div
          as-element="journey-status-row"
          if.bind="isAuthenticated"
          class="[ journey-row ] [ cluster ]"
          role="group"
          aria-labelledby="ticket-section-heading"
          aria-busy.bind="journeyUpdating"
          statuses.bind="rowStatuses"
          status.bind="status"
          disabled.bind="journeyUpdating"
          status-pressed.trigger="onStatusPressed($event.detail)"
        ></div>

        <p if.bind="pushLine" class="[ push-line ] [ cluster ] [ md-typescale-body-medium ]" data-testid="push-line">
          <span t.bind="pushLine.key"></span>
          <button
            if.bind="pushLine.offer && pushAction"
            type="button"
            class="[ button push-action ] [ state-layer ]"
            data-variant="outlined"
            click.trigger="pushAction.callback()"
          >${pushAction.label}</button>
        </p>

        <a
          href.bind="event.sourceUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="[ button official-site ] [ state-layer ]"
          data-variant="outlined"
          click.trigger="onSourceOpened()"
        >
          <svg-icon name="link" size="md"></svg-icon>
          <span t="concertSheet.viewOfficialInfo"></span>
        </a>
      </section>

    </div>
  </bottom-sheet>

  <!-- A guest's press of the notification button: notifications need an
       account. A modal dialog over the sheet; 「あとで」 takes focus first. -->
  <confirm-dialog
    component.ref="signUpDialog"
    test-id="sign-up-dialog"
    heading.bind="'concertSheet.signUpDialog.title' | t"
    body.bind="'concertSheet.signUpDialog.body' | t"
    confirm-label.bind="'concertSheet.signUpDialog.signUp' | t"
    cancel-label.bind="'concertSheet.signUpDialog.later' | t"
  ></confirm-dialog>
</template>
