<section class="[ inline-error-layout ]">
  <div class="inline-error-content">
    <svg-icon name="info" size="xl" class="inline-error-icon"></svg-icon>
    <p class="[ inline-error-message ] [ md-typescale-body-medium ]">${message}</p>
  </div>
  <button
    if.bind="retryAction"
    click.trigger="retry()"
    class="[ button ] [ pressable ]"
    t="common.retry"
  ></button>
</section>
