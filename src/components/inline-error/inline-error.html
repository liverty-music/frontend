<!-- The shared empty or error state (shared/styles/state-placeholder.css)
     with the info icon and an optional retry. -->
<section class="[ state-placeholder ]">
  <svg-icon name="info" size="xl"></svg-icon>
  <p class="[ md-typescale-body-medium ]">${message}</p>
  <button
    if.bind="retryAction"
    click.trigger="retry()"
    class="[ button ] [ state-layer ]"
    t="common.retry"
  ></button>
</section>
