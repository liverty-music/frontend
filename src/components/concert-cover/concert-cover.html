<import from="./concert-cover.css"></import>

<figure class="concert-cover">
  <img
    if.bind="url"
    src.bind="url"
    alt=""
    decoding="async"
    fetchpriority="high"
    class="[ concert-cover-img ] [ image-arrive ]"
    data-loaded.bind="loaded"
    load.trigger="loaded = true"
    data-testid="concert-cover"
  />
  <div else class="[ concert-cover-placeholder ] [ md-typescale-display-small ]" data-testid="concert-cover-placeholder" role="presentation">
    <svg-icon name="music" size="md"></svg-icon>
  </div>
</figure>
