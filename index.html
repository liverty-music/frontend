<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <!-- Cascade layer order, declared before any stylesheet. The first `@layer`
       the browser reads fixes the order, and a CSS chunk shared between entries
       (snack-bar, circular-progress) is linked before src's main CSS, so without this
       its `block` layer would rank below `reset` and `global`. Must equal the
       statement at the top of src/styles/main.css (test/layer-order.node.spec.ts). -->
  <style>@layer reset, tokens, global, composition, utility, block, exception;</style>
  <title>Liverty Music</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1333">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'wasm-unsafe-eval' blob: https://eu-assets.i.posthog.com https://js.stripe.com;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    connect-src 'self' https://*.zitadel.cloud https://*.liverty-music.app https://eu.i.posthog.com https://eu-assets.i.posthog.com https://api.stripe.com;
    img-src 'self' data: blob: https://assets.fanart.tv https://eu.i.posthog.com https://cdn.liverty-music.app https://cdn.dev.liverty-music.app;
    frame-src https://*.zitadel.cloud https://js.stripe.com https://hooks.stripe.com;
    worker-src 'self' blob:;
  ">
  <!-- Link previews. On /events/* the fan web's Caddy replaces the comment
       below with the event's own og:/twitter: tags, written first so that
       crawlers (which take the first occurrence) use them; everywhere else the
       comment is inert. The site-wide defaults follow it. -->
  <!--{{httpInclude (printf "/__link-preview%s" .OriginalReq.URL.Path)}}-->
  <meta name="description" content="大好きなあのバンドのライブ、絶対に見逃さない。公式サイト、SNS、チケットサイトのパトロールはもう終わり。">
  <meta property="og:title" content="Liverty Music">
  <meta property="og:description" content="大好きなあのバンドのライブ、絶対に見逃さない。公式サイト、SNS、チケットサイトのパトロールはもう終わり。">
  <meta property="og:image" content="https://liverty-music.app/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://liverty-music.app/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Liverty Music">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:locale:alternate" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="/config-prefetch.js"></script>
  <script type="module" src="/src/main.ts"></script>
  <base href="/">
  <style>
    #callback-loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    #callback-loading[hidden] { display: none; }

    #callback-loading::before {
      content: "";
      inline-size: 2rem;
      block-size: 2rem;
      border: 2px solid currentColor;
      border-block-start-color: transparent;
      border-radius: 50%;
      animation: callback-spin 1s linear infinite;
    }

    @keyframes callback-spin { to { rotate: 1turn; } }
  </style>
</head>

<body class="bg-surface-base text-text-primary">
  <!-- Sign-in callback indicator. The callback route finishes the sign-in
       (token exchange, user provisioning: 1 to 4.5 s in prod) inside canLoad,
       before anything renders, so this static spinner is the only feedback in
       that wait. Hidden by default; main.ts shows it on /auth/callback only and
       removes it once Aurelia has started. Other screens render their own
       loading state (Discovery's ghost bubbles), so they show nothing here. -->
  <div id="callback-loading" role="status" aria-label="Loading" hidden></div>
  <app-shell></app-shell>
</body>

</html>
