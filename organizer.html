<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <!-- Cascade layer order, declared before any stylesheet. The first `@layer`
       the browser reads fixes the order, and a CSS chunk shared between entries
       (snack-bar, circular-progress) is linked before organizer's main CSS, so without this
       its `block` layer would rank below `reset` and `global`. Must equal the
       statement at the top of organizer/styles/main.css (test/layer-order.node.spec.ts). -->
  <style>@layer reset, tokens, global, composition, block;</style>
  <title>Liverty Music Organizer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'wasm-unsafe-eval' blob:;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    connect-src 'self' https://*.zitadel.cloud https://*.liverty-music.app https://storage.googleapis.com;
    img-src 'self' data: blob: https://*.liverty-music.app;
    frame-src https://*.zitadel.cloud;
    worker-src 'self' blob:;
  ">
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script type="module" src="/organizer/main.ts"></script>
  <base href="/">
</head>

<body>
  <div id="bootstrap-loading" role="status" aria-live="polite" aria-label="Loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#888;font:600 14px/1 system-ui;background:transparent;pointer-events:none">Loading…</div>
  <organizer-shell></organizer-shell>
</body>

</html>
